  // ── 엑셀(CSV)로 내려받기: 지금 보고 있는 표 그대로 ──
  function csv() {
    const rows = [];
    if (view === 'grid') {
      if (!D) return;
      const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate(), by = byNoWd();
      const head = ['직원', '부서']; for (let d = 1; d <= last; d++) head.push(d + '일'); rows.push(head);
      gridStaff(by).forEach((s) => {
        const line = [s.name, s.dept || ''];
        for (let d = 1; d <= last; d++) {
          const items = (by[s.no] || {})[ym + '-' + String(d).padStart(2, '0')] || [], c = cellInfo(items, '');
          line.push(items.length ? (c.ins.length ? c.ins[0].time : '') + '~' + (c.outs.length ? c.outs[c.outs.length - 1].time : '') : '');
        }
        rows.push(line);
      });
    } else if (view === 'list') {
      if (!D) return;
      rows.push(['근무일', '이름', '구분', '기록 날짜', '시각', '장소', '판정']);
      listRows().forEach((r) => rows.push([r.wd, r.name, r.type, r.day, r.time, r.place, r.how]));
    } else {                                         // 화면에 보이는 표를 그대로
      const tb = document.querySelector('#view table');
      if (!tb) { alert('내려받을 표가 없어요'); return; }
      tb.querySelectorAll('tr').forEach((tr) => rows.push(Array.from(tr.children).map((c) => {
        const i = c.querySelector('input:not([type=checkbox])'), k = c.querySelector('input[type=checkbox]'), s = c.querySelector('select');
        return i ? i.value : s ? s.value : k ? (k.checked ? 'O' : '') : c.querySelector('button') && !c.querySelector('.chip') ? '' : c.innerText.replace(/\s+/g, ' ').trim();
      })));
    }
    const text = '﻿' + rows.map((l) => l.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    a.download = 'KRF출퇴근_' + (MONTHLY[view] ? ym + '_' : '') + TITLE[view].replace(/\s/g, '') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ── 누르기·바꾸기 ──
  function moveMonth(n) { const [y, m] = ym.split('-').map(Number); ym = ymStr(new Date(y, m - 1 + n, 1)); if (ym > ymStr(new Date())) ym = ymStr(new Date()); closeDrawer(); load(); loadFor(view); }
  function go(v) { view = v; store.set('pcView', v); render(); loadFor(v); }
  document.addEventListener('click', async (ev) => {
    const nav = ev.target.closest('aside .nav');
    if (nav) { go(nav.dataset.view); return; }
    const sh = ev.target.closest('th[data-sort]');
    if (sh) { const k = sh.dataset.sort; sort = { k: k, dir: sort.k === k ? -sort.dir : 1 }; renderList(); return; }
    const b = ev.target.closest('[data-act]');
    if (b) {
      const act = b.dataset.act, tr = b.closest('tr');
      if (act === 'prev') return moveMonth(-1);
      if (act === 'next') return moveMonth(1);
      if (act === 'now') { ym = ymStr(new Date()); closeDrawer(); load(); loadFor(view); return; }
      if (act === 'reload') {
        if (busy || q.length) { alert('저장이 끝난 뒤에 눌러 주세요'); return; }
        delete cache[ym]; delete LC[ym]; Object.keys(SH).forEach((k) => { if (k.indexOf(ym + '|') === 0) delete SH[k]; }); load();
        if (view === 'today' || view === 'staff') { T = null; render(); }
        if (view === 'place') { PL = null; render(); }
        loadFor(view);
        return;
      }
      if (act === 'csv') return csv();
      if (act === 'print') { window.print(); return; }
      if (act === 'cardAll') {             // 모든 직원 카드를 한 장씩 이어서 인쇄
        if (!D) return;
        const staff = cardStaff().filter((x) => x.status !== '퇴사' || Object.keys(byNoWd()[x.no] || {}).length);
        $('view').innerHTML = '<div class="pad"><div class="kcards">' + staff.map(cardHtml).join('') + '</div></div>';
        setTimeout(() => { window.print(); renderCard(); }, 50);
        return;
      }
      if (act === 'closeDrawer') { closeDrawer(); return; }
      if (act === 'undo') { const t = $('toast'); if (t._undo) { const f = t._undo; t._undo = null; t.classList.add('hidden'); f(); } return; }
      if (act === 'del') { const rec = recById(b.closest('[data-id]').dataset.id); if (rec) delRec(rec); return; }
      if (act === 'add' && dk) { addRec(dk.no, dk.wd, { type: $('aType').value, time: $('aTime').value, nd: $('aNd').checked, place: $('aPlace').value }); return; }
      if (act === 'goMiss') { ym = ymStr(new Date()); go('miss'); load(); return; }
      if (act === 'missAdd') { addRec(tr.dataset.no, tr.dataset.wd, { type: tr.dataset.type, time: tr.querySelector('.mT').value, nd: tr.querySelector('.mN').checked, place: tr.querySelector('.mP').value }); return; }
      if (act === 'bulkClear') { sel.clear(); renderList(); return; }
      if (act === 'bulkPlace') {
        const p = $('bulkPlace').value, recs = Array.from(sel).map(recById).filter((r) => r && r.place !== p);
        if (!p) { alert('바꿀 장소를 골라 주세요'); return; }
        if (!recs.length) { alert('바꿀 기록이 없어요 (이미 그 장소예요)'); return; }
        if (!confirm(recs.length + '건의 장소를 "' + p + '"(으)로 바꿀까요?')) return;
        recs.forEach((r) => saveEdit(r, { type: r.type, time: r.time, nd: r.day !== r.wd, place: p }, true));
        sel.clear(); renderList(); toast(recs.length + '건의 장소를 ' + p + '(으)로 바꿨어요');
        return;
      }
      if (act === 'bulkDel') {
        const recs = Array.from(sel).map(recById).filter((r) => r);
        if (!recs.length || !confirm(recs.length + '건의 기록을 지울까요?\n(지운 기록은 수정 이력에서 하나씩 되살릴 수 있어요)')) return;
        recs.sort((x, y) => (Number(y.row) || 0) - (Number(x.row) || 0)).forEach(dropRec);   // 아래 줄부터 지워야 줄 번호가 안 밀림
        renderList(); toast(recs.length + '건을 지웠어요');
        return;
      }
      if (act === 'approve' || act === 'reject') {
        if (act === 'reject' && !confirm(b.dataset.name + '님의 등록 신청을 거절할까요?')) return;
        b.disabled = true;
        const r = await call('adminDo', { op: act, no: b.dataset.no });
        if (!r || !r.ok) alert((r && r.error) || '처리하지 못했어요. 인터넷 연결을 확인해 주세요');
        else toast(b.dataset.name + '님 등록 신청을 ' + (act === 'approve' ? '승인했어요' : '거절했어요'));
        loadToday();
        return;
      }
      if (act === 'restore') {
        if (!confirm(b.dataset.desc + ' 기록을 되살릴까요?')) return;
        b.disabled = true; needReload = true;
        enqueue({ op: 'restore', log: /^\d+$/.test(b.dataset.log) ? Number(b.dataset.log) : b.dataset.log }, b.dataset.desc + ' 되살리기');
        return;
      }
      if (act === 'staffAdd') {
        const name = $('sName').value.trim();
        if (!name) { alert('이름을 넣어 주세요'); return; }
        const newNo = $('sNo').value.trim();
        if (newNo && !/^\d{1,5}$/.test(newNo)) { alert('사번은 숫자로 넣어 주세요'); return; }
        if (newNo && T.staff.some((e) => String(e.no) === String(Number(newNo)))) { alert(Number(newNo) + '번은 이미 다른 직원이 쓰고 있어요'); return; }
        if (!confirm(name + '님을 ' + $('sDept').value + ' 직원으로 추가할까요?' + (newNo ? '\n사번: ' + Number(newNo) + '번' : '\n사번: 자동'))) return;
        b.disabled = true;
        const r = await call('adminStaffSave', { name: name, dept: $('sDept').value, newNo: newNo });
        await staffDo(r, name + '님을 추가했어요' + (r && r.no ? ' (' + r.no + '번)' : ''));
        return;
      }
      if (act === 'staffDel') {
        if (!confirm(tr.dataset.name + '님(' + tr.dataset.no + '번)을 직원 목록에서 지울까요?\n출퇴근 기록이 있으면 지워지지 않아요. 그때는 상태를 \'퇴사\'로 바꿔 주세요.')) return;
        b.disabled = true;
        const r = await call('adminStaffDelete', { no: tr.dataset.no, name: tr.dataset.name });
        b.disabled = false;
        if (!r || !r.ok) { alert((r && r.error) || '지우지 못했어요. 인터넷 연결을 확인해 주세요'); return; }
        await staffDo(r, tr.dataset.name + '님을 지웠어요');
        return;
      }
      if (act === 'staffReset') {
        if (!confirm(tr.dataset.name + '님의 휴대폰 등록을 초기화할까요?\n초기화하면 그 휴대폰에서 다시 이름을 고르고 승인을 받아야 해요.')) return;
        b.disabled = true;
        await staffDo(await call('adminDo', { op: 'reset', no: tr.dataset.no }), tr.dataset.name + '님의 휴대폰 등록을 초기화했어요');
        return;
      }
      if (act === 'placeAdd' || act === 'placeSave') {
        let p;
        if (act === 'placeAdd') p = { name: $('pName').value.trim(), addr: $('pAddr').value.trim(), radius: $('pRad').value, lat: '', lng: '' };
        else {
          const cur = PL.places.filter((x) => String(x.row) === tr.dataset.row)[0], addr = tr.querySelector('.pA').value.trim();
          let lat = tr.querySelector('.pLat').value.trim(), lng = tr.querySelector('.pLng').value.trim();
          if (addr !== cur.addr && lat === String(cur.lat) && lng === String(cur.lng)) { lat = ''; lng = ''; }   // 주소만 바꿨으면 위치는 주소로 다시 계산
          p = { row: cur.row, name: cur.name, addr: addr, radius: tr.querySelector('.pR').value, lat: lat, lng: lng };
        }
        if (!p.name) { alert('장소 이름을 넣어 주세요'); return; }
        b.disabled = true;
        const r = await call('adminPlaceSave', p);
        b.disabled = false;
        if (!r || !r.ok) { alert((r && r.error) || '저장하지 못했어요. 인터넷 연결을 확인해 주세요'); return; }
        toast(p.name + ' 장소를 ' + (act === 'placeAdd' ? '추가했어요' : '저장했어요'));
        dropMonths(); load(true); loadPlaces();
        return;
      }
      if (act === 'placeDel') {
        const cur = PL.places.filter((x) => String(x.row) === tr.dataset.row)[0];
        if (!cur || !confirm(cur.name + ' 장소를 지울까요?\n(그 장소로 찍힌 기록이 있으면 지워지지 않아요)')) return;
        b.disabled = true;
        const r = await call('adminPlaceDelete', { row: cur.row, name: cur.name });
        b.disabled = false;
        if (!r || !r.ok) { alert((r && r.error) || '지우지 못했어요. 인터넷 연결을 확인해 주세요'); return; }
        toast(cur.name + ' 장소를 지웠어요');
        dropMonths(); load(true); loadPlaces();
        return;
      }
      if (act === 'leave') {
        if (!confirm('이 PC의 연결을 끊을까요?\n다시 쓰려면 휴대폰에서 숫자를 넣어 다시 연결해야 해요.')) return;
        await call('superLeave');
        location.reload();
        return;
      }
      return;
    }
    const td = ev.target.closest('.grid td.c');
    if (td && D) { dk = { no: td.dataset.no, wd: td.dataset.wd }; document.querySelectorAll('.grid td.sel').forEach((e) => e.classList.remove('sel')); td.classList.add('sel'); renderDrawer(); }
  });
  document.addEventListener('change', async (ev) => {
    const t = ev.target;
    if (t.id === 'staffAll') { staffAll = t.checked; renderStaff(); return; }
    if (t.id === 'shPlace') { shPlace = t.value; store.set('shPlace', shPlace); renderSheet(); loadSheet(); return; }
    if (t.id === 'cardSel') { cardNo = t.value; store.set('cardNo', cardNo); renderCard(); return; }
    if (t.matches('[data-selall]')) { sel.clear(); if (t.checked) listRows().forEach((r) => sel.add(r.id)); renderList(); return; }
    if (t.matches('[data-sel]')) { const id = t.closest('[data-id]').dataset.id; if (t.checked) sel.add(id); else sel.delete(id); bulkBar(); return; }
    const f = t.closest('[data-fil]');
    if (f) { fil[f.dataset.fil] = f.type === 'checkbox' ? f.checked : f.value; renderList(); return; }
    const sf = t.closest('[data-sf]');
    if (sf) {
      const tr = sf.closest('tr'), no = tr.dataset.no, k = sf.dataset.sf, nm = tr.dataset.name;
      if (k === 'name' || k === 'dept') {
        const name = tr.querySelector('[data-sf="name"]').value.trim();
        if (!name) { alert('이름을 넣어 주세요'); renderStaff(); return; }
        await staffDo(await call('adminStaffSave', { no: no, name: name, dept: tr.querySelector('[data-sf="dept"]').value }), nm + '님 정보를 고쳤어요');
      } else if (k === 'status') {
        if (sf.value === '퇴사' && !confirm(nm + '님을 퇴사로 바꿀까요?\n퇴사한 직원은 출퇴근을 찍을 수 없어요.')) { renderStaff(); return; }
        await staffDo(await call('adminDo', { op: 'status', no: no, value: sf.value }), nm + '님을 ' + sf.value + '(으)로 바꿨어요');
      } else await staffDo(await call('adminDo', { op: k, no: no, value: sf.checked ? '1' : '0' }), nm + '님의 ' + (k === 'admin' ? '관리자 권한' : '같이 찍기') + '을 ' + (sf.checked ? '켰어요' : '껐어요'));
      return;
    }
    const el = t.closest('[data-f]');
    if (!el) return;
    const tr = el.closest('[data-id]'), rec = tr && recById(tr.dataset.id);
    if (!rec) return;
    const ok = saveEdit(rec, readRow(tr));
    if (view === 'grid') { renderGrid(); if (!ok) renderDrawer(); }   // 표는 다시 그리고, 고치던 줄은 그대로 둠(틀렸을 때만 되돌림)
    else if (!ok) renderList();
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && dk) closeDrawer(); });

  stat();
  boot();
})();
</script>
</body>
</html>
