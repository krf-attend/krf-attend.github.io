<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KRF출퇴근 관리 (PC)</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#e7e9ee; --line2:#f0f2f5; --ink:#191f28; --ink2:#333d4b; --sub:#6b7684; --mute:#8b95a1;
          --pri:#3182f6; --pri-d:#1b64da; --pri-bg:#e8f3ff; --ok:#12855a; --out:#c2620a; --bad:#e5484d; --bad-bg:#ffeff0; --warn-bg:#fff7e0; --warn:#946200; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', 'Noto Sans KR', sans-serif; color:var(--ink); background:var(--bg); font-size:14.5px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
  .hidden { display:none !important; }
  button, select, input, textarea { font:inherit; letter-spacing:inherit; color:inherit; }
  button { cursor:pointer; }
  .ic { flex:none; vertical-align:-3px; }
  /* 연결 화면 */
  #pair { height:100%; display:flex; align-items:center; justify-content:center; }
  #pair .box { background:#fff; border-radius:20px; padding:40px 48px; text-align:center; box-shadow:0 8px 40px rgba(25,31,40,.08); max-width:520px; }
  #pair h1 { margin:0 0 6px; font-size:22px; font-weight:700; }
  #code { font-size:60px; font-weight:800; letter-spacing:8px; margin:22px 0; color:var(--pri); font-variant-numeric:tabular-nums; }
  #pair ol { text-align:left; line-height:2; color:var(--ink2); margin:0; padding:16px 20px 16px 38px; background:var(--bg); border-radius:12px; }
  /* 틀 */
  #app { height:100%; display:flex; }
  aside { width:216px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 12px 14px; flex:none; }
  .brand { display:flex; align-items:center; gap:10px; padding:2px 8px 18px; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:var(--pri); color:#fff; display:flex; align-items:center; justify-content:center; }
  .brand b { font-size:15.5px; font-weight:700; display:block; line-height:1.2; }
  .brand small { color:var(--mute); font-size:12px; }
  .grp { font-size:11.5px; color:var(--mute); font-weight:600; padding:14px 10px 6px; }
  aside .nav { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; color:var(--ink2); padding:9px 10px; border-radius:9px; font-size:14.5px; font-weight:500; }
  aside .nav:hover { background:var(--line2); }
  aside .nav.sel { background:var(--pri-bg); color:var(--pri-d); font-weight:650; }
  aside .nav .n { margin-left:auto; font-size:11.5px; font-weight:700; background:var(--bad); color:#fff; border-radius:99px; padding:1px 7px; }
  aside .foot { margin-top:auto; font-size:12px; color:var(--mute); line-height:1.9; padding:10px 10px 0; border-top:1px solid var(--line2); }
  aside .foot button, aside .foot a { background:none; border:none; color:var(--sub); padding:0; font-size:12px; text-decoration:none; }
  aside .foot button:hover, aside .foot a:hover { color:var(--pri); text-decoration:underline; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .top { display:flex; align-items:center; gap:10px; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; min-height:64px; }
  .top h2 { margin:0 6px 0 0; font-size:19px; font-weight:700; }
  .mon { display:flex; align-items:center; background:var(--bg); border-radius:10px; padding:3px; }
  .mon b { font-size:14.5px; font-weight:650; min-width:104px; text-align:center; font-variant-numeric:tabular-nums; }
  .mon button { border:none; background:none; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink2); }
  .mon button:hover:not(:disabled) { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .mon button:disabled { opacity:.3; cursor:default; }
  .btn { display:inline-flex; align-items:center; gap:6px; height:34px; background:#fff; border:1px solid #d5d9e0; border-radius:9px; padding:0 12px; font-weight:600; font-size:13.5px; color:var(--ink2); white-space:nowrap; }
  .btn:hover:not(:disabled) { background:var(--line2); }
  .btn.pri { background:var(--pri); border-color:var(--pri); color:#fff; }
  .btn.pri:hover:not(:disabled) { background:var(--pri-d); }
  .btn.no { color:var(--bad); border-color:#f3c2c4; }
  .btn.no:hover:not(:disabled) { background:var(--bad-bg); }
  .btn.sm { height:30px; padding:0 10px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:default; }
  select, input[type=text], input[type=number], input[type=time], textarea { border:1px solid #d5d9e0; border-radius:8px; padding:6px 8px; background:#fff; outline:none; }
  select:focus, input:focus, textarea:focus { border-color:var(--pri); box-shadow:0 0 0 3px var(--pri-bg); }
  input[type=checkbox] { width:16px; height:16px; accent-color:var(--pri); vertical-align:-3px; }
  label { white-space:nowrap; }
  .sp { flex:1; }
  #stat { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--sub); font-weight:600; }
  #stat::before { content:''; width:7px; height:7px; border-radius:50%; background:#22b573; }
  #stat.busy { color:var(--warn); } #stat.busy::before { background:#f5a623; }
  #filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #view { flex:1; overflow:auto; }
  .pad { padding:18px 24px 28px; display:inline-block; min-width:100%; vertical-align:top; }
  .empty { padding:80px 20px; text-align:center; color:var(--mute); font-size:15.5px; }
  .hint { margin:0 0 10px; color:var(--sub); font-size:13px; }
  table { border-collapse:separate; border-spacing:0; background:#fff; border:1px solid var(--line); border-radius:12px; }
  th, td { border-bottom:1px solid var(--line2); padding:8px 10px; text-align:left; }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom:none; }
  thead th { position:sticky; top:0; background:#fafbfc; z-index:2; font-size:12.5px; font-weight:600; color:var(--sub); border-bottom:1px solid var(--line); white-space:nowrap; }
  thead th:first-child { border-top-left-radius:12px; } thead th:last-child { border-top-right-radius:12px; }
  th small, td small { display:block; font-weight:500; color:var(--mute); font-size:11px; }
  .num { font-variant-numeric:tabular-nums; }
  /* 월간 표 */
  .grid th, .grid td { border-right:1px solid var(--line2); padding:5px 6px; }
  .grid th.st { position:sticky; left:0; z-index:1; background:#fff; min-width:96px; white-space:nowrap; font-weight:650; font-size:14px; }
  .grid thead th.st { z-index:3; background:#fafbfc; }
  .grid thead th { text-align:center; }
  .grid td.c { min-width:54px; height:48px; text-align:center; font-size:12.5px; font-weight:650; cursor:pointer; line-height:1.55; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .grid td.c:hover { background:var(--pri-bg); }
  .grid td.c.sel { box-shadow:inset 0 0 0 2px var(--pri); background:var(--pri-bg); }
  .grid .we { background:#fbfbfc; }
  .grid .sun { color:var(--bad); } .grid .sat { color:var(--pri); }
  .grid th.today { background:var(--pri-bg); color:var(--pri-d); }
  .in { color:var(--ok); } .out { color:var(--out); }
  .miss { display:inline-block; color:var(--bad); background:var(--bad-bg); border-radius:6px; padding:0 5px; font-size:11.5px; font-weight:700; }
  .more { font-size:10px; color:var(--mute); font-weight:500; }
  .grid td.tot { text-align:center; font-weight:650; white-space:nowrap; font-size:13px; border-right:none; }
  .leg { margin-top:12px; font-size:12.5px; color:var(--sub); display:flex; gap:16px; flex-wrap:wrap; }
  .leg i { display:inline-block; width:16px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  /* 목록 표 */
  .list { width:100%; }
  .list th[data-sort] { cursor:pointer; }
  .list th[data-sort]:hover { color:var(--ink); }
  .list td { font-size:14px; white-space:nowrap; }
  .list td.how { white-space:normal; font-size:12px; color:var(--mute); max-width:320px; }
  .list tbody tr:hover td { background:#f9fafb; }
  .ed select, .ed input[type=time] { border-color:transparent; background:transparent; padding:4px 5px; }
  .ed select:hover, .ed input[type=time]:hover { border-color:#d5d9e0; background:#fff; }
  .ed.pend td { background:var(--warn-bg); }
  .keep select, .keep input { border-color:#d5d9e0 !important; background:#fff !important; }
  .chip { display:inline-block; font-size:11.5px; font-weight:650; border-radius:99px; padding:2px 8px; background:var(--line2); color:var(--sub); }
  .chip.ok { background:#e6f6ee; color:var(--ok); } .chip.warn { background:var(--warn-bg); color:var(--warn); } .chip.bad { background:var(--bad-bg); color:var(--bad); }
  .bulk { display:flex; align-items:center; gap:8px; background:var(--ink); color:#fff; border-radius:10px; padding:8px 12px; margin-bottom:10px; font-weight:600; font-size:13.5px; }
  .bulk select { color:var(--ink); }
  /* 카드 */
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card h3 { margin:0 0 10px; font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .card h3 .cnt { font-size:12.5px; color:var(--pri-d); background:var(--pri-bg); border-radius:99px; padding:1px 8px; font-weight:700; }
  .card .line { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line2); }
  .sub2 { color:var(--sub); font-size:13.5px; }
  .form { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .form b { font-size:14px; margin-right:4px; }
  textarea { width:100%; min-height:150px; font-family:inherit; font-size:13.5px; line-height:1.6; resize:vertical; }
  /* 근태기록표 */
  .sheet { table-layout:fixed; border-radius:4px; border-color:#cfd4dc; }
  .sheet td { font-size:11.5px; padding:2px 3px; white-space:pre-line; line-height:1.35; overflow:hidden; text-overflow:clip; border-right:1px solid #e3e6eb; border-bottom:1px solid #e3e6eb; text-align:center; font-variant-numeric:tabular-nums; height:20px; }
  .sheet tbody tr:last-child td { border-bottom:1px solid #e3e6eb; }
  /* 옆 칸 */
  #drawer { width:452px; background:#fff; border-left:1px solid var(--line); padding:20px; overflow:auto; flex:none; box-shadow:-8px 0 24px rgba(25,31,40,.05); }
  #drawer h2 { margin:0; font-size:19px; font-weight:700; }
  #drawer .sub { color:var(--sub); font-size:13px; margin:4px 0 14px; }
  #drawer table { width:100%; }
  #drawer td { font-size:14px; padding:6px 4px; white-space:nowrap; }
  #drawer .addbox { margin-top:16px; padding:14px; background:var(--bg); border-radius:12px; }
  #drawer .addbox b { display:block; margin-bottom:10px; font-size:14px; }
  #drawer .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; font-weight:500; z-index:9; display:flex; gap:14px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  #toast button { background:none; border:none; color:#7db5ff; font-weight:700; padding:0; }
  /* 출퇴근카드 (예전 지문 기계 카드와 같은 양식) */
  .kcards { display:flex; flex-wrap:wrap; gap:24px; }
  .kcard { width:640px; background:#fff; padding:18px 20px 22px; border:1px solid var(--line); border-radius:12px; font-family:'Malgun Gothic', 'Pretendard Variable', sans-serif; color:#000; }
  .kcard h1 { margin:0 0 6px; text-align:center; font-size:30px; font-weight:700; color:#0000cc; letter-spacing:6px; }
  .kcard .kd { font-size:13px; margin:0 0 3px; }
  .kcard .kd span { margin-left:56px; }
  .kt { width:100%; border-collapse:collapse; table-layout:fixed; border:2px solid #0000cc; border-radius:0; }
  .kt td { border:1px solid #0000cc; padding:2px 4px; text-align:center; font-size:13px; height:21px; white-space:nowrap; overflow:hidden; }
  .kt .lb { color:#0000cc; }
  .kt .big { font-size:19px; font-weight:700; color:#0000cc; }
  .kt .ttl { font-weight:700; color:#0000cc; font-size:15px; }
  .kt .sun, .kt .hol { color:#d00; } .kt .sat { color:#b30000; }
  .kt .ti { color:#008080; font-weight:700; } .kt .to { color:#990000; font-weight:700; }
  .kt .nd { font-size:10px; font-weight:500; color:#666; }
  .kt .rm { color:#333; }
  .kt .rm.bad { color:#d00; }
  @media print {
    .kcards { display:block; } .kcard { border:none; border-radius:0; padding:0; margin:0 auto; page-break-after:always; break-after:page; width:180mm; }
    .kcard:last-child { page-break-after:auto; break-after:auto; }
    aside, .top, #drawer, #toast, .noprint { display:none !important; }
    #app, main, #view { display:block; height:auto; overflow:visible; }
    body { background:#fff; } .pad { padding:0; } table { border-radius:0; }
    thead th { position:static; }
  }
</style>
</head>
<body>
<div id="pair" class="hidden">
  <div class="box">
    <h1>이 PC를 관리 화면으로 연결</h1>
    <div style="color:#6b7684">관리자 휴대폰에서 아래 숫자를 넣어 주세요</div>
    <div id="code">······</div>
    <ol>
      <li>휴대폰에서 KRF출퇴근 앱의 <b>관리자 화면</b>을 엽니다</li>
      <li><b>PC 연결</b>을 누릅니다</li>
      <li>위 숫자 여섯 자리를 넣습니다</li>
    </ol>
    <div style="margin-top:16px;color:#8b95a1;font-size:13px">연결되면 이 화면이 저절로 바뀝니다 · <a href="index.html?m=1" style="color:#3182f6">휴대폰 화면 보기</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><div class="logo" data-ic="clock" data-s="20"></div><div><b>KRF 출퇴근</b><small>관리 화면</small></div></div>
    <div class="grp" style="padding-top:2px">현황</div>
    <button class="nav" data-view="today"><span data-ic="home"></span>오늘 현황</button>
    <button class="nav" data-view="grid"><span data-ic="calendar"></span>월간 표</button>
    <div class="grp">보고서</div>
    <button class="nav" data-view="sheet"><span data-ic="sheet"></span>근태기록표</button>
    <button class="nav" data-view="card"><span data-ic="card"></span>출퇴근카드</button>
    <div class="grp">관리</div>
    <button class="nav" data-view="staff"><span data-ic="users"></span>직원</button>
    <button class="nav" data-view="place"><span data-ic="pin"></span>장소</button>
    <div class="grp">기록</div>
    <button class="nav" data-view="miss"><span data-ic="alert"></span>빠진 기록<span class="n hidden" id="missN"></span></button>
    <button class="nav" data-view="list"><span data-ic="list"></span>전체 기록</button>
    <button class="nav" data-view="log"><span data-ic="history"></span>수정 이력</button>
    <div class="foot">
      <div id="who" style="color:#333d4b;font-weight:600"></div>
      <div id="ver"></div>
      <button data-act="leave">이 PC 연결 끊기</button><br>
      <a href="index.html?m=1">휴대폰 화면 보기</a>
    </div>
  </aside>
  <main>
    <div class="top">
      <h2 id="title"></h2>
      <div class="mon" id="monBox">
        <button data-act="prev" title="이전 달"><span data-ic="chevL"></span></button>
        <b id="ym"></b>
        <button data-act="next" id="nextBtn" title="다음 달"><span data-ic="chevR"></span></button>
      </div>
      <button class="btn" data-act="now" id="nowBtn">이번 달</button>
      <span id="filters"></span>
      <span class="sp"></span>
      <span id="stat"></span>
      <button class="btn" data-act="reload"><span data-ic="refresh" data-s="16"></span>새로 고침</button>
      <button class="btn" data-act="print" id="printBtn"><span data-ic="print" data-s="16"></span>인쇄</button>
      <button class="btn" data-act="csv" id="csvBtn"><span data-ic="download" data-s="16"></span>엑셀로 내려받기</button>
    </div>
    <div id="view"></div>
  </main>
  <div id="drawer" class="hidden"></div>
</div>
<div id="toast" class="hidden"></div>

<script>
/* ───────── KRF출퇴근 DB(파이어베이스 Firestore) 연결 ─────────
 * 화면 코드는 예전처럼 api(action, payload)를 부르고, 여기서 서버와 같은 모양의 답을 DB로 만들어 줌.
 * - DB에 저장한 뒤 서버(fbMirror)에 알려 구글 시트에도 바로 반영 (기다리지 않음. 놓치면 서버가 1시간마다 채움)
 * - DB가 막히면(한도 초과·연결 실패) can()이 false가 되어 예전처럼 서버로 감
 */
(function () {
  'use strict';
  const CFG = {
    apiKey: 'AIzaSyAC6iwT_XpB1pPBhVkQbKyDAULzlQj91B8',
    authDomain: 'krf-attend.firebaseapp.com',
    projectId: 'krf-attend',
    storageBucket: 'krf-attend.firebasestorage.app',
    messagingSenderId: '66480578546',
    appId: '1:66480578546:web:16bf113b88ee316dd4956b'
  };
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const TZ_OFF = 9 * 3600 * 1000;                 // 한국 시간
  const MAX_SHIFT_MS = 16 * 3600 * 1000;           // 출근 후 이 시간이 지나면 다음 누름은 새 출근
  const DEDUP_MS = 60 * 1000;                      // 1분 안에 연달아 누르면 무시
  const DEFAULT_RADIUS = 150;
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

  let db = null, auth = null, uid = '', deviceId = '', server = null;
  let dv = null, bind = null, staffMe = null, broken = false, readyP = null;

  /* ── 작은 도구 ── */
  const pad = (n) => String(n).padStart(2, '0');
  const kParts = (ms) => { const d = new Date(ms + TZ_OFF); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), w: d.getUTCDay() }; };
  const ymd = (ms) => { const p = kParts(ms); return p.y + '-' + pad(p.m) + '-' + pad(p.d); };
  const hm = (ms) => { const p = kParts(ms); return pad(p.h) + ':' + pad(p.mi); };
  const display = (ms) => { const p = kParts(ms); return p.m + '월 ' + p.d + '일 ' + pad(p.h) + ':' + pad(p.mi); };
  const stamp = (ms) => { const p = kParts(ms); return p.m + '/' + p.d + ' ' + pad(p.h) + ':' + pad(p.mi); };
  const kst = (day, time) => Date.parse(day + 'T' + time + ':00+09:00');
  const prevMonth = (ym) => { const [y, m] = ym.split('-').map(Number); const d = new Date(Date.UTC(y, m - 2, 15)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1); };
  const newId = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)).replace(/[^a-z0-9]/g, '').slice(0, 20);
  const fresh = (ms) => Date.now() - ms;
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });
  }
  function timeout(p, ms, what) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout ' + (what || ''))), ms))]); }
  function mirror(kind, ids) {   // 시트에 바로 반영해 달라고 서버에 알림 (기다리지 않음)
    if (!server || !ids || !ids.length) return;
    try { server('fbMirror', { kind: kind, ids: ids.slice(0, 50) }).catch(() => {}); } catch (e) {}
  }
  function docs(snap) { const a = []; snap.forEach((d) => a.push(Object.assign({ id: d.id }, d.data()))); return a; }
  async function getDoc(path) { const s = await db.doc(path).get(); return s.exists ? Object.assign({ id: s.id }, s.data()) : null; }
  /** 휴대폰에 이미 받아 둔 것이 있으면 그걸 씀 (없으면 서버에서) */
  async function getDocFast(path) {
    try { const s = await db.doc(path).get({ source: 'cache' }); if (s.exists) return Object.assign({ id: s.id }, s.data()); } catch (e) {}
    return getDoc(path);
  }

  /* ── 시작: SDK 불러오기 → 익명 로그인 → 이 기기가 누구인지 확인 ── */
  async function start() {
    if (!window.firebase) {
      await loadScript(SDK + 'firebase-app-compat.js');
      await Promise.all([loadScript(SDK + 'firebase-auth-compat.js'), loadScript(SDK + 'firebase-firestore-compat.js')]);
    }
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(CFG);
    auth = app.auth();
    db = app.firestore();
    try { await db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* 사파리 사생활 모드 등: 휴대폰 저장 없이 그대로 씀 */ }
    if (!auth.currentUser) {
      await new Promise((res) => { const off = auth.onAuthStateChanged((u) => { off(); res(u); }); });
      if (!auth.currentUser) await auth.signInAnonymously();
    }
    uid = auth.currentUser.uid;
    await refreshDevice(false);
    return true;
  }
  /** devices/{uid}가 없거나 다른 기기 것이거나 아직 승인 전이면 서버에 다시 확인받음 */
  async function refreshDevice(force) {
    dv = await getDoc('devices/' + uid).catch(() => null);
    const stale = !dv || dv.deviceId !== deviceId || (!dv.super && !dv.no);
    if (force || stale) {
      bind = await server('fbBind', { deviceId: deviceId, uid: uid });
      if (!bind || !bind.ok) throw new Error('bind failed');
      dv = { deviceId: deviceId, no: bind.no, super: bind.super, pc: bind.pc, name: bind.name || '' };
    } else bind = bind || { ok: true, auth: 'ok', no: dv.no, super: dv.super, pc: dv.pc };
    staffMe = (dv.no && !dv.super) ? await getDoc('staff/' + dv.no).catch(() => null) : null;
    if (staffMe && staffMe.status === '퇴사') bind = Object.assign({}, bind, { auth: 'retired' });
  }
  const isSuper = () => !!(dv && dv.super);
  const isAdmin = () => isSuper() || !!(staffMe && staffMe.admin && staffMe.status !== '퇴사');
  const myName = () => isSuper() ? (dv && dv.name) || (bind && bind.name) || '관리자' : (staffMe ? staffMe.name : '');

  /* ── 공통 읽기 ── */
  let placesMemo = null, placesAt = 0;   // 장소 목록은 1분 동안 다시 받지 않음 (고치면 바로 지움)
  async function places() {
    if (placesMemo && Date.now() - placesAt < 60000) return placesMemo.slice();
    const a = docs(await db.collection('places').get()).filter((p) => !p.del);
    a.sort((x, y) => (x.order || 99) - (y.order || 99));
    placesMemo = a; placesAt = Date.now();
    return a.slice();
  }
  async function placeChoices() {
    const n = (await places()).map((p) => p.name);
    if (n.indexOf('외부') < 0) n.push('외부');
    return n;
  }
  function distance(lat1, lng1, lat2, lng2) {
    const R = 6371000, rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function matchPlace(lat, lng, list) {
    if (lat === '' || lng === '' || lat == null || lng == null) return '위치 없음';
    let best = '외부', bestD = Infinity;
    list.forEach((p) => { if (p.lat == null || p.lng == null) return; const d = distance(Number(lat), Number(lng), p.lat, p.lng); if (d <= (p.radius || DEFAULT_RADIUS) && d < bestD) { best = p.name; bestD = d; } });
    return best;
  }
  async function allStaff() {
    const a = docs(await db.collection('staff').get()).filter((e) => !e.del);   // 지운 직원(시트 반영 대기)은 빼고
    a.forEach((e) => { e.order = Number(e.order) || 999; });
    a.sort((x, y) => x.order - y.order);
    return a;
  }
  async function monthRecs(month, no) {
    let q = db.collection('records').where('month', '==', month);
    if (no != null) q = q.where('no', '==', String(no));
    return docs(await q.get()).filter((d) => !d.del);
  }
  /** 한 사람의 이번 달·지난달 기록 중 가장 늦은 것 → latest/{no} 다시 계산 */
  async function recomputeLatest(no) {
    const now = Date.now(), m = ymd(now).slice(0, 7);
    const a = (await monthRecs(m, no)).concat(await monthRecs(prevMonth(m), no));
    let best = null;
    a.forEach((d) => { if (!best || d.at > best.at) best = d; });
    const ref = db.doc('latest/' + encodeURIComponent(String(no)));
    if (best) await ref.set({ no: String(no), type: best.type, at: best.at, wd: best.wd, place: best.place, nogps: best.lat == null && !/관리자 추가/.test(best.how || ''), id: best.id });
    else await ref.delete();
  }
  const working = (l, now) => !!l && l.type === '출근' && (now - l.at) <= MAX_SHIFT_MS;

  /* ───────── 화면이 부르는 기능들 (서버와 같은 모양의 답) ───────── */
  const H = {};

  H.status = async function () {
    if (!bind || bind.auth !== 'ok') {   // 승인을 기다리는 중이면 서버에 다시 물어봄
      if (bind && bind.auth === 'pending') await refreshDevice(true).catch(() => {});
    }
    if (!bind || bind.auth !== 'ok') {
      const out = { ok: true, auth: bind ? bind.auth : 'none', name: bind ? bind.name : '' };
      if (out.auth === 'none') out.staff = (await H.staff()).staff;
      return out;
    }
    if (isSuper()) {
      const st = await allStaff();
      return { ok: true, auth: 'ok', super: true, admin: true, name: myName(), pend: st.filter((e) => e.dev && !e.ok && e.status !== '퇴사').length, vapid: await vapid() };
    }
    const now = Date.now(), L = await getDoc('latest/' + encodeURIComponent(dv.no));
    const w = working(L, now);
    const base = L ? { ok: true, state: w ? 'working' : 'off', type: L.type, time: display(L.at), place: L.place, lastMs: L.at } : { ok: true, state: 'none' };
    base.auth = 'ok'; base.name = myName(); base.admin = isAdmin();
    if (base.admin) { const st = await allStaff(); base.pend = st.filter((e) => e.dev && !e.ok && e.status !== '퇴사').length; base.vapid = await vapid(); }
    base.places = (await places()).filter((p) => p.lat != null).map((p) => ({ n: p.name, lat: p.lat, lng: p.lng, r: p.radius || DEFAULT_RADIUS }));
    base.mates = staffMe && staffMe.mate ? await mateCandidates(w, L ? L.place : '') : [];
    return base;
  };
  let vapidKey = null;
  const VAPID_PUBLIC = 'BLo31HxbCawlVXh3g8grDhd3ZlQ5VFBh77UXT0_FJky7WYVHvFhMCegJatCfDJSVTa41_d7Ip9a14K_iTBuhKbU';   // 알림용 공개 키 (서버와 같음)
  async function vapid() { if (vapidKey === null) { const c = await getDoc('pub/cfg').catch(() => null); vapidKey = (c && c.vapid) || VAPID_PUBLIC; } return vapidKey; }
  async function pick() { const p = await getDoc('pub/pick'); return p ? JSON.parse(p.list) : []; }
  async function mateCandidates(iAmWorking, myPlace) {
    const now = Date.now(), list = (await pick()).filter((e) => (e.status || '재직') === '재직' && String(e.no) !== String(dv.no));
    const latest = {};
    docs(await db.collection('latest').get()).forEach((l) => { latest[l.no] = l; });
    const cnt = {};
    list.forEach((e) => { cnt[e.name] = (cnt[e.name] || 0) + 1; });
    const out = [];
    list.forEach((e, i) => {
      const r = latest[String(e.no)];
      if (working(r, now) !== iAmWorking) return;
      out.push({ no: e.no, name: cnt[e.name] > 1 ? e.name + '(' + e.no + ')' : e.name, same: r && myPlace && r.place === myPlace ? 1 : 0, order: i });
    });
    out.sort((a, b) => (b.same - a.same) || (a.order - b.order));
    return out.map((o) => ({ no: o.no, name: o.name }));
  }

  H.staff = async function () { return { ok: true, staff: (await pick()).map((e) => ({ no: e.no, name: e.name, dept: e.dept, dup: e.dup, taken: e.taken })) }; };

  /** 처음 쓰는 휴대폰: 이름 골라 등록 신청 */
  H.register = async function (p) {
    if (isSuper() || (dv && dv.pc)) return { ok: false, error: '관리자 휴대폰이에요' };
    if (bind && bind.auth === 'ok') return { ok: true, auth: 'ok', name: myName() };
    const list = await pick(), t = list.filter((e) => String(e.no) === String(p.no))[0];
    if (!t || t.status === '퇴사') return { ok: false, error: 'no staff' };
    const before = bind && bind.pendNo;
    if (before && before !== String(p.no)) {   // 승인 전 다른 이름을 골랐던 것 취소
      await db.doc('staff/' + before).update({ dev: '', ok: false, req: null, upd: Date.now(), sheet: false }).catch(() => {});
    }
    if (before !== String(p.no)) {
      try { await db.doc('staff/' + String(p.no)).update({ dev: deviceId, ok: false, req: Date.now(), upd: Date.now(), sheet: false }); }
      catch (e) { return { ok: true, auth: 'taken', name: t.name }; }   // 이미 다른 휴대폰이 등록함
      mirror('staff', before ? [before, String(p.no)] : [String(p.no)]);
      try { server('fbNotify', {}).catch(() => {}); } catch (e) {}
    }
    bind = Object.assign({}, bind, { auth: 'pending', pendNo: String(p.no), name: t.name });
    return { ok: true, auth: 'pending', name: t.name };
  };

  H.history = async function (p) {
    const key = (p.no != null && p.no !== '') ? String(p.no) : (dv && dv.no);
    if (!key) return { ok: true, month: p.month, days: [] };
    const days = {};
    (await monthRecs(p.month, key)).forEach((d) => {
      (days[d.wd] = days[d.wd] || []).push({ type: d.type, at: d.at, time: hm(d.at), day: ymd(d.at), place: d.place || '', fix: !!d.fix });
    });
    const list = Object.keys(days).sort().reverse().map((k) => ({ date: k, items: days[k].sort((a, b) => a.at - b.at) }));
    return { ok: true, month: p.month, days: list };
  };

  /** 출퇴근 (휴대폰에 먼저 저장된 누름을 DB에 씀. 같은 누름(cid)은 한 번만) */
  H.punch = async function (data) {
    if (isSuper()) return { ok: false, error: '관리자 전용 휴대폰은 출퇴근을 찍지 않아요' };
    if (dv.pc) return { ok: false, error: 'PC에서는 출퇴근을 찍을 수 없어요' };
    if (!bind || bind.auth !== 'ok') return { ok: true, auth: bind ? bind.auth : 'none', name: myName() };
    const now = Date.now(), at = Number(data.at) > 0 ? Math.min(Number(data.at), now) : now;
    const late = Number(data.sent) - at > 90 * 1000 || now - at > 90 * 1000;
    const cid = String(data.cid || newId()).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || newId();
    const exist = await getDoc('records/' + cid).catch(() => null);
    if (exist) return { ok: true, duplicate: true, resent: true, type: exist.type, time: display(exist.at), place: exist.place };
    const L = await getDoc('latest/' + encodeURIComponent(dv.no));
    if (L && !late && Math.abs(at - L.at) < DEDUP_MS) return { ok: true, duplicate: true, type: L.type, time: display(L.at), place: L.place };
    let type, wd;
    if (L && L.type === '출근' && at > L.at && (at - L.at) <= MAX_SHIFT_MS) { type = '퇴근'; wd = L.wd; } else { type = '출근'; wd = ymd(at); }
    if (late && (data.type === '출근' || data.type === '퇴근') && data.type !== type) {
      type = data.type;
      wd = (type === '퇴근' && L && L.type === '출근' && (at - L.at) <= 24 * 3600 * 1000) ? L.wd : ymd(at);
    }
    const pl = await places();
    let place = matchPlace(data.lat, data.lng, pl), how = 'GPS';
    if (place === '외부' || place === '위치 없음') {
      const choices = pl.map((p) => p.name).concat(pl.some((p) => p.name === '외부') ? [] : ['외부']);
      if (!data.place) return { ok: true, needPlace: true, type: type, choices: choices };
      if (choices.indexOf(String(data.place)) < 0) return { ok: false, error: 'bad place' };
      place = String(data.place); how = '직접 선택';
    }
    const noPos = data.lat === '' || data.lng === '' || data.lat == null || data.lng == null;
    const why = String(data.posErr || '').slice(0, 20);
    const num = (v) => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
    const rec = { no: String(dv.no), name: myName(), at: at, wd: wd, month: wd.slice(0, 7), type: type, place: place,
                  addr: noPos ? '위치 없음' + (why ? '(' + why + ')' : '') : '', lat: num(data.lat), lng: num(data.lng), acc: num(data.acc),
                  how: how + (late ? ' · 나중 전송' : ''), dev: deviceId, excl: false, fix: false, sheet: false, upd: now };
    const batch = db.batch(), ids = [cid];
    batch.set(db.doc('records/' + cid), rec);
    batch.set(db.doc('latest/' + encodeURIComponent(dv.no)), { no: rec.no, type: type, at: at, wd: wd, place: place, nogps: noPos, id: cid });
    // 같이 찍기: 상태가 맞는 사람만
    const also = [];
    if (staffMe && staffMe.mate && Array.isArray(data.alsoNos) && data.alsoNos.length) {
      const list = await pick(), seen = {};
      for (const n of data.alsoNos) {
        const key = String(n);
        if (seen[key] || key === String(dv.no)) continue;
        seen[key] = true;
        const e = list.filter((x) => String(x.no) === key && (x.status || '재직') === '재직')[0];
        if (!e) continue;
        const r = await getDoc('latest/' + encodeURIComponent(key)).catch(() => null), w = working(r, at);
        if ((type === '퇴근' && !w) || (type === '출근' && w)) continue;
        const id2 = cid + 'm' + key, wd2 = type === '퇴근' ? r.wd : ymd(at);
        batch.set(db.doc('records/' + id2), Object.assign({}, rec, { no: key, name: e.name, wd: wd2, month: wd2.slice(0, 7), how: '대리' + type + '(' + myName() + ')', dev: '' }));
        batch.set(db.doc('latest/' + encodeURIComponent(key)), { no: key, type: type, at: at, wd: wd2, place: place, nogps: noPos, id: id2 });
        ids.push(id2); also.push(e.name);
      }
    }
    // 전파가 약하면 휴대폰에 저장해 두었다가 나중에 보냄(파이어베이스가 알아서). 3초만 기다리고 '완료'
    const sent = batch.commit().then(() => mirror('records', ids));
    try { await timeout(sent, 3000, 'punch'); } catch (e) { if (!/timeout/.test(e.message)) throw e; }
    return { ok: true, type: type, time: display(at), name: myName(), place: place, also: also };
  };

  /* ── 관리자 ── */
  H.admin = async function () {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const now = Date.now(), st = await allStaff(), latest = {};
    docs(await db.collection('latest').get()).forEach((l) => { latest[l.no] = l; });
    const pending = st.filter((e) => e.dev && !e.ok && e.status !== '퇴사').map((e) => ({ no: e.no, name: e.name, dept: e.dept, req: e.req ? display(e.req) : '' }));
    const workingList = [];
    st.forEach((e) => { const r = latest[String(e.no)]; if (working(r, now)) workingList.push({ name: e.name, time: hm(r.at), place: r.place || '', nogps: !!r.nogps }); });
    const staff = st.map((e) => ({ no: e.no, name: e.name, dept: e.dept, status: e.status, registered: !!e.dev, ok: !!e.ok, admin: !!e.admin, mate: !!e.mate, me: String(e.no) === String(dv.no) }));
    return { ok: true, super: isSuper(), pending: pending, working: workingList, staff: staff };
  };

  H.adminDo = async function (p) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const no = String(p.no), e = await getDoc('staff/' + no);
    if (!e) return { ok: false, error: 'no staff' };

    else if (p.op === 'reject' || p.op === 'reset') { if (isMe) return { ok: false, error: '내 휴대폰은 여기서 초기화할 수 없어요' }; up.dev = ''; up.ok = false; up.req = null; }
    else if (p.op === 'admin') { if (!isSuper()) return { ok: false, error: '슈퍼관리자만 관리자를 정할 수 있어요' }; up.admin = p.value === '1' || p.value === true; }
    else if (p.op === 'mate') up.mate = p.value === '1' || p.value === true;
    else if (p.op === 'status') {
      if (['재직', '휴직', '퇴사'].indexOf(p.value) < 0) return { ok: false, error: 'bad value' };
      if (isMe && p.value !== '재직') return { ok: false, error: '내 상태는 여기서 바꿀 수 없어요' };
      up.status = p.value;
    } else return { ok: false, error: 'bad op' };
    await db.doc('staff/' + no).update(up);
    mirror('staff', [no]);
    return { ok: true };
  };

  H.adminStaffSave = async function (d) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const name = String(d.name || '').trim().slice(0, 20), dept = String(d.dept || '').trim();
    if (!name) return { ok: false, error: '이름을 넣어 주세요' };
    if (['순국', '기억', '주간', '없음'].indexOf(dept) < 0) return { ok: false, error: '부서를 골라 주세요' };
    const st = await allStaff();
    if (d.no === undefined || d.no === null || d.no === '') {
      if (st.some((e) => e.name === name && e.status !== '퇴사')) return { ok: false, error: '같은 이름의 직원이 이미 있어요' };
      let maxNo = 0, maxOrd = 0;
      st.forEach((e) => { maxNo = Math.max(maxNo, Number(e.no) || 0); if (e.order < 999) maxOrd = Math.max(maxOrd, e.order); });
      let no = String(maxNo + 1);   // 사번을 넣지 않으면 자동 (가장 큰 번호 + 1)
      if (d.newNo !== undefined && d.newNo !== null && String(d.newNo).trim() !== '') {
        const n = Number(String(d.newNo).trim());
        if (!(Number.isInteger(n) && n >= 1 && n <= 99999)) return { ok: false, error: '사번은 1~99999 사이 숫자로 넣어 주세요' };
        if (st.some((e) => String(e.no) === String(n))) return { ok: false, error: n + '번은 이미 다른 직원이 쓰고 있어요' };
        if (await liveRecCount(n)) return { ok: false, error: n + '번으로 남아 있는 출퇴근 기록이 있어서 쓸 수 없어요' };
        no = String(n);
      }
      await db.doc('staff/' + no).set({ no: no, name: name, order: maxOrd + 1, dept: dept, status: '재직', dev: '', ok: false, admin: false, mate: false, req: null, upd: Date.now(), sheet: false });
      mirror('staff', [no]);
      return { ok: true, no: Number(no) };
    }
    const no = String(d.no), e = st.filter((x) => String(x.no) === no)[0];
    if (!e) return { ok: false, error: '직원을 찾지 못했어요' };
    if (name !== e.name && st.some((x) => String(x.no) !== no && x.name === name && x.status !== '퇴사')) return { ok: false, error: '같은 이름의 직원이 이미 있어요' };
    await db.doc('staff/' + no).update({ name: name, dept: dept, upd: Date.now(), sheet: false });
    mirror('staff', [no]);
    return { ok: true };
  };

  /** 이 사번으로 남아 있는(지우지 않은) 출퇴근 기록 수 */
  async function liveRecCount(no) {
    return docs(await db.collection('records').where('no', '==', String(no)).get()).filter((r) => !r.del).length;
  }
  /** 직원 지우기: 출퇴근 기록이 하나도 없을 때만 (기록이 있으면 '퇴사'로). 시트 줄은 서버가 지움 */
  H.adminStaffDelete = async function (d) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const no = String(d.no || ''), name = String(d.name || '').trim(), e = await getDoc('staff/' + no);
    if (!e || e.del || e.name !== name) return { ok: false, error: '직원 목록이 바뀌었어요. 새로 고침해 주세요' };
    if (dv && String(dv.no) === no) return { ok: false, error: '내 이름은 지울 수 없어요' };
    if (e.admin) return { ok: false, error: name + '님은 관리자예요. 관리자 권한을 먼저 끈 뒤 지워 주세요' };
    const n = await liveRecCount(no);
    if (n) return { ok: false, error: name + '님의 출퇴근 기록이 ' + n + '건 있어서 지울 수 없어요.\n기록이 있는 직원은 상태를 \'퇴사\'로 바꿔 주세요.' };
    await db.doc('staff/' + no).update({ del: true, sheet: false, upd: Date.now() });
    mirror('staff', [no]);
    return { ok: true };
  };

  H.adminPlaces = async function () {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    return { ok: true, defaultRadius: DEFAULT_RADIUS, places: (await places()).map((p, i) => ({ row: p.id, name: p.name, addr: p.addr || '', lat: p.lat == null ? '' : p.lat, lng: p.lng == null ? '' : p.lng, radius: p.radius || DEFAULT_RADIUS, memo: p.memo || '' })) };
  };
  H.adminPlaceSave = async function (d) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const addr = String(d.addr || '').trim(), radius = Number(d.radius);
    if (!(radius >= 30 && radius <= 2000)) return { ok: false, error: '반경은 30~2000 사이 숫자로 넣어 주세요' };
    let lat = (d.lat === '' || d.lat == null) ? '' : Number(d.lat), lng = (d.lng === '' || d.lng == null) ? '' : Number(d.lng);
    if ((lat !== '' && isNaN(lat)) || (lng !== '' && isNaN(lng))) return { ok: false, error: '위도·경도는 숫자로 넣어 주세요' };
    if (lat === '' || lng === '') {
      if (!addr) return { ok: false, error: '주소나 위도·경도를 넣어 주세요' };
      const g = await server('fbGeocode', { addr: addr });   // 주소 → 위치는 구글 지도 기능이라 서버에서
      if (!g || !g.ok) return { ok: false, error: (g && g.error) || '주소로 위치를 찾지 못했어요' };
      lat = g.lat; lng = g.lng;
    }
    const name = String(d.name || '').trim().slice(0, 20), list = await places();
    if (d.row) {
      const cur = list.filter((p) => p.id === String(d.row))[0];
      if (!cur || cur.name !== name) return { ok: false, error: '장소 목록이 바뀌었어요. 새로 고침해 주세요' };
      await db.doc('places/' + cur.id).update({ addr: addr, lat: lat, lng: lng, radius: radius, sheet: false });
      placesMemo = null;
      mirror('places', [cur.id]);
    } else {
      if (!name || ['외부', '위치 없음', '전체'].indexOf(name) >= 0) return { ok: false, error: '쓸 수 없는 장소 이름이에요' };
      if (list.some((p) => p.name === name)) return { ok: false, error: '같은 이름의 장소가 이미 있어요' };
      const id = encodeURIComponent(name);
      await db.doc('places/' + id).set({ name: name, addr: addr, lat: lat, lng: lng, radius: radius, memo: '', order: list.length + 1, sheet: false });
      placesMemo = null;
      mirror('places', [id]);
    }
    return { ok: true, lat: lat, lng: lng };
  };
  H.adminPlaceDelete = async function (d) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const name = String(d.name || '').trim(), cur = (await places()).filter((p) => p.id === String(d.row) && p.name === name)[0];
    if (!cur) return { ok: false, error: '장소 목록이 바뀌었어요. 새로 고침해 주세요' };
    const used = await db.collection('records').where('place', '==', name).limit(1).get();
    if (!used.empty) return { ok: false, error: name + ' 장소로 찍힌 기록이 있어서 지울 수 없어요.\n그 기록들의 장소를 먼저 다른 곳으로 바꾼 뒤 지워 주세요.' };
    await db.doc('places/' + cur.id).update({ del: true, sheet: false });
    placesMemo = null;   // 시트에서 지운 뒤 서버가 문서도 지움
    mirror('places', [cur.id]);
    return { ok: true };
  };

  /** 한 직원의 한 달 기록 + 지운 기록(되살리기용) — 휴대폰 관리자 '기록 고치기' */
  H.adminRecords = async function (p) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const all = docs(await db.collection('records').where('month', '==', p.month).where('no', '==', String(p.no)).get());
    const rec = (d) => ({ row: d.id, at: d.at, wd: d.wd, day: ymd(d.at), time: hm(d.at), type: d.type, place: d.place || '', how: d.how || '', nogps: d.lat == null && !/관리자 추가/.test(d.how || '') });
    const records = all.filter((d) => !d.del).map(rec).sort((a, b) => b.at - a.at);
    const deleted = all.filter((d) => d.del).map((d) => Object.assign(rec(d), { log: d.id, by: d.delBy || '', when: d.delAt ? stamp(d.delAt) : '', full: true })).sort((a, b) => b.at - a.at);
    return { ok: true, records: records, deleted: deleted, places: await placeChoices() };
  };

  /** 수정이력 한 줄 (같은 묶음으로 저장) */
  function logDoc(batch, op, e, type, wd, before, after, place, rid) {
    const id = 'C' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    batch.set(db.doc('logs/' + id), { when: Date.now(), by: myName(), op: op, no: String(e.no), name: e.name || '', type: type, wd: wd, before: before || null, after: after || null, place: place || '', bak: '', rid: rid || '', row: 0 });
    return id;
  }
  /** 고친 기록 + 수정이력을 한 번에 저장. 휴대폰에는 바로 반영되므로 DB 서버의 '받았음' 답은 오래 기다리지 않음
   *  (답이 오면 시트 반영을 부탁하고 '지금 상태'를 다시 계산) */
  async function editCommit(batch, rid, lid, no) {
    const done = batch.commit().then(() => {
      mirror('records', [rid]);
      mirror('logs', [lid]);
      return recomputeLatest(no).catch(() => {});
    });
    // 휴대폰에 먼저 저장되어 화면엔 바로 반영됨. 서버가 거절했을 때만(권한 등) 알려 줌
    done.catch((e) => { console.warn('[DB] 기록 저장 실패', e); if (!/unavailable/.test(String(e && e.code))) alert('기록을 저장하지 못했어요. 화면을 닫았다가 다시 열어 주세요.'); });
  }

  /** 기록 고치기: add / edit / delete / restore. row는 DB 기록 번호 */
  H.adminEdit = async function (d) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const now = Date.now(), st = stamp(now), batch = db.batch();
    if (d.op === 'add') {
      const e = await getDocFast('staff/' + String(d.no));
      if (!e) return { ok: false, error: '직원을 찾지 못했어요' };
      if (d.type !== '출근' && d.type !== '퇴근') return { ok: false, error: '출근/퇴근을 골라 주세요' };
      let t = kst(d.wd, d.time);
      if (isNaN(t)) return { ok: false, error: '날짜와 시각을 확인해 주세요' };
      if (d.nextDay) t += 24 * 3600 * 1000;
      if (t > now) return { ok: false, error: '앞으로의 시각은 넣을 수 없어요' };
      if ((await placeChoices()).indexOf(String(d.place || '')) < 0) return { ok: false, error: '장소를 골라 주세요' };
      const id = newId();
      batch.set(db.doc('records/' + id), { no: String(e.no), name: e.name, at: t, wd: d.wd, month: d.wd.slice(0, 7), type: d.type, place: String(d.place), addr: '', lat: null, lng: null, acc: null,
        how: '관리자 추가(' + myName() + ' ' + st + ')', dev: '', excl: false, fix: false, sheet: false, upd: now });
      const lid = logDoc(batch, '추가', e, d.type, d.wd, null, t, d.place, id);
      await editCommit(batch, id, lid, e.no);
      return { ok: true, id: id };
    }
    const id = String(d.row || d.log || '');
    const r = id ? await getDocFast('records/' + id) : null;
    if (!r) return { ok: false, error: '기록을 찾지 못했어요' };
    const e = { no: r.no, name: r.name };
    if (d.op === 'restore') {
      if (!r.del) return { ok: false, error: '이미 되살린 기록이에요' };
      batch.update(db.doc('records/' + id), { del: false, sheet: false, how: String(r.how || '') + ' → 관리자 되살림(' + myName() + ' ' + st + ')', upd: now });
      const lid = logDoc(batch, '되살림', e, r.type, r.wd, null, r.at, r.place, id);
      await editCommit(batch, id, lid, r.no);
      return { ok: true };
    }
    if (r.del) return { ok: false, error: '이미 지운 기록이에요' };
    if (d.expectAt && Number(d.expectAt) !== r.at) return { ok: false, error: '기록이 바뀌었어요. 다시 열어 주세요' };
    if (d.op === 'delete') {
      batch.update(db.doc('records/' + id), { del: true, delBy: myName(), delAt: now, sheet: false, upd: now });
      const lid = logDoc(batch, '삭제', e, r.type, r.wd, r.at, null, r.place, id);
      await editCommit(batch, id, lid, r.no);
      return { ok: true };
    }
    if (d.op === 'edit') {
      let t = kst(r.wd, d.time);
      if (isNaN(t)) return { ok: false, error: '시각을 확인해 주세요' };
      if (d.nextDay) t += 24 * 3600 * 1000;
      if (t > now) return { ok: false, error: '앞으로의 시각은 넣을 수 없어요' };
      if (hm(t) === hm(r.at) && ymd(t) === ymd(r.at)) t = r.at;   // 분까지 같으면 그대로
      let place = r.place || '';
      if (d.place) { if ((await placeChoices()).indexOf(String(d.place)) < 0) return { ok: false, error: '장소를 확인해 주세요' }; place = String(d.place); }
      let type = r.type;
      if (d.type) { if (d.type !== '출근' && d.type !== '퇴근') return { ok: false, error: '출근/퇴근을 확인해 주세요' }; type = d.type; }
      const tc = t !== r.at, pc = place !== (r.place || ''), yc = type !== r.type;
      if (!tc && !pc && !yc) return { ok: false, error: '바뀐 내용이 없어요' };
      const what = [], parts = [];
      if (tc) { what.push('원래 ' + stamp(r.at)); parts.push('시각'); }
      if (pc) { what.push('장소 ' + (r.place || '없음') + '→' + place); parts.push('장소'); }
      if (yc) { what.push('구분 ' + r.type + '→' + type); parts.push('구분'); }
      batch.update(db.doc('records/' + id), { at: t, place: place, type: type, how: String(r.how || '') + ' → 관리자 수정(' + myName() + ' ' + st + ', ' + what.join(', ') + ')', sheet: false, upd: now });
      const lid = logDoc(batch, parts.length === 1 && tc ? '수정' : parts.join('·') + ' 수정', e, yc ? r.type + '→' + type : type, r.wd, r.at, t, pc ? (r.place || '') + '→' + place : place, id);
      await editCommit(batch, id, lid, r.no);
      return { ok: true };
    }
    return { ok: false, error: 'bad op' };
  };

  /** 한 달 치 전 직원 기록 (휴대폰 '빠진 기록 모아 보기') */
  H.adminMonthAll = async function (p) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const by = {};
    (await monthRecs(p.month)).forEach((d) => {
      const a = (by[d.no] = by[d.no] || {});
      (a[d.wd] = a[d.wd] || []).push({ type: d.type, at: d.at, time: hm(d.at), day: ymd(d.at), place: d.place || '', fix: !!d.fix });
    });
    const staff = (await allStaff()).filter((e) => by[String(e.no)]).map((e) => ({ no: e.no, name: e.name, status: e.status,
      days: Object.keys(by[String(e.no)]).sort().map((k) => ({ date: k, items: by[String(e.no)][k].sort((a, b) => a.at - b.at) })) }));
    return { ok: true, month: p.month, staff: staff };
  };

  /** PC 관리 화면: 한 달 치 전 직원 기록 */
  H.adminMonthRecs = async function (p) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const recs = (await monthRecs(p.month)).map((d) => ({ row: d.id, no: String(d.no), name: d.name || '', at: d.at, wd: d.wd, day: ymd(d.at), time: hm(d.at),
      type: d.type, place: d.place || '', how: d.how || '', nogps: d.lat == null && !/관리자 추가/.test(d.how || ''), fix: !!d.fix }));
    const staff = (await allStaff()).map((e) => ({ no: String(e.no), name: e.name, dept: e.dept, status: e.status }));
    return { ok: true, month: p.month, recs: recs, staff: staff, places: await placeChoices(), me: myName() };
  };

  /** PC: 그 달(근무일 기준) 수정 이력. 지운 기록 중 아직 되살리지 않은 것은 can=true (log에 기록 번호) */
  H.adminLog = async function (p) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const from = p.month + '-01', to = p.month + '-31';
    const logs = docs(await db.collection('logs').where('wd', '>=', from).where('wd', '<=', to).get());
    const delRecs = docs(await db.collection('records').where('month', '==', p.month).where('del', '==', true).get());
    const byKey = {};
    delRecs.forEach((d) => { byKey[d.id] = d; byKey[d.no + '|' + Math.round(d.at / 1000)] = d; });
    const used = {};
    const out = logs.map((L) => {
      let can = false, rid = '';
      if (L.op === '삭제') {
        const d = (L.rid && byKey[L.rid]) || byKey[String(L.no) + '|' + Math.round((L.before || 0) / 1000)];
        if (d && !used[d.id]) { can = true; rid = d.id; used[d.id] = true; }
      }
      return { log: rid || L.id, at: L.when || 0, when: L.when ? stamp(L.when) : '', by: L.by || '', op: L.op || '', no: String(L.no), name: L.name || '', type: L.type || '',
               wd: L.wd || '', before: L.before ? stamp(L.before) : '', after: L.after ? stamp(L.after) : '', place: L.place || '', can: can };
    });
    out.sort((x, y) => (y.at - x.at));
    return { ok: true, month: p.month, logs: out };
  };

  /** 근태기록표: '근태기록' 탭과 같은 모양을 DB 기록으로 직접 계산 (16·17시대 퇴근은 18시대로 인정, 보정제외는 그대로) */
  H.adminSheet = async function (p) {
    if (!isAdmin()) return { ok: false, error: 'not admin' };
    const ym = p.month, place = p.place || '전체', [y, m] = ym.split('-').map(Number);
    const last = new Date(Date.UTC(y, m, 0)).getUTCDate(), DAYS = 31;
    const pl = await placeChoices(), placesList = ['전체'].concat(pl);
    const st = (await allStaff()).filter((e) => e.status !== '퇴사');
    // 찍은 날짜 기준: 지난달 마지막 날 야간 근무의 이달 1일 아침 퇴근도 이달 1일 칸에 (그래서 지난달 기록도 받음)
    const recs = (await monthRecs(ym)).concat(await monthRecs(prevMonth(ym))).filter((d) => ymd(d.at).slice(0, 7) === ym && (place === '전체' || d.place === place));
    const by = {};
    recs.forEach((d) => {
      let t = d.at;
      const h = kParts(t).h;
      if (d.type === '퇴근' && h >= 16 && h < 18 && !d.excl) t += (18 - h) * 3600 * 1000;
      const day = ymd(d.at);   // 근무일이 아니라 찍은 날짜 칸에
      ((by[d.no] = by[d.no] || {})[day] = by[d.no][day] || []).push(t);
    });
    const blank = () => new Array(DAYS).fill('');
    const rows = [], bg = [], fw = [], al = [], merges = [];
    const push = (r, b, f, a) => { rows.push(r); bg.push(b || new Array(DAYS).fill('#ffffff')); fw.push(f || new Array(DAYS).fill('normal')); al.push(a || new Array(DAYS).fill('center')); };
    const r0 = blank(); r0[0] = '근태기록표'; push(r0, null, new Array(DAYS).fill('bold')); merges.push([0, 0, 1, DAYS]);
    push(blank());
    const r2 = blank(), b2 = new Array(DAYS).fill('#ffffff'), f2 = new Array(DAYS).fill('normal');
    r2[0] = '출근 월'; r2[2] = ym; r2[6] = '장소'; r2[8] = place;
    r2[12] = y + '/' + pad(m) + '/01 ~ ' + pad(m) + '/' + pad(last) + '   ( ' + (place === '전체' ? 'krf센터' : place) + ' )';
    [2, 3, 4, 8, 9, 10].forEach((c) => { b2[c] = '#fff2cc'; }); [0, 2, 6, 8].forEach((c) => { f2[c] = 'bold'; });
    push(r2, b2, f2); merges.push([2, 0, 1, 2], [2, 2, 1, 3], [2, 6, 1, 2], [2, 8, 1, 3], [2, 12, 1, DAYS - 12]);
    const r3 = blank(); r3[0] = '※ 16:00~17:59 퇴근은 18시대 근무 인정 시각으로 표시합니다 (16시대 +2시간, 17시대 +1시간 / 원본은 기록 그대로). 보정하지 않을 기록은 \'기록\' 탭의 \'보정제외\'를 체크하세요.';
    push(r3, null, null, new Array(DAYS).fill('left')); merges.push([3, 0, 1, DAYS]);
    st.forEach((e) => {
      const day = blank(), info = blank(), times = blank(), k = rows.length;
      for (let d = 1; d <= last; d++) {
        day[d - 1] = String(d);
        const list = ((by[String(e.no)] || {})[ym + '-' + pad(d)] || []).sort((a, b) => a - b);
        times[d - 1] = list.map(hm).join('\n');
      }
      info[0] = '사원번호'; info[2] = String(e.no); info[8] = '성명'; info[10] = e.name; info[18] = '부서'; info[20] = e.dept || '';
      push(day, new Array(DAYS).fill('#f3f3f3'), new Array(DAYS).fill('bold'));
      push(info, new Array(DAYS).fill('#dbe5f1'));
      push(times);
      merges.push([k + 1, 0, 1, 2], [k + 1, 2, 1, 6], [k + 1, 8, 1, 2], [k + 1, 10, 1, 8], [k + 1, 18, 1, 2], [k + 1, 20, 1, DAYS - 20]);
    });
    return { ok: true, month: ym, place: place, places: placesList, fixed: false, fromDb: true, rows: rows, bg: bg, fw: fw, al: al, merges: merges, widths: new Array(DAYS).fill(44), hidden: [] };
  };

  /* ───────── 바깥에서 쓰는 것 ───────── */
  // 서버를 꼭 거쳐야 하는 것: superJoin, pcStart, pcApprove, pushSub, superLeave, fbBind, fbNotify, fbGeocode
  const DB_ACTIONS = Object.keys(H);
  window.KRFDB = {
    /** 시작 (화면을 열 때 한 번). serverCall(action, payload) = 예전 서버 요청 함수 */
    init: function (devId, serverCall) {
      deviceId = devId; server = serverCall;
      if (!readyP) readyP = timeout(start(), 12000, 'start').then(() => true, (e) => { broken = true; console.warn('[DB] 시작 실패 → 서버로', e); return false; });
      return readyP;
    },
    ready: () => !!(readyP && db && dv && !broken),
    can: (action) => !!(db && dv && !broken && DB_ACTIONS.indexOf(action) >= 0),
    /** 기기 정보를 서버에서 다시 받아 옴 (관리자 등록·PC 연결 뒤) */
    rebind: async function () { if (db) await refreshDevice(true); },
    call: async function (action, payload) {
      try {
        return await timeout(H[action](payload || {}), 15000, action);
      } catch (e) {
        if (/resource-exhausted|quota/i.test(String(e && (e.code || e.message)))) broken = true;   // 오늘 무료 한도를 다 씀 → 서버로
        throw e;
      }
    },
    uid: () => uid,
    who: () => ({ dv: dv, bind: bind, staff: staffMe })
  };
})();

        const prev = d > 1 ? ym + '-' + String(d - 1).padStart(2, '0') : '';
        const carried = prev ? ((by[s.no] || {})[prev] || []).filter((r) => r.type === '퇴근' && r.day === date) : [];
        const lastDay = d === last;   // 달 마지막 날 근무의 다음날 퇴근은 다음 달 칸이 없으니 이 칸에 ↗로 둠
        let cell = '';
        carried.forEach((r) => { if (r.place) seen[r.place] = 1; cell += '<div class="out">' + tmCarried(r) + '</div>'; });
        if (items.length) {
          days++;
          pairs(items).forEach((p) => { if (p.in && p.out) tot += p.out.at - p.in.at; });
          items.forEach((r) => { if (r.place) seen[r.place] = 1; });
          const c = cellInfo(items, date), outsHere = c.outs.filter((r) => r.day === date || lastDay);
          cell += c.ins.length ? '<div class="in">' + tm(c.ins[0]) + '</div>' : '<div><span class="miss">출근?</span></div>';
          cell += outsHere.length ? '<div class="out">' + tm(outsHere[outsHere.length - 1]) + '</div>' : (c.needOut ? '<div><span class="miss">퇴근?</span></div>' : '');
          if (items.length > 2) cell += '<div class="more">' + items.length + '건</div>';
        }
        h += '<td class="c' + (wd === 0 || wd === 6 ? ' we' : '') + (dk && dk.no === s.no && dk.wd === date ? ' sel' : '') + '" data-no="' + esc(s.no) + '" data-wd="' + (!items.length && carried.length ? prev : date) + '">' + cell + '</td>';   // 전날 근무의 퇴근만 있는 칸은 누르면 그 근무일을 엶
      }
      h += '<td class="tot">' + days + '일<small>' + hm(tot) + '</small></td></tr>';
    });
    h += '</tbody></table><div class="leg">' + Object.keys(seen).sort().map((p) => '<span><i style="background:' + placeColor(p) + '"></i>' + esc(p) + '</span>').join('') +
      '<span>↙ 전날 출근한 야간 근무의 퇴근</span><span>* 관리자가 보정한 시각</span><span>칸을 누르면 그날 기록을 고칠 수 있어요</span></div></div>';
    $('filters').innerHTML = '';
    $('view').innerHTML = staff.length ? h : '<div class="empty">직원이 없어요</div>';
  }

  // ── 옆 칸: 한 사람의 하루 기록 ──
  function closeDrawer() { dk = null; $('drawer').classList.add('hidden'); document.querySelectorAll('.grid td.sel').forEach((e) => e.classList.remove('sel')); }
  function renderDrawer() {
    const box = $('drawer');
    if (!dk || !D || view !== 'grid') { box.classList.add('hidden'); return; }
    const items = D.recs.filter((r) => r.no === dk.no && r.wd === dk.wd).sort((a, b) => a.at - b.at);
    let h = '<div style="display:flex;align-items:center"><h2 style="flex:1">' + esc(nameOf(dk.no) || dk.no) + '</h2><button class="btn sm" data-act="closeDrawer">' + ic('x', 15) + '닫기</button></div>' +
      '<div class="sub">' + md(dk.wd) + ' 근무 · 값을 바꾸면 바로 저장돼요</div>';

    else h += '<table><tbody>' + items.map((r) => '<tr class="ed keep' + (r.pend ? ' pend' : '') + '" data-id="' + r.id + '">' + edCells(r) +
      '<td><button class="btn sm no" data-act="del" title="지우기">' + ic('trash', 15) + '</button></td></tr>').join('') + '</tbody></table>';
    // 넣는 칸: 빠진 쪽과 시각을 미리 짐작 (오후 출근이면 야간으로 보고 퇴근은 다음날 아침)
    const c = cellInfo(items, dk.wd);
    let g = { type: '출근', time: '09:00', nd: false };
    if (c.ins.length && !c.outs.length) {
      const hh = Number(c.ins[0].time.slice(0, 2));
      g = hh >= 14 ? { type: '퇴근', time: '09:00', nd: true } : { type: '퇴근', time: '18:00', nd: false };
    } else if (c.needIn) g = { type: '출근', time: c.outs[0].day !== dk.wd ? '17:00' : '09:00', nd: false };
    const mine = D.recs.filter((r) => r.no === dk.no && r.place);
    const gp = items.length ? items[items.length - 1].place : (mine.length ? mine[mine.length - 1].place : '');
    h += '<div class="addbox" id="addBox"><b>기록 넣기</b><div class="row"><select id="aType">' + opt('출근', g.type) + opt('퇴근', g.type) + '</select>' +
      '<input type="time" id="aTime" value="' + g.time + '"><label><input type="checkbox" id="aNd"' + (g.nd ? ' checked' : '') + '> 다음날</label>' +
      placeSel(D.places.indexOf(gp) >= 0 ? gp : '', 'id="aPlace"') + '</div><button class="btn pri" data-act="add">' + ic('plus', 16) + '넣기</button></div>';
    box.innerHTML = h;
    box.classList.remove('hidden');
  }

  // ── 기록 표 ──
  function listRows() {
    const a = D.recs.filter((r) => (!fil.no || r.no === fil.no) && (!fil.type || r.type === fil.type) && (!fil.place || r.place === fil.place) && (!fil.fix || r.fix || /관리자/.test(r.how)));
    const k = sort.k, dir = sort.dir;
    a.sort((x, y) => {
      const c = k === 'name' ? x.name.localeCompare(y.name, 'ko') : k === 'place' ? x.place.localeCompare(y.place, 'ko') : k === 'type' ? x.type.localeCompare(y.type, 'ko') : 0;
      return (c || (x.wd < y.wd ? -1 : x.wd > y.wd ? 1 : 0) || (x.at - y.at)) * dir;
    });
    return a;
  }
  function renderFilters() {
    const places = Array.from(new Set(D.recs.map((r) => r.place).filter((p) => p))).sort();
    const staff = gridStaff(byNoWd());
    $('filters').innerHTML = '<select data-fil="no">' + opt('', fil.no, '직원 전체') + staff.map((s) => opt(s.no, fil.no, s.name)).join('') + '</select>' +
      '<select data-fil="type">' + opt('', fil.type, '출근·퇴근') + opt('출근', fil.type) + opt('퇴근', fil.type) + '</select>' +
      '<select data-fil="place">' + opt('', fil.place, '장소 전체') + places.map((p) => opt(p, fil.place)).join('') + '</select>' +
      '<label><input type="checkbox" data-fil="fix"' + (fil.fix ? ' checked' : '') + '> 관리자가 손댄 것만</label>';
  }
  function bulkBar() {
    const box = $('bulk');

      '<div class="bulk hidden" id="bulk"></div>' +

    h += rows.map((r) => '<tr class="ed' + (r.pend ? ' pend' : '') + '" data-id="' + r.id + '"><td><input type="checkbox" data-sel' + (sel.has(r.id) ? ' checked' : '') + '></td><td class="num">' + md(r.wd) + '</td><td><b>' + esc(r.name) + '</b></td>' +

  // ── 빠진 기록: 짝이 안 맞는 출근·퇴근을 모아 보여 주고 그 줄에서 바로 넣음 ──
  function missRows(d) {
    d = d || D;
    const by = byNoWd(d), out = [], today = todayStr();
    gridStaff(by, d).forEach((s) => Object.keys(by[s.no] || {}).sort().forEach((wd) => pairs(by[s.no][wd]).forEach((p) => {
      if (p.in && !p.out) { if (wd === today || Date.now() - p.in.at < 16 * 3600 * 1000) return; out.push({ s: s, wd: wd, has: p.in, miss: '퇴근' }); }
      else if (!p.in && p.out) out.push({ s: s, wd: wd, has: p.out, miss: '출근' });
    })));
    return out;
  }
  function missGuess(r) {
    const hh = Number(r.has.time.slice(0, 2));
    if (r.miss === '퇴근') return hh >= 14 ? { time: '09:00', nd: true } : { time: '18:00', nd: false };
    return { time: r.has.day !== r.wd ? '17:00' : '09:00', nd: false };
  }
  function renderMiss() {
    $('filters').innerHTML = '';
    const rows = missRows();
    if (!rows.length) { $('view').innerHTML = '<div class="empty">이 달에는 빠진 기록이 없어요</div>'; return; }
    $('view').innerHTML = '<div class="pad"><div class="hint">모두 ' + rows.length + '건 · 시각과 장소를 확인하고 [넣기]를 누르세요 (시각은 미리 짐작해 둔 값이에요)</div>' +
      '<table class="list"><thead><tr><th>이름</th><th>근무일</th><th>있는 기록</th><th>빠진 것</th><th>넣을 시각</th><th>다음날</th><th>장소</th><th></th></tr></thead><tbody>' +
      rows.map((r) => {
        const g = missGuess(r);
        return '<tr data-no="' + esc(r.s.no) + '" data-wd="' + r.wd + '" data-type="' + r.miss + '"><td><b>' + esc(r.s.name) + '</b></td><td class="num">' + md(r.wd) + '</td>' +
          '<td class="num">' + esc(r.has.type) + ' ' + (r.has.day !== r.wd ? '다음날 ' : '') + esc(r.has.time) + (r.has.fix ? '*' : '') + ' <span class="sub2">' + esc(r.has.place) + '</span></td>' +
          '<td><span class="miss" style="font-size:12.5px">' + r.miss + ' 없음</span></td>' +
          '<td><input type="time" class="mT" value="' + g.time + '"></td><td><label><input type="checkbox" class="mN"' + (g.nd ? ' checked' : '') + '> 다음날</label></td>' +
          '<td>' + placeSel(D.places.indexOf(r.has.place) >= 0 ? r.has.place : '', 'class="mP"') + '</td><td><button class="btn sm pri" data-act="missAdd">' + ic('plus', 15) + '넣기</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ── 오늘 현황: 등록 신청 승인·거절, 지금 출근 중 ──
  let T = null, tSeq = 0;
  async function loadToday() {
    const seq = ++tSeq, d = await call('admin');
    if (seq !== tSeq) return;
    T = (d && d.ok) ? d : (T && T !== 'err' ? T : 'err');

    const cur = cache[ymStr(new Date())], nMiss = cur ? missRows(cur).length : '';
    let h = '<div class="pad"><div class="cards"><div class="card"><h3>등록 신청 <span class="cnt">' + T.pending.length + '</span></h3>';
    h += T.pending.length ? T.pending.map((e) => '<div class="line"><b>' + esc(e.name) + '</b> <span class="sub2">' + esc(e.dept || '') + (e.req ? ' · ' + esc(e.req) : '') + '</span><span class="sp"></span>' +

      : '<div class="line sub2">새 신청이 없어요</div>';

      (nMiss === '' ? '빠진 기록 화면에서 볼 수 있어요' : nMiss ? '출근이나 퇴근 한쪽만 있는 기록이 ' + nMiss + '건 있어요' : '빠진 기록이 없어요') + '</span><span class="sp"></span>' +

      '</tbody></table></div>';
  }

  // ── 직원: 추가, 이름·부서·상태, 휴대폰 등록, 관리자·같이 찍기 (값을 바꾸면 바로 저장) ──
  let staffAll = false;

        '<td><input type="text" class="pLng num" value="' + esc(p.lng) + '" style="width:112px"></td><td><input type="number" class="pR" value="' + esc(p.radius || PL.defaultRadius) + '" style="width:80px"></td>' +

  // ── 근태기록표: 구글 시트의 '근태기록' 탭이 계산한 표를 그대로 ──
  // 근태기록표는 달 + 장소(시트 I3 칸과 같음)마다 따로 기억
  const SH = {};
  let shSeq = 0, shPlace = store.get('shPlace') || '전체', shPlaces = ['전체'];
  const shKey = () => ym + '|' + shPlace;
  async function loadSheet() {
    const seq = ++shSeq, k = shKey();

    SH[k] = (d && d.ok) ? d : (SH[k] && SH[k] !== 'err' ? SH[k] : 'err');

  }
  function renderSheet() {
    const list = shPlaces.indexOf(shPlace) < 0 ? shPlaces.concat([shPlace]) : shPlaces;
    $('filters').innerHTML = '<label class="sub2">장소</label><select id="shPlace">' + list.map((p) => opt(p, shPlace)).join('') + '</select>';
    const d = SH[shKey()];
    if (d === undefined) { $('view').innerHTML = '<div class="empty">근태기록표를 계산하는 중… (몇 초 걸려요)</div>'; return; }
    if (d === 'err') { $('view').innerHTML = '<div class="empty">불러오지 못했어요. [새로 고침]을 눌러 주세요</div>'; return; }
    $('view').innerHTML = '<div class="pad"><div class="hint noprint">' + (d.fixed ? '이 달은 확정해서 보관해 둔 표예요.' : d.fromDb ? "구글 시트 '근태기록' 탭과 같은 방식으로 기록에서 바로 계산한 표예요." : "구글 시트 '근태기록' 탭이 계산한 표를 그대로 보여 줘요. 기록을 고친 뒤에는 [새로 고침]을 눌러 주세요.") + '</div>' +
      sheetTable(d) + '</div>';
  }
  // 시트 모양 그대로: 병합 칸은 rowspan/colspan, 열 너비·배경색·굵기·정렬도 시트에서 받은 대로
  function sheetTable(d) {
    const R = d.rows.length, C = R ? d.rows[0].length : 0, hid = {}, cover = {}, span = {};
    (d.hidden || []).forEach((c) => { hid[c] = 1; });
    (d.merges || []).forEach((m) => {
      const r0 = m[0], c0 = m[1], rs = Math.min(m[2], R - r0);
      let cs = 0;
      for (let c = c0; c < Math.min(c0 + m[3], C); c++) if (!hid[c]) cs++;
      span[r0 + ',' + c0] = [rs, cs];
      for (let r = r0; r < r0 + rs; r++) for (let c = c0; c < c0 + m[3]; c++) if (r !== r0 || c !== c0) cover[r + ',' + c] = 1;
    });
    const AL = { left: 'left', right: 'right', center: 'center', general: '', 'general-left': 'left', 'general-right': 'right' };
    let h = '<table class="sheet"><colgroup>';
    for (let c = 0; c < C; c++) if (!hid[c]) h += '<col style="width:' + Math.max(18, Math.round(((d.widths || [])[c] || 60) * 0.9)) + 'px">';
    h += '</colgroup><tbody>';
    for (let r = 0; r < R; r++) {
      h += '<tr>';
      for (let c = 0; c < C; c++) {
        if (hid[c] || cover[r + ',' + c]) continue;
        const sp = span[r + ',' + c], bg = d.bg ? d.bg[r][c] : '', fw = d.fw ? d.fw[r][c] : '', al = d.al ? AL[String(d.al[r][c]).toLowerCase()] : '';
        let st = '';
        if (bg && bg !== '#ffffff') st += 'background:' + bg + ';';
        if (fw === 'bold') st += 'font-weight:700;';
        if (al) st += 'text-align:' + al + ';';
        h += '<td' + (sp && sp[0] > 1 ? ' rowspan="' + sp[0] + '"' : '') + (sp && sp[1] > 1 ? ' colspan="' + sp[1] + '"' : '') + (st ? ' style="' + st + '"' : '') + '>' + esc(d.rows[r][c]) + '</td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }

  // ── 출퇴근카드: 예전 지문 기계의 직원별 카드와 같은 양식 (한 사람 한 장, 인쇄용) ──
  // 근무 형태는 그날 첫 출근 시각으로 정함: 오후 2시 전이면 주간(09:00-18:00), 그 뒤면 야간(17:00-다음날 09:00)
  let cardNo = store.get('cardNo') || '';
  function cardDay(items, wd) {
    const ins = items.filter((r) => r.type === '출근'), outs = items.filter((r) => r.type === '퇴근');
    const i = ins[0], o = outs[outs.length - 1];
    const night = i ? Number(i.time.slice(0, 2)) >= 14 : (o ? o.day !== wd : false);
    const start = kst(wd, night ? '17:00' : '09:00', false), end = kst(wd, night ? '09:00' : '18:00', night);
    let late = 0, early = 0;
    if (i && i.at - start >= 60000) late = Math.floor((i.at - start) / 60000);
    if (o) {
      let oat = o.at;
      const oh = Number(o.time.slice(0, 2));
      if (!night && o.day === wd && (oh === 16 || oh === 17)) oat += (18 - oh) * 3600000;   // 근태기록표와 같은 규칙: 16·17시대 퇴근은 18시대로 인정
      if (end - oat >= 60000) early = Math.floor((end - oat) / 60000);
    }
    return { i: i, o: o, late: late, early: early };
  }
  function cardHtml(s) {
    const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate(), mm = String(m).padStart(2, '0');
    const by = byNoWd()[s.no] || {}, range = y + '/' + mm + '/01 ~ ' + mm + '/' + String(last).padStart(2, '0');
    let rows = '', work = 0, lateN = 0, lateM = 0, earlyN = 0, earlyM = 0;
    for (let d = 1; d <= last; d++) {
      const wd = ym + '-' + String(d).padStart(2, '0'), w = new Date(y, m - 1, d).getDay(), items = by[wd] || [];
      const c = items.length ? cardDay(items, wd) : null;
      if (c) { work++; if (c.late) { lateN++; lateM += c.late; } if (c.early) { earlyN++; earlyM += c.early; } }
      const tm = (r, cls) => r ? '<span class="' + cls + '">' + esc(r.time) + (r.fix ? '*' : '') + '</span>' + (r.day !== wd ? '<span class="nd"> 다음날</span>' : '') : '';
      // 퇴근은 찍은 날짜 줄에 보여 줌: 그날 근무의 퇴근 + 전날 야간 근무의 다음날 아침 퇴근 (달 마지막 날 근무의 다음날 퇴근만 마지막 줄에 '다음날'로)
      const prevWd = d > 1 ? ym + '-' + String(d - 1).padStart(2, '0') : '';
      const outsHere = items.filter((r) => r.type === '퇴근' && (r.day === wd || d === last))
        .concat(prevWd ? (by[prevWd] || []).filter((r) => r.type === '퇴근' && r.day === wd) : []).sort((a, b) => a.at - b.at);
      const oShow = outsHere.length ? outsHere[outsHere.length - 1] : null;
      const rm = !c ? '' : !c.i ? '출근 기록 없음' : !c.o ? (wd === todayStr() ? '' : '퇴근 기록 없음') : '';
      rows += '<tr><td class="' + (w === 0 ? 'sun' : w === 6 ? 'sat' : '') + '">' + String(d).padStart(2, '0') + ' ' + WEEK[w] + '</td>' +
        '<td colspan="2">' + (c ? tm(c.i, 'ti') : '') + '</td><td colspan="2">' + tm(oShow, 'to') + '</td>' +
        (rm ? '<td colspan="4" class="rm bad">' + rm + '</td>' : '<td></td><td></td><td></td><td></td>') + '</tr>';
    }
    return '<div class="kcard"><h1>출퇴근카드</h1>' +
      '<div class="kd">출근 일자<span>' + range + '</span></div>' +
      '<table class="kt"><colgroup><col style="width:13%"><col style="width:9.5%"><col style="width:9.5%"><col style="width:9.5%"><col style="width:9.5%"><col style="width:12.25%"><col style="width:12.25%"><col style="width:12.25%"><col style="width:12.25%"></colgroup><tbody>' +
      '<tr><td class="lb">부서</td><td colspan="4" class="big">' + esc(s.dept || '') + '</td><td class="lb">이름</td><td colspan="3" class="big">' + esc(s.name) + '</td></tr>' +
      '<tr><td class="lb">일자</td><td colspan="4" class="big">' + range + '</td><td class="lb">번호</td><td colspan="3" class="big">' + esc(s.no) + '</td></tr>' +
      '<tr><td class="lb" rowspan="2">결근(일)</td><td class="lb" rowspan="2">출근(일)</td><td class="lb" colspan="3">연장(시)</td><td class="lb" colspan="2">지각</td><td class="lb" colspan="2">조퇴</td></tr>' +
      '<tr><td class="lb" colspan="2">연장</td><td class="lb">야근</td><td class="lb">(회)</td><td class="lb">(분)</td><td class="lb">(회)</td><td class="lb">(분)</td></tr>' +
      '<tr><td></td><td>' + (work || '') + '</td><td colspan="2"></td><td></td><td>' + (lateN || '') + '</td><td>' + (lateM || '') + '</td><td>' + (earlyN || '') + '</td><td>' + (earlyM || '') + '</td></tr>' +
      '<tr><td colspan="9">1. 09:00-18:00, 17:00-09:00</td></tr>' +
      '<tr><td colspan="9" class="ttl">출퇴근기록표</td></tr>' +
      '<tr><td class="lb" rowspan="2">일자/주</td><td class="lb" colspan="4">출퇴근</td><td class="lb" colspan="2">연장</td><td class="lb" colspan="2">야근</td></tr>' +
      '<tr><td class="lb" colspan="2">출근</td><td class="lb" colspan="2">퇴근</td><td class="lb">시작</td><td class="lb">종료</td><td class="lb">시작</td><td class="lb">종료</td></tr>' +
      rows + '</tbody></table></div>';
  }
  function cardStaff() { return gridStaff(byNoWd()); }
  function renderCard() {
    const staff = cardStaff();
    if (!staff.some((s) => s.no === cardNo)) cardNo = staff.length ? staff[0].no : '';
    $('filters').innerHTML = '<select id="cardSel">' + staff.map((s) => opt(s.no, cardNo, s.name + (s.dept ? ' · ' + s.dept : ''))).join('') + '</select>' +
      '<button class="btn" data-act="cardAll">' + ic('print', 16) + '전체 인쇄</button>';
    const s = staff.filter((x) => x.no === cardNo)[0];
    $('view').innerHTML = s ? '<div class="pad"><div class="hint noprint">예전 지문 기계 카드와 같은 양식이에요. 지각·조퇴는 주간 09:00~18:00, 야간 17:00~다음날 09:00 기준으로 세고, 16·17시대 퇴근은 근태기록표처럼 18시대로 인정해요. * 는 관리자가 보정한 시각이에요.</div>' +
      '<div class="kcards">' + cardHtml(s) + '</div></div>' : '<div class="empty">직원이 없어요</div>';

  function render() {
    setYm();
    if (view !== 'grid') $('drawer').classList.add('hidden');
    if (view === 'card') { if (D) renderCard(); return; }
    if (view === 'today') return renderToday();
    if (view === 'log') return renderLog();
    if (view === 'staff') return renderStaff();
    if (view === 'place') return renderPlace();

    if (view === 'grid') { renderGrid(); renderDrawer(); } else if (view === 'miss') renderMiss(); else renderList();
  }
  function loadFor(v) {
    if (v === 'today' || v === 'staff') loadToday();
