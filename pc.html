<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KRF출퇴근 관리 (PC)</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#e7e9ee; --line2:#f0f2f5; --ink:#191f28; --ink2:#333d4b; --sub:#6b7684; --mute:#8b95a1;
          --pri:#3182f6; --pri-d:#1b64da; --pri-bg:#e8f3ff; --ok:#12855a; --out:#c2620a; --bad:#e5484d; --bad-bg:#ffeff0; --warn-bg:#fff7e0; --warn:#946200; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', 'Noto Sans KR', sans-serif; color:var(--ink); background:var(--bg); font-size:14.5px; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
  .hidden { display:none !important; }
  button, select, input, textarea { font:inherit; letter-spacing:inherit; color:inherit; }
  button { cursor:pointer; }
  .ic { flex:none; vertical-align:-3px; }
  /* 연결 화면 */
  #pair { height:100%; display:flex; align-items:center; justify-content:center; }
  #pair .box { background:#fff; border-radius:20px; padding:40px 48px; text-align:center; box-shadow:0 8px 40px rgba(25,31,40,.08); max-width:520px; }
  #pair h1 { margin:0 0 6px; font-size:22px; font-weight:700; }
  #code { font-size:60px; font-weight:800; letter-spacing:8px; margin:22px 0; color:var(--pri); font-variant-numeric:tabular-nums; }
  #pair ol { text-align:left; line-height:2; color:var(--ink2); margin:0; padding:16px 20px 16px 38px; background:var(--bg); border-radius:12px; }
  /* 틀 */
  #app { height:100%; display:flex; }
  aside { width:216px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 12px 14px; flex:none; }
  .brand { display:flex; align-items:center; gap:10px; padding:2px 8px 18px; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:var(--pri); color:#fff; display:flex; align-items:center; justify-content:center; }
  .brand b { font-size:15.5px; font-weight:700; display:block; line-height:1.2; }
  .brand small { color:var(--mute); font-size:12px; }
  .grp { font-size:11.5px; color:var(--mute); font-weight:600; padding:14px 10px 6px; }
  aside .nav { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; color:var(--ink2); padding:9px 10px; border-radius:9px; font-size:14.5px; font-weight:500; }
  aside .nav:hover { background:var(--line2); }
  aside .nav.sel { background:var(--pri-bg); color:var(--pri-d); font-weight:650; }
  aside .nav .n { margin-left:auto; font-size:11.5px; font-weight:700; background:var(--bad); color:#fff; border-radius:99px; padding:1px 7px; }
  aside .foot { margin-top:auto; font-size:12px; color:var(--mute); line-height:1.9; padding:10px 10px 0; border-top:1px solid var(--line2); }
  aside .foot button, aside .foot a { background:none; border:none; color:var(--sub); padding:0; font-size:12px; text-decoration:none; }
  aside .foot button:hover, aside .foot a:hover { color:var(--pri); text-decoration:underline; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .top { display:flex; align-items:center; gap:10px; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; min-height:64px; }
  .top h2 { margin:0 6px 0 0; font-size:19px; font-weight:700; }
  .mon { display:flex; align-items:center; background:var(--bg); border-radius:10px; padding:3px; }
  .mon b { font-size:14.5px; font-weight:650; min-width:104px; text-align:center; font-variant-numeric:tabular-nums; }
  .mon button { border:none; background:none; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink2); }
  .mon button:hover:not(:disabled) { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .mon button:disabled { opacity:.3; cursor:default; }
  .btn { display:inline-flex; align-items:center; gap:6px; height:34px; background:#fff; border:1px solid #d5d9e0; border-radius:9px; padding:0 12px; font-weight:600; font-size:13.5px; color:var(--ink2); white-space:nowrap; }
  .btn:hover:not(:disabled) { background:var(--line2); }
  .btn.pri { background:var(--pri); border-color:var(--pri); color:#fff; }
  .btn.pri:hover:not(:disabled) { background:var(--pri-d); }
  .btn.no { color:var(--bad); border-color:#f3c2c4; }
  .btn.no:hover:not(:disabled) { background:var(--bad-bg); }
  .btn.sm { height:30px; padding:0 10px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:default; }
  select, input[type=text], input[type=number], input[type=time], textarea { border:1px solid #d5d9e0; border-radius:8px; padding:6px 8px; background:#fff; outline:none; }
  select:focus, input:focus, textarea:focus { border-color:var(--pri); box-shadow:0 0 0 3px var(--pri-bg); }
  input[type=checkbox] { width:16px; height:16px; accent-color:var(--pri); vertical-align:-3px; }
  label { white-space:nowrap; }
  .sp { flex:1; }
  #stat { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--sub); font-weight:600; }
  #stat::before { content:''; width:7px; height:7px; border-radius:50%; background:#22b573; }
  #stat.busy { color:var(--warn); } #stat.busy::before { background:#f5a623; }
  #filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #view { flex:1; overflow:auto; }
  .pad { padding:18px 24px 28px; display:inline-block; min-width:100%; vertical-align:top; }
  .empty { padding:80px 20px; text-align:center; color:var(--mute); font-size:15.5px; }
  .hint { margin:0 0 10px; color:var(--sub); font-size:13px; }
  table { border-collapse:separate; border-spacing:0; background:#fff; border:1px solid var(--line); border-radius:12px; }
  th, td { border-bottom:1px solid var(--line2); padding:8px 10px; text-align:left; }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom:none; }
  thead th { position:sticky; top:0; background:#fafbfc; z-index:2; font-size:12.5px; font-weight:600; color:var(--sub); border-bottom:1px solid var(--line); white-space:nowrap; }
  thead th:first-child { border-top-left-radius:12px; } thead th:last-child { border-top-right-radius:12px; }
  th small, td small { display:block; font-weight:500; color:var(--mute); font-size:11px; }
  .num { font-variant-numeric:tabular-nums; }
  /* 월간 표 */
  .grid th, .grid td { border-right:1px solid var(--line2); padding:5px 6px; }
  .grid th.st { position:sticky; left:0; z-index:1; background:#fff; min-width:96px; white-space:nowrap; font-weight:650; font-size:14px; }
  .grid thead th.st { z-index:3; background:#fafbfc; }
  .grid thead th { text-align:center; }
  .grid td.c { min-width:54px; height:48px; text-align:center; font-size:12.5px; font-weight:650; cursor:pointer; line-height:1.55; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .grid td.c:hover { background:var(--pri-bg); }
  .grid td.c.sel { box-shadow:inset 0 0 0 2px var(--pri); background:var(--pri-bg); }
  .grid .we { background:#fbfbfc; }
  .grid .sun { color:var(--bad); } .grid .sat { color:var(--pri); }
  .grid th.today { background:var(--pri-bg); color:var(--pri-d); }
  .in { color:var(--ok); } .out { color:var(--out); }
  .miss { display:inline-block; color:var(--bad); background:var(--bad-bg); border-radius:6px; padding:0 5px; font-size:11.5px; font-weight:700; }
  .more { font-size:10px; color:var(--mute); font-weight:500; }
  .grid td.tot { text-align:center; font-weight:650; white-space:nowrap; font-size:13px; border-right:none; }
  .leg { margin-top:12px; font-size:12.5px; color:var(--sub); display:flex; gap:16px; flex-wrap:wrap; }
  .leg i { display:inline-block; width:16px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  /* 목록 표 */
  .list { width:100%; }
  .list th[data-sort] { cursor:pointer; }
  .list th[data-sort]:hover { color:var(--ink); }
  .list td { font-size:14px; white-space:nowrap; }
  .list td.how { white-space:normal; font-size:12px; color:var(--mute); max-width:320px; }
  .list tbody tr:hover td { background:#f9fafb; }
  .ed select, .ed input[type=time] { border-color:transparent; background:transparent; padding:4px 5px; }
  .ed select:hover, .ed input[type=time]:hover { border-color:#d5d9e0; background:#fff; }
  .ed.pend td { background:var(--warn-bg); }
  .keep select, .keep input { border-color:#d5d9e0 !important; background:#fff !important; }
  .chip { display:inline-block; font-size:11.5px; font-weight:650; border-radius:99px; padding:2px 8px; background:var(--line2); color:var(--sub); }
  .chip.ok { background:#e6f6ee; color:var(--ok); } .chip.warn { background:var(--warn-bg); color:var(--warn); } .chip.bad { background:var(--bad-bg); color:var(--bad); }
  .bulk { display:flex; align-items:center; gap:8px; background:var(--ink); color:#fff; border-radius:10px; padding:8px 12px; margin-bottom:10px; font-weight:600; font-size:13.5px; }
  .bulk select { color:var(--ink); }
  /* 카드 */
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card h3 { margin:0 0 10px; font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .card h3 .cnt { font-size:12.5px; color:var(--pri-d); background:var(--pri-bg); border-radius:99px; padding:1px 8px; font-weight:700; }
  .card .line { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line2); }
  .sub2 { color:var(--sub); font-size:13.5px; }
  .form { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .form b { font-size:14px; margin-right:4px; }
  textarea { width:100%; min-height:150px; font-family:inherit; font-size:13.5px; line-height:1.6; resize:vertical; }
  /* 근태기록표 */
  .sheet { table-layout:fixed; border-radius:4px; border-color:#cfd4dc; }
  .sheet td { font-size:11.5px; padding:2px 3px; white-space:pre-line; line-height:1.35; overflow:hidden; text-overflow:clip; border-right:1px solid #e3e6eb; border-bottom:1px solid #e3e6eb; text-align:center; font-variant-numeric:tabular-nums; height:20px; }
  .sheet tbody tr:last-child td { border-bottom:1px solid #e3e6eb; }
  /* 옆 칸 */
  #drawer { width:452px; background:#fff; border-left:1px solid var(--line); padding:20px; overflow:auto; flex:none; box-shadow:-8px 0 24px rgba(25,31,40,.05); }
  #drawer h2 { margin:0; font-size:19px; font-weight:700; }
  #drawer .sub { color:var(--sub); font-size:13px; margin:4px 0 14px; }
  #drawer table { width:100%; }
  #drawer td { font-size:14px; padding:6px 4px; white-space:nowrap; }
  #drawer .addbox { margin-top:16px; padding:14px; background:var(--bg); border-radius:12px; }
  #drawer .addbox b { display:block; margin-bottom:10px; font-size:14px; }
  #drawer .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; font-weight:500; z-index:9; display:flex; gap:14px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  #toast button { background:none; border:none; color:#7db5ff; font-weight:700; padding:0; }
  /* 출퇴근카드 (예전 지문 기계 카드와 같은 양식) */
  .kcards { display:flex; flex-wrap:wrap; gap:24px; }
  .kcard { width:640px; background:#fff; padding:18px 20px 22px; border:1px solid var(--line); border-radius:12px; font-family:'Malgun Gothic', 'Pretendard Variable', sans-serif; color:#000; }
  .kcard h1 { margin:0 0 6px; text-align:center; font-size:30px; font-weight:700; color:#0000cc; letter-spacing:6px; }
  .kcard .kd { font-size:13px; margin:0 0 3px; }
  .kcard .kd span { margin-left:56px; }
  .kt { width:100%; border-collapse:collapse; table-layout:fixed; border:2px solid #0000cc; border-radius:0; }
  .kt td { border:1px solid #0000cc; padding:2px 4px; text-align:center; font-size:13px; height:21px; white-space:nowrap; overflow:hidden; }
  .kt .lb { color:#0000cc; }
  .kt .big { font-size:19px; font-weight:700; color:#0000cc; }
  .kt .ttl { font-weight:700; color:#0000cc; font-size:15px; }
  .kt .sun, .kt .hol { color:#d00; } .kt .sat { color:#b30000; }
  .kt .ti { color:#008080; font-weight:700; } .kt .to { color:#990000; font-weight:700; }
  .kt .nd { font-size:10px; font-weight:500; color:#666; }
  .kt .rm { color:#333; }
  .kt .rm.bad { color:#d00; }
  @media print {
    .kcards { display:block; } .kcard { border:none; border-radius:0; padding:0; margin:0 auto; page-break-after:always; break-after:page; width:180mm; }
    .kcard:last-child { page-break-after:auto; break-after:auto; }
    aside, .top, #drawer, #toast, .noprint { display:none !important; }
    #app, main, #view { display:block; height:auto; overflow:visible; }
    body { background:#fff; } .pad { padding:0; } table { border-radius:0; }
    thead th { position:static; }
  }
</style>
</head>
<body>
<div id="pair" class="hidden">
  <div class="box">
    <h1>이 PC를 관리 화면으로 연결</h1>
    <div style="color:#6b7684">관리자 휴대폰에서 아래 숫자를 넣어 주세요</div>
    <div id="code">······</div>
    <ol>
      <li>휴대폰에서 KRF출퇴근 앱의 <b>관리자 화면</b>을 엽니다</li>
      <li><b>PC 연결</b>을 누릅니다</li>
      <li>위 숫자 여섯 자리를 넣습니다</li>
    </ol>
    <div style="margin-top:16px;color:#8b95a1;font-size:13px">연결되면 이 화면이 저절로 바뀝니다 · <a href="index.html?m=1" style="color:#3182f6">휴대폰 화면 보기</a></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><div class="logo" data-ic="clock" data-s="20"></div><div><b>KRF 출퇴근</b><small>관리 화면</small></div></div>
    <div class="grp" style="padding-top:2px">출퇴근</div>
    <button class="nav" data-view="today"><span data-ic="home"></span>오늘 현황</button>
    <button class="nav" data-view="grid"><span data-ic="calendar"></span>월간 표</button>
    <button class="nav" data-view="list"><span data-ic="list"></span>기록</button>
    <button class="nav" data-view="miss"><span data-ic="alert"></span>빠진 기록<span class="n hidden" id="missN"></span></button>
    <button class="nav" data-view="log"><span data-ic="history"></span>수정 이력</button>
    <div class="grp">관리</div>
    <button class="nav" data-view="staff"><span data-ic="users"></span>직원</button>
    <button class="nav" data-view="place"><span data-ic="pin"></span>장소</button>
    <button class="nav" data-view="sheet"><span data-ic="sheet"></span>근태기록표</button>
    <button class="nav" data-view="card"><span data-ic="card"></span>출퇴근카드</button>
    <div class="foot">
      <div id="who" style="color:#333d4b;font-weight:600"></div>
      <div id="ver"></div>
      <button data-act="leave">이 PC 연결 끊기</button><br>
      <a href="index.html?m=1">휴대폰 화면 보기</a>
    </div>
  </aside>
  <main>
    <div class="top">
      <h2 id="title"></h2>
      <div class="mon" id="monBox">
        <button data-act="prev" title="이전 달"><span data-ic="chevL"></span></button>
        <b id="ym"></b>
        <button data-act="next" id="nextBtn" title="다음 달"><span data-ic="chevR"></span></button>
      </div>
      <button class="btn" data-act="now" id="nowBtn">이번 달</button>
      <span id="filters"></span>
      <span class="sp"></span>
      <span id="stat"></span>
      <button class="btn" data-act="reload"><span data-ic="refresh" data-s="16"></span>새로 고침</button>
      <button class="btn" data-act="print" id="printBtn"><span data-ic="print" data-s="16"></span>인쇄</button>
      <button class="btn" data-act="csv" id="csvBtn"><span data-ic="download" data-s="16"></span>엑셀로 내려받기</button>
    </div>
    <div id="view"></div>
  </main>
  <div id="drawer" class="hidden"></div>
</div>
<div id="toast" class="hidden"></div>

<script>
(function () {
  'use strict';
  const API_URL = 'https://script.google.com/macros/s/AKfycbz2JDvgmLBp1pYNwQiugaEPmIAR8C9f4fESfAICl5dmrbfS3RxNDce04pqRSEsf8q09/exec';
  const VER = '2026-11-14 13:41';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  // 선으로 그린 아이콘 (그림 문자 대신)
  const ICON = {
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3a6.5 6.5 0 0 1 3.5 5.7"/>',
    pin: '<path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    paste: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M9 11h6M9 15h6"/>',
    sheet: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
    download: '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
    refresh: '<path d="M20 11a8 8 0 0 0-14.3-4.3L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.3L20 16M20 20v-4h-4"/>',
    chevL: '<path d="M15 6l-6 6 6 6"/>', chevR: '<path d="M9 6l6 6-6 6"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    undo: '<path d="M4 9h10a6 6 0 0 1 0 12H8M4 9l4-4M4 9l4 4"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    card: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16a3 3 0 0 1 6 0M14 10h4M14 14h4"/>',
    print: '<path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/>'
  };
  const ic = (n, s) => '<svg class="ic" width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICON[n] || '') + '</svg>';
  document.querySelectorAll('[data-ic]').forEach((e) => { e.innerHTML = ic(e.dataset.ic, Number(e.dataset.s) || 18); });

  // 휴대폰 앱과 같은 방식의 기기 번호 (이 브라우저를 한 대의 기기로 봄)
  let deviceId = store.get('deviceId');
  if (!deviceId) {

  function saveEdit(rec, v, quiet) {

  // 시트 모양 그대로: 병합 칸은 rowspan/colspan, 열 너비·배경색·굵기·정렬도 시트에서 받은 대로
  function sheetTable(d) {
    const R = d.rows.length, C = R ? d.rows[0].length : 0, hid = {}, cover = {}, span = {};
    (d.hidden || []).forEach((c) => { hid[c] = 1; });
    (d.merges || []).forEach((m) => {
      const r0 = m[0], c0 = m[1], rs = Math.min(m[2], R - r0);
      let cs = 0;
      for (let c = c0; c < Math.min(c0 + m[3], C); c++) if (!hid[c]) cs++;
      span[r0 + ',' + c0] = [rs, cs];
      for (let r = r0; r < r0 + rs; r++) for (let c = c0; c < c0 + m[3]; c++) if (r !== r0 || c !== c0) cover[r + ',' + c] = 1;
    });
    const AL = { left: 'left', right: 'right', center: 'center', general: '', 'general-left': 'left', 'general-right': 'right' };
    let h = '<table class="sheet"><colgroup>';
    for (let c = 0; c < C; c++) if (!hid[c]) h += '<col style="width:' + Math.max(18, Math.round(((d.widths || [])[c] || 60) * 0.9)) + 'px">';
    h += '</colgroup><tbody>';
    for (let r = 0; r < R; r++) {
      h += '<tr>';
      for (let c = 0; c < C; c++) {
        if (hid[c] || cover[r + ',' + c]) continue;
        const sp = span[r + ',' + c], bg = d.bg ? d.bg[r][c] : '', fw = d.fw ? d.fw[r][c] : '', al = d.al ? AL[String(d.al[r][c]).toLowerCase()] : '';
        let st = '';
        if (bg && bg !== '#ffffff') st += 'background:' + bg + ';';
        if (fw === 'bold') st += 'font-weight:700;';
        if (al) st += 'text-align:' + al + ';';
        h += '<td' + (sp && sp[0] > 1 ? ' rowspan="' + sp[0] + '"' : '') + (sp && sp[1] > 1 ? ' colspan="' + sp[1] + '"' : '') + (st ? ' style="' + st + '"' : '') + '>' + esc(d.rows[r][c]) + '</td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table>';
  }

  // ── 출퇴근카드: 예전 지문 기계의 직원별 카드와 같은 양식 (한 사람 한 장, 인쇄용) ──
  // 근무 형태는 그날 첫 출근 시각으로 정함: 오후 2시 전이면 주간(09:00-18:00), 그 뒤면 야간(17:00-다음날 09:00)
  let cardNo = store.get('cardNo') || '';
  function cardDay(items, wd) {
    const ins = items.filter((r) => r.type === '출근'), outs = items.filter((r) => r.type === '퇴근');
    const i = ins[0], o = outs[outs.length - 1];
    const night = i ? Number(i.time.slice(0, 2)) >= 14 : (o ? o.day !== wd : false);
    const start = kst(wd, night ? '17:00' : '09:00', false), end = kst(wd, night ? '09:00' : '18:00', night);
    let late = 0, early = 0;
    if (i && i.at - start >= 60000) late = Math.floor((i.at - start) / 60000);
    if (o) {
      let oat = o.at;
      const oh = Number(o.time.slice(0, 2));
      if (!night && o.day === wd && (oh === 16 || oh === 17)) oat += (18 - oh) * 3600000;   // 근태기록표와 같은 규칙: 16·17시대 퇴근은 18시대로 인정
      if (end - oat >= 60000) early = Math.floor((end - oat) / 60000);
    }
    return { i: i, o: o, late: late, early: early };
  }
  function cardHtml(s) {
    const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate(), mm = String(m).padStart(2, '0');
    const by = byNoWd()[s.no] || {}, range = y + '/' + mm + '/01 ~ ' + mm + '/' + String(last).padStart(2, '0');
    let rows = '', work = 0, lateN = 0, lateM = 0, earlyN = 0, earlyM = 0;
    for (let d = 1; d <= last; d++) {
      const wd = ym + '-' + String(d).padStart(2, '0'), w = new Date(y, m - 1, d).getDay(), items = by[wd] || [];
      const c = items.length ? cardDay(items, wd) : null;
      if (c) { work++; if (c.late) { lateN++; lateM += c.late; } if (c.early) { earlyN++; earlyM += c.early; } }
      const tm = (r, cls) => r ? '<span class="' + cls + '">' + esc(r.time) + (r.fix ? '*' : '') + '</span>' + (r.day !== wd ? '<span class="nd"> 다음날</span>' : '') : '';
      const rm = !c ? '' : !c.i ? '출근 기록 없음' : !c.o ? (wd === todayStr() ? '' : '퇴근 기록 없음') : '';
      rows += '<tr><td class="' + (w === 0 ? 'sun' : w === 6 ? 'sat' : '') + '">' + String(d).padStart(2, '0') + ' ' + WEEK[w] + '</td>' +
        '<td colspan="2">' + (c ? tm(c.i, 'ti') : '') + '</td><td colspan="2">' + (c ? tm(c.o, 'to') : '') + '</td>' +
        (rm ? '<td colspan="4" class="rm bad">' + rm + '</td>' : '<td></td><td></td><td></td><td></td>') + '</tr>';
    }
    return '<div class="kcard"><h1>출퇴근카드</h1>' +
      '<div class="kd">출근 일자<span>' + range + '</span></div>' +
      '<table class="kt"><colgroup><col style="width:13%"><col style="width:9.5%"><col style="width:9.5%"><col style="width:9.5%"><col style="width:9.5%"><col style="width:12.25%"><col style="width:12.25%"><col style="width:12.25%"><col style="width:12.25%"></colgroup><tbody>' +
      '<tr><td class="lb">부서</td><td colspan="4" class="big">' + esc(s.dept || '') + '</td><td class="lb">이름</td><td colspan="3" class="big">' + esc(s.name) + '</td></tr>' +
      '<tr><td class="lb">일자</td><td colspan="4" class="big">' + range + '</td><td class="lb">번호</td><td colspan="3" class="big">' + esc(s.no) + '</td></tr>' +
      '<tr><td class="lb" rowspan="2">결근(일)</td><td class="lb" rowspan="2">출근(일)</td><td class="lb" colspan="3">연장(시)</td><td class="lb" colspan="2">지각</td><td class="lb" colspan="2">조퇴</td></tr>' +
      '<tr><td class="lb" colspan="2">연장</td><td class="lb">야근</td><td class="lb">(회)</td><td class="lb">(분)</td><td class="lb">(회)</td><td class="lb">(분)</td></tr>' +
      '<tr><td></td><td>' + (work || '') + '</td><td colspan="2"></td><td></td><td>' + (lateN || '') + '</td><td>' + (lateM || '') + '</td><td>' + (earlyN || '') + '</td><td>' + (earlyM || '') + '</td></tr>' +
      '<tr><td colspan="9">1. 09:00-18:00, 17:00-09:00</td></tr>' +
      '<tr><td colspan="9" class="ttl">출퇴근기록표</td></tr>' +
      '<tr><td class="lb" rowspan="2">일자/주</td><td class="lb" colspan="4">출퇴근</td><td class="lb" colspan="2">연장</td><td class="lb" colspan="2">야근</td></tr>' +
      '<tr><td class="lb" colspan="2">출근</td><td class="lb" colspan="2">퇴근</td><td class="lb">시작</td><td class="lb">종료</td><td class="lb">시작</td><td class="lb">종료</td></tr>' +
      rows + '</tbody></table></div>';
  }
  function cardStaff() { return gridStaff(byNoWd()); }
  function renderCard() {
    const staff = cardStaff();
    if (!staff.some((s) => s.no === cardNo)) cardNo = staff.length ? staff[0].no : '';
    $('filters').innerHTML = '<select id="cardSel">' + staff.map((s) => opt(s.no, cardNo, s.name + (s.dept ? ' · ' + s.dept : ''))).join('') + '</select>' +
      '<button class="btn" data-act="cardAll">' + ic('print', 16) + '전체 인쇄</button>';
    const s = staff.filter((x) => x.no === cardNo)[0];
    $('view').innerHTML = s ? '<div class="pad"><div class="hint noprint">예전 지문 기계 카드와 같은 양식이에요. 지각·조퇴는 주간 09:00~18:00, 야간 17:00~다음날 09:00 기준으로 세고, 16·17시대 퇴근은 근태기록표처럼 18시대로 인정해요. * 는 관리자가 보정한 시각이에요.</div>' +
      '<div class="kcards">' + cardHtml(s) + '</div></div>' : '<div class="empty">직원이 없어요</div>';
  }

  function render() {
    setYm();
    if (view !== 'grid') $('drawer').classList.add('hidden');
    if (view === 'card') { if (D) renderCard(); return; }
    if (view === 'today') return renderToday();
    if (view === 'log') return renderLog();
    if (view === 'staff') return renderStaff();
    if (view === 'place') return renderPlace();
    if (view === 'sheet') return renderSheet();
    if (!D) return;
    if (view === 'grid') { renderGrid(); renderDrawer(); } else if (view === 'miss') renderMiss(); else renderList();
  }
  function loadFor(v) {
    if (v === 'today' || v === 'staff') loadToday();
    if (v === 'log') loadLog();
    if (v === 'place') loadPlaces();
    if (v === 'sheet') loadSheet();
  }

  // ── 엑셀(CSV)로 내려받기: 지금 보고 있는 표 그대로 ──
  function csv() {
    const rows = [];
    if (view === 'grid') {
      if (!D) return;
      const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate(), by = byNoWd();
      const head = ['직원', '부서']; for (let d = 1; d <= last; d++) head.push(d + '일'); rows.push(head);
      gridStaff(by).forEach((s) => {
        const line = [s.name, s.dept || ''];
        for (let d = 1; d <= last; d++) {
          const items = (by[s.no] || {})[ym + '-' + String(d).padStart(2, '0')] || [], c = cellInfo(items, '');
          line.push(items.length ? (c.ins.length ? c.ins[0].time : '') + '~' + (c.outs.length ? c.outs[c.outs.length - 1].time : '') : '');
        }
        rows.push(line);
      });
    } else if (view === 'list') {
      if (!D) return;
      rows.push(['근무일', '이름', '구분', '기록 날짜', '시각', '장소', '판정']);
      listRows().forEach((r) => rows.push([r.wd, r.name, r.type, r.day, r.time, r.place, r.how]));
    } else {                                         // 화면에 보이는 표를 그대로
      const tb = document.querySelector('#view table');
      if (!tb) { alert('내려받을 표가 없어요'); return; }
      tb.querySelectorAll('tr').forEach((tr) => rows.push(Array.from(tr.children).map((c) => {
        const i = c.querySelector('input:not([type=checkbox])'), k = c.querySelector('input[type=checkbox]'), s = c.querySelector('select');
        return i ? i.value : s ? s.value : k ? (k.checked ? 'O' : '') : c.querySelector('button') && !c.querySelector('.chip') ? '' : c.innerText.replace(/\s+/g, ' ').trim();
      })));
    }
    const text = '﻿' + rows.map((l) => l.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    a.download = 'KRF출퇴근_' + (MONTHLY[view] ? ym + '_' : '') + TITLE[view].replace(/\s/g, '') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ── 누르기·바꾸기 ──
  function moveMonth(n) { const [y, m] = ym.split('-').map(Number); ym = ymStr(new Date(y, m - 1 + n, 1)); if (ym > ymStr(new Date())) ym = ymStr(new Date()); closeDrawer(); load(); loadFor(view); }
  function go(v) { view = v; store.set('pcView', v); render(); loadFor(v); }
  document.addEventListener('click', async (ev) => {
    const nav = ev.target.closest('aside .nav');
    if (nav) { go(nav.dataset.view); return; }
    const sh = ev.target.closest('th[data-sort]');
    if (sh) { const k = sh.dataset.sort; sort = { k: k, dir: sort.k === k ? -sort.dir : 1 }; renderList(); return; }
    const b = ev.target.closest('[data-act]');
    if (b) {
      const act = b.dataset.act, tr = b.closest('tr');
      if (act === 'prev') return moveMonth(-1);
      if (act === 'next') return moveMonth(1);
      if (act === 'now') { ym = ymStr(new Date()); closeDrawer(); load(); loadFor(view); return; }
      if (act === 'reload') {
        if (busy || q.length) { alert('저장이 끝난 뒤에 눌러 주세요'); return; }
        delete cache[ym]; delete LC[ym]; delete SH[ym]; load();
        if (view === 'today' || view === 'staff') { T = null; render(); }
        if (view === 'place') { PL = null; render(); }
        loadFor(view);
        return;
      }
      if (act === 'csv') return csv();
      if (act === 'print') { window.print(); return; }
      if (act === 'cardAll') {             // 모든 직원 카드를 한 장씩 이어서 인쇄
        if (!D) return;
        const staff = cardStaff().filter((x) => x.status !== '퇴사' || Object.keys(byNoWd()[x.no] || {}).length);
        $('view').innerHTML = '<div class="pad"><div class="kcards">' + staff.map(cardHtml).join('') + '</div></div>';
        setTimeout(() => { window.print(); renderCard(); }, 50);
        return;
      }
      if (act === 'closeDrawer') { closeDrawer(); return; }
      if (act === 'undo') { const t = $('toast'); if (t._undo) { const f = t._undo; t._undo = null; t.classList.add('hidden'); f(); } return; }
      if (act === 'del') { const rec = recById(b.closest('[data-id]').dataset.id); if (rec) delRec(rec); return; }
      if (act === 'add' && dk) { addRec(dk.no, dk.wd, { type: $('aType').value, time: $('aTime').value, nd: $('aNd').checked, place: $('aPlace').value }); return; }
      if (act === 'goMiss') { ym = ymStr(new Date()); go('miss'); load(); return; }
      if (act === 'missAdd') { addRec(tr.dataset.no, tr.dataset.wd, { type: tr.dataset.type, time: tr.querySelector('.mT').value, nd: tr.querySelector('.mN').checked, place: tr.querySelector('.mP').value }); return; }
      if (act === 'bulkClear') { sel.clear(); renderList(); return; }
      if (act === 'bulkPlace') {
        const p = $('bulkPlace').value, recs = Array.from(sel).map(recById).filter((r) => r && r.place !== p);
        if (!p) { alert('바꿀 장소를 골라 주세요'); return; }
        if (!recs.length) { alert('바꿀 기록이 없어요 (이미 그 장소예요)'); return; }
        if (!confirm(recs.length + '건의 장소를 "' + p + '"(으)로 바꿀까요?')) return;
        recs.forEach((r) => saveEdit(r, { type: r.type, time: r.time, nd: r.day !== r.wd, place: p }, true));
        sel.clear(); renderList(); toast(recs.length + '건의 장소를 ' + p + '(으)로 바꿨어요');
        return;
      }
      if (act === 'bulkDel') {
        const recs = Array.from(sel).map(recById).filter((r) => r);
        if (!recs.length || !confirm(recs.length + '건의 기록을 지울까요?\n(지운 기록은 수정 이력에서 하나씩 되살릴 수 있어요)')) return;
        recs.sort((x, y) => y.row - x.row).forEach(dropRec);   // 아래 줄부터 지워야 줄 번호가 안 밀림
        renderList(); toast(recs.length + '건을 지웠어요');
        return;
      }
      if (act === 'approve' || act === 'reject') {
        if (act === 'reject' && !confirm(b.dataset.name + '님의 등록 신청을 거절할까요?')) return;
        b.disabled = true;
        const r = await call('adminDo', { op: act, no: b.dataset.no });
        if (!r || !r.ok) alert((r && r.error) || '처리하지 못했어요. 인터넷 연결을 확인해 주세요');
        else toast(b.dataset.name + '님 등록 신청을 ' + (act === 'approve' ? '승인했어요' : '거절했어요'));
        loadToday();
        return;
      }
      if (act === 'restore') {
        if (!confirm(b.dataset.desc + ' 기록을 되살릴까요?')) return;
        b.disabled = true; needReload = true;
        enqueue({ op: 'restore', log: Number(b.dataset.log) }, b.dataset.desc + ' 되살리기');
        return;
      }
      if (act === 'staffAdd') {
        const name = $('sName').value.trim();
        if (!name) { alert('이름을 넣어 주세요'); return; }
        if (!confirm(name + '님을 ' + $('sDept').value + ' 직원으로 추가할까요?')) return;
        b.disabled = true;
        await staffDo(await call('adminStaffSave', { name: name, dept: $('sDept').value }), name + '님을 추가했어요');
        return;
      }
      if (act === 'staffReset') {
        if (!confirm(tr.dataset.name + '님의 휴대폰 등록을 초기화할까요?\n초기화하면 그 휴대폰에서 다시 이름을 고르고 승인을 받아야 해요.')) return;
        b.disabled = true;
        await staffDo(await call('adminDo', { op: 'reset', no: tr.dataset.no }), tr.dataset.name + '님의 휴대폰 등록을 초기화했어요');
        return;
      }
      if (act === 'placeAdd' || act === 'placeSave') {
        let p;
        if (act === 'placeAdd') p = { name: $('pName').value.trim(), addr: $('pAddr').value.trim(), radius: $('pRad').value, lat: '', lng: '' };
        else {
          const cur = PL.places.filter((x) => String(x.row) === tr.dataset.row)[0], addr = tr.querySelector('.pA').value.trim();
          let lat = tr.querySelector('.pLat').value.trim(), lng = tr.querySelector('.pLng').value.trim();
          if (addr !== cur.addr && lat === String(cur.lat) && lng === String(cur.lng)) { lat = ''; lng = ''; }   // 주소만 바꿨으면 위치는 주소로 다시 계산
          p = { row: cur.row, name: cur.name, addr: addr, radius: tr.querySelector('.pR').value, lat: lat, lng: lng };
        }
        if (!p.name) { alert('장소 이름을 넣어 주세요'); return; }
        b.disabled = true;
        const r = await call('adminPlaceSave', p);
        b.disabled = false;
        if (!r || !r.ok) { alert((r && r.error) || '저장하지 못했어요. 인터넷 연결을 확인해 주세요'); return; }
        toast(p.name + ' 장소를 ' + (act === 'placeAdd' ? '추가했어요' : '저장했어요'));
        dropMonths(); load(true); loadPlaces();
        return;
      }
      if (act === 'placeDel') {
        const cur = PL.places.filter((x) => String(x.row) === tr.dataset.row)[0];
        if (!cur || !confirm(cur.name + ' 장소를 지울까요?\n(그 장소로 찍힌 기록이 있으면 지워지지 않아요)')) return;
        b.disabled = true;
        const r = await call('adminPlaceDelete', { row: cur.row, name: cur.name });
        b.disabled = false;
        if (!r || !r.ok) { alert((r && r.error) || '지우지 못했어요. 인터넷 연결을 확인해 주세요'); return; }
        toast(cur.name + ' 장소를 지웠어요');
        dropMonths(); load(true); loadPlaces();
        return;
      }
      if (act === 'leave') {
        if (!confirm('이 PC의 연결을 끊을까요?\n다시 쓰려면 휴대폰에서 숫자를 넣어 다시 연결해야 해요.')) return;
        await call('superLeave');
        location.reload();
        return;
      }
      return;
    }
    const td = ev.target.closest('.grid td.c');
    if (td && D) { dk = { no: td.dataset.no, wd: td.dataset.wd }; document.querySelectorAll('.grid td.sel').forEach((e) => e.classList.remove('sel')); td.classList.add('sel'); renderDrawer(); }
  });
  document.addEventListener('change', async (ev) => {
    const t = ev.target;
    if (t.id === 'staffAll') { staffAll = t.checked; renderStaff(); return; }
    if (t.id === 'cardSel') { cardNo = t.value; store.set('cardNo', cardNo); renderCard(); return; }
    if (t.matches('[data-selall]')) { sel.clear(); if (t.checked) listRows().forEach((r) => sel.add(r.id)); renderList(); return; }
    if (t.matches('[data-sel]')) { const id = t.closest('[data-id]').dataset.id; if (t.checked) sel.add(id); else sel.delete(id); bulkBar(); return; }
    const f = t.closest('[data-fil]');
    if (f) { fil[f.dataset.fil] = f.type === 'checkbox' ? f.checked : f.value; renderList(); return; }
    const sf = t.closest('[data-sf]');
    if (sf) {
      const tr = sf.closest('tr'), no = tr.dataset.no, k = sf.dataset.sf, nm = tr.dataset.name;
      if (k === 'name' || k === 'dept') {
        const name = tr.querySelector('[data-sf="name"]').value.trim();
        if (!name) { alert('이름을 넣어 주세요'); renderStaff(); return; }
        await staffDo(await call('adminStaffSave', { no: no, name: name, dept: tr.querySelector('[data-sf="dept"]').value }), nm + '님 정보를 고쳤어요');
      } else if (k === 'status') {
        if (sf.value === '퇴사' && !confirm(nm + '님을 퇴사로 바꿀까요?\n퇴사한 직원은 출퇴근을 찍을 수 없어요.')) { renderStaff(); return; }
        await staffDo(await call('adminDo', { op: 'status', no: no, value: sf.value }), nm + '님을 ' + sf.value + '(으)로 바꿨어요');
      } else await staffDo(await call('adminDo', { op: k, no: no, value: sf.checked ? '1' : '0' }), nm + '님의 ' + (k === 'admin' ? '관리자 권한' : '같이 찍기') + '을 ' + (sf.checked ? '켰어요' : '껐어요'));
      return;
    }
    const el = t.closest('[data-f]');
    if (!el) return;
    const tr = el.closest('[data-id]'), rec = tr && recById(tr.dataset.id);
    if (!rec) return;
    const ok = saveEdit(rec, readRow(tr));
    if (view === 'grid') { renderGrid(); if (!ok) renderDrawer(); }   // 표는 다시 그리고, 고치던 줄은 그대로 둠(틀렸을 때만 되돌림)
    else if (!ok) renderList();
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && dk) closeDrawer(); });

  stat();
  boot();
})();
</script>
</body>
</html>
