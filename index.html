<script>
  // ▼ 기록 서버(Google Apps Script 웹 앱) 주소
  // 넓은 화면(PC)에서는 관리 화면으로 보냄. PC에서 휴대폰 화면을 보려면 주소 끝에 ?m=1
  const IS_PC = !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (IS_PC && window.innerWidth >= 700 && !/[?&]m=1/.test(location.search)) location.replace('pc.html');
  const API_URL = 'https://script.google.com/macros/s/AKfycbz2JDvgmLBp1pYNwQiugaEPmIAR8C9f4fESfAICl5dmrbfS3RxNDce04pqRSEsf8q09/exec';

  const $ = (id) => document.getElementById(id);
  const ua = navigator.userAgent || '';
  const isKakao = /KAKAOTALK/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isSamsung = /SamsungBrowser/i.test(ua);
  // 안드로이드에서 이 페이지를 크롬으로 여는 주소 (삼성 인터넷 설치는 Play 프로텍트에 막힘)
  const chromeIntent = 'intent://' + location.host + location.pathname + location.search +
    '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
    encodeURIComponent(location.origin + location.pathname + '?nochrome=1') + ';end';
  // 크롬이 없어서 되돌아온 경우
  const noChrome = /[?&]nochrome=1/.test(location.search);
  const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

  // 1) 카톡 안에서 열렸으면 크롬(아이폰은 사파리)으로 넘기기
  if (isKakao) {
    const target = isAndroid
      ? chromeIntent
      : 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    $('kakao').classList.remove('hidden');
    $('kakaoBtn').addEventListener('click', () => { location.href = target; });
    location.href = target;
  }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  let name = store.get('name');
  let deviceId = store.get('deviceId');
  if (!deviceId) {
    deviceId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
    store.set('deviceId', deviceId);
  }

  async function serverApi(action, payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      // text/plain 이어야 브라우저 사전요청 없이 Apps Script로 전달됨
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, payload)),
      keepalive: action === 'punch'   // 출퇴근은 누른 뒤 바로 앱을 꺼도 끝까지 전송
    });
    return res.json();
  }
  // ── DB(파이어베이스) 먼저, 안 되면 예전 서버로 ──
  // 주소 끝에 ?db=0 을 붙이면 DB를 쓰지 않음 (문제 생길 때 확인용)
  const DB_ON = !!window.KRFDB && !/[?&]db=0\b/.test(location.search);
  const dbReady = DB_ON ? KRFDB.init(deviceId, serverApi) : Promise.resolve(false);
  const SERVER_ONLY_ROW = (a, p) => a === 'adminEdit' && /^\d+$/.test(String((p && (p.row || p.log)) || ''));   // 예전 화면에 남은 시트 줄 번호
  async function api(action, payload) {
    if (await dbReady && KRFDB.can(action) && !SERVER_ONLY_ROW(action, payload)) {
      try { const r = await KRFDB.call(action, payload); if (r) return r; }
      catch (e) { console.warn('[DB] ' + action + ' → 서버로', e); }
    }
    const r = await serverApi(action, payload);
    // 관리자 등록·해제, PC 연결이 끝나면 DB 쪽 기기 정보도 새로 받음
    if (r && r.ok && DB_ON && (action === 'superJoin' || action === 'superLeave' || (action === 'pcStart' && r.done))) {
      if (await dbReady) await KRFDB.rebind().catch(() => {});
    }
    return r;
  }
  // 화면 전환: 'main'(출퇴근) / 'pick'(처음 이름 고르기) / 'wait'(승인 대기)
  let view = '';
  function render(v) {
    view = v;
    ['main', 'pick', 'wait'].forEach((k) => $(k).classList.toggle('hidden', k !== v));
    if (v === 'main') $('nameLabel').textContent = name ? name + ' 님' : '';
  }

  // 직원 목록에서 내 이름 고르기 (사번으로 등록 요청 → 관리자 승인)
  async function showPick(pre) {
    render('pick');
    const box = $('pickList');
    let d;
    if (Array.isArray(pre)) d = { ok: true, staff: pre };          // 상태 확인 때 같이 받은 목록
    else { try { d = await api('staff', {}); } catch (e) { d = null; } }
    if (!d || !d.ok) { box.innerHTML = '<div class="guide">목록을 불러오지 못했어요.<br>다시 열어 주세요</div>'; return; }
    box.innerHTML = '';
    // 이미 다른 휴대폰에 등록된 이름은 빼고 보여 줌 (남의 이름을 고르는 실수 방지)
    const list = d.staff.filter((e) => !e.taken);
    if (!list.length) box.innerHTML = '<div class="guide">고를 수 있는 이름이 없어요.</div>';
    list.forEach((e) => {
      const b = document.createElement('button');
      b.className = 'pk';
      b.innerHTML = e.name + '<small>' + (e.dept || '') + (e.dup ? ' · ' + e.no + '번' : '') + '</small>';
      b.addEventListener('click', () => askPick(e));
      box.appendChild(b);
    });
    box.insertAdjacentHTML('beforeend', '<div class="guide" style="grid-column:1/-1;font-size:18px;margin-top:10px">내 이름이 안 보이면<br>관리자에게 \'휴대폰 등록 초기화\'를 부탁하세요</div>');
  }
  function askPick(e) {
    $('pickAskText').textContent = e.name + '님이\n맞으세요?';
    $('pickAskText').style.whiteSpace = 'pre-line';
    $('pickAsk').classList.remove('hidden');
    speak(e.name + '님이 맞으세요?');
    $('pickNo').onclick = () => $('pickAsk').classList.add('hidden');
    $('pickYes').onclick = async () => {
      $('pickAsk').classList.add('hidden');
      let r;
      try { r = await api('register', { deviceId: deviceId, no: e.no }); } catch (err) { r = null; }
      if (!r || !r.ok) { alertWait('등록하지 못했어요', '잠시 후 다시 해 주세요', true); return; }
      handleAuth(r);
    };
  }
  function alertWait(big, sub, other) {
    render('wait');
    $('waitBig').textContent = big;
    $('waitSub').textContent = sub;
    $('waitOther').classList.toggle('hidden', !other);
  }
  // 서버가 알려 준 등록 상태에 맞는 화면으로
  function handleAuth(s) {
    if (s.auth === 'none') { showPick(s.staff); return false; }
    if (s.auth === 'pending') {
      alertWait(s.name + '님\n등록 신청했어요', '관리자가 확인하면\n바로 쓸 수 있어요', true);
      return false;
    }
    if (s.auth === 'taken') {
      alertWait(s.name + '님은\n다른 휴대폰에 등록돼 있어요', '휴대폰을 바꾸셨으면\n관리자에게 말씀해 주세요', true);
      return false;
    }
    if (s.auth === 'retired') {
      alertWait('사용할 수 없어요', '관리자에게 문의해 주세요', false);
      return false;
    }
    if (s.name && s.name !== name) { name = s.name; store.set('name', name); }
    if (typeof s.admin === 'boolean') $('adminBtn').classList.toggle('hidden', !s.admin);
    // 관리자: 등록 신청이 있으면 화면 맨 위에 빨간 알림 + 관리자 버튼에 숫자
    const pc = s.admin ? Number(s.pend) || 0 : 0;
    $('adminBtn').textContent = '⚙ 관리자' + (pc ? ' (신청 ' + pc + ')' : '');
    $('pendNote').textContent = '🔔 등록 신청 ' + pc + '명이 기다려요\n눌러서 승인하기';
    $('pendNote').style.whiteSpace = 'pre-line';
    $('pendNote').classList.toggle('hidden', !pc);
    if (s.admin && s.vapid) setupPush(s.vapid); else $('pushBtn').classList.add('hidden');
    if (s.admin && wantAdmin) { wantAdmin = false; setTimeout(() => { $('admin').classList.remove('hidden'); loadAdmin(); }, 0); }
    // 슈퍼관리자 휴대폰: 출퇴근 버튼 없이 관리자 화면만
    const sup = !!s.super;
    try { store.set('isSuper', sup ? '1' : ''); } catch (e) {}   // 다음에 켤 때 관리자 화면을 바로 띄우려고 기억
    if (sup) { $('status').classList.add('hidden'); $('punch').classList.add('hidden'); $('histBtn').classList.add('hidden'); }
    else { $('status').classList.remove('hidden'); $('punch').classList.remove('hidden'); $('histBtn').classList.remove('hidden'); }
    $('logoutBtn').classList.toggle('hidden', !sup);   // 슈퍼관리자 폰만 로그아웃 가능
    if (sup && !superOpened) { superOpened = true; setTimeout(() => { $('admin').classList.remove('hidden'); loadAdmin(); }, 0); }
    if (view !== 'main') { render('main'); warmPosition(); }
    else $('nameLabel').textContent = name ? name + ' 님' : '';
    return true;
  }

  // 관리자 푸시 알림: 알림 허용 → 이 폰 주소를 서버에 저장 (주소가 바뀌면 다시 보냄)
  let wantAdmin = /[?&]admin=1/.test(location.search), vapidKey = '';
  if (wantAdmin) history.replaceState(null, '', location.pathname);
  const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const b64bin = (s) => { const b = atob((s + '==='.slice((s.length + 3) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); };
  async function pushSubscribe() {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64bin(vapidKey) });
    if (store.get('pushEp') !== sub.endpoint) {
      const r = await api('pushSub', { deviceId: deviceId, endpoint: sub.endpoint });
      if (r && r.ok) store.set('pushEp', sub.endpoint); else throw new Error((r && r.error) || 'fail');
    }
  }
  function setupPush(key) {
    vapidKey = key;
    const btn = $('pushBtn');
    if (!pushOk || Notification.permission === 'denied') { btn.classList.add('hidden'); return; }
    if (Notification.permission === 'granted') { btn.classList.add('hidden'); pushSubscribe().catch(() => {}); return; }
    btn.classList.remove('hidden');
  }
  let myState = '', mates = [], picked = [], superOpened = false, superCached = false, places = [], lastMs = 0;
  // 서버와 같은 방식으로 폰에서 장소 판정 (못 맞히면 서버 답을 기다림)
  function localPlace(c) {
    if (!c || !places.length) return '';
    const R = 6371000, rad = Math.PI / 180;
    let best = '', bd = Infinity;
    places.forEach((p) => {
      const dLat = (p.lat - c.latitude) * rad, dLng = (p.lng - c.longitude) * rad;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(c.latitude * rad) * Math.cos(p.lat * rad) * Math.sin(dLng / 2) ** 2;
      const d = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      if (d <= p.r && d < bd) { best = p.n; bd = d; }
    });
    return best;
  }
  const hhmm = () => { const d = new Date(); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  // 다음에 누를 동작 (출근 또는 퇴근)
  const nextType = () => (myState === 'working' ? '퇴근' : '출근');

  // '같이 찍을 사람' 버튼: 고를 사람이 있을 때만 보이고, 고른 사람이 있으면 이름을 보여 줌
  function renderWith() {
    const nos = mates.map((m) => String(m.no));
    picked = picked.filter((n) => nos.indexOf(String(n)) >= 0);
    const b = $('withBtn');
    b.classList.toggle('hidden', !mates.length);
    if (picked.length) {
      const names = mates.filter((m) => picked.map(String).indexOf(String(m.no)) >= 0).map((m) => m.name);
      b.textContent = '✓ ' + names.join(', ') + '\n같이 ' + nextType() + ' (바꾸기)';
      b.classList.add('on');
    } else {
      b.textContent = '같이 ' + nextType() + '할 사람 고르기';
      b.classList.remove('on');
    }
  }

  // 현재 상태를 화면 위쪽과 버튼 글자에 표시
  function applyStatus(s) {
    if (s && s.state) { try { store.set('lastStatus', JSON.stringify({ state: s.state, type: s.type, time: s.time, place: s.place })); } catch (e) {} }
    const prev = myState;
    myState = s.state || '';
    if (prev && prev !== myState) picked = [];          // 출근↔퇴근이 바뀌면 고른 사람 초기화
    if (Array.isArray(s.mates)) mates = s.mates;
    if (Array.isArray(s.places)) { places = s.places; try { store.set('places', JSON.stringify(places)); } catch (e) {} }
    if (s.lastMs) lastMs = s.lastMs;
    const st = $('status');
    const btn = $('punch');
    const where = s.place ? ' · ' + s.place : '';
    if (s.state === 'working') {
      st.textContent = '지금 출근 중입니다\n(' + s.time + ' 출근' + where + ')';
      st.className = 'working';
      btn.innerHTML = '퇴근<br>누르기';
      btn.classList.add('off');
    } else if (s.state === 'off' && s.type === '퇴근') {
      st.textContent = '퇴근했습니다\n(' + s.time + ' 퇴근' + where + ')';
      st.className = 'off';
      btn.innerHTML = '출근<br>누르기';
      btn.classList.remove('off');
    } else {
      st.textContent = s.state === 'off' ? '출근 전입니다' : '아직 기록이 없어요';
      st.className = '';
      btn.innerHTML = '출근<br>누르기';
      btn.classList.remove('off');
    }
    renderWith();
  }

  async function loadStatus() {
    try {
      const s = await api('status', { deviceId: deviceId });
      // 기억해 둔 것과 달리 슈퍼관리자가 아니면(로그아웃 등) 미리 띄운 관리자 화면을 닫음
      if (s && s.ok && !s.super && superCached) { superCached = false; superOpened = false; try { store.set('isSuper', ''); } catch (e) {} $('admin').classList.add('hidden'); }
      if (s && s.ok && handleAuth(s) && !s.super) {
        // 아직 서버로 못 보낸 출퇴근이 있으면, 화면의 상태(휴대폰에 저장된 것)는 그대로 두고 먼저 보냄
        if (outbox().length) { if (Array.isArray(s.places)) places = s.places; flushOutbox(); }
        else applyStatus(s);
      }
    } catch (e) {
      $('status').textContent = '';
    }
  }

  function show(text, cls) {
    const m = $('msg');
    m.textContent = text;
    m.className = cls || '';
  }

  function speak(text) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  // 위치를 못 받아도 기록 자체는 남기도록 null을 반환
  let lastPos = null, lastPosAt = 0;
  // 위치 잡기: 먼저 정밀(GPS) 7초 → 실내라 안 잡히면 와이파이·기지국 위치로 5초 더
  // 못 잡으면 이유를 남겨 둠 (권한 꺼짐 / 시간 초과 / 위치 사용 불가)
  let lastPosErr = '';
  const POS_ERR = { 1: '권한 꺼짐', 2: '위치 사용 불가', 3: '시간 초과' };
  function getPos1(high, ms) {
    return new Promise((resolve) => {
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ c: p.coords }),
        (e) => resolve({ err: POS_ERR[e && e.code] || '알 수 없음', code: e && e.code }),
        { enableHighAccuracy: high, timeout: ms, maximumAge: 30000 }
      );
    });
  }
  async function getPosition() {
    if (!navigator.geolocation) { lastPosErr = '위치 기능 없음'; return null; }
    let r = await getPos1(true, 7000);
    if (!r.c && r.code !== 1) r = await getPos1(false, 5000);   // 권한 꺼짐이면 다시 해도 소용없음
    if (r.c) { lastPos = r.c; lastPosAt = Date.now(); lastPosErr = ''; return r.c; }
    lastPosErr = r.err;
    return null;
  }
  // 화면을 열자마자 미리 위치를 잡아 두기 (버튼 누를 때 기다리지 않도록)
  function warmPosition() {
    if (!name || !navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (p) => { lastPos = p.coords; lastPosAt = Date.now(); },
      () => {},
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  }

  // 등록 장소 밖일 때: 큰 버튼으로 장소 고르기 (취소하면 '')
  function choosePlace(type, choices) {
    return new Promise((resolve) => {
      const pk = $('picker');
      const box = $('pbtns');
      const title = (type || '') + ' 장소를 골라 주세요';
      $('ptitle').textContent = title;
      box.innerHTML = '';
      choices.forEach((n) => {
        const b = document.createElement('button');
        b.className = 'pbtn' + (n === '외부' ? ' pout' : '');
        b.textContent = n;
        b.addEventListener('click', () => { pk.classList.add('hidden'); resolve(n); });
        box.appendChild(b);
      });
      $('pcancel').onclick = () => { pk.classList.add('hidden'); resolve(''); };
      pk.classList.remove('hidden');
      speak(title);
    });
  }

  // 같이 찍을 사람 미리 고르기 (여러 명). 출퇴근 버튼은 그대로 한 번 누르면 끝
  function openMates() {
    const box = $('mateList');
    const sel = new Set(picked);
    $('mateTitle').innerHTML = '같이 ' + nextType() + '할 사람을<br>눌러서 고르세요';
    box.innerHTML = '';
    mates.forEach((m) => {
      const n = m.no;
      const b = document.createElement('button');
      const paint = () => { b.className = 'mate' + (sel.has(n) ? ' on' : ''); b.textContent = (sel.has(n) ? '✓ ' : '') + m.name; };
      b.addEventListener('click', () => { sel.has(n) ? sel.delete(n) : sel.add(n); paint(); });
      paint();
      box.appendChild(b);
    });
    const close = (list) => { picked = list; $('mates').classList.add('hidden'); renderWith(); };
    $('mateDone').onclick = () => close(mates.filter((m) => sel.has(m.no)).map((m) => m.no));
    $('mateClear').onclick = () => close([]);
    $('mates').classList.remove('hidden');
  }

  // ── 출퇴근: 누르면 휴대폰에 먼저 저장하고 바로 '완료'. 서버에는 뒤에서 보내고, 확인을 못 받으면 다음에 다시 보냄 ──
  const outbox = () => { try { const a = JSON.parse(store.get('outbox') || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  const saveOutbox = (a) => { store.set('outbox', JSON.stringify(a)); };
  const dsp = (ms) => { const x = new Date(ms); return (x.getMonth() + 1) + '월 ' + x.getDate() + '일 ' + String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0'); };
  let flushing = false, flushTimer = null, lastCid = '', pendingShown = false;
  async function flushOutbox() {
    if (flushing) return;
    flushing = true;
    try {
      for (;;) {
        const box = outbox();
        if (!box.length) break;
        const it = box[0];
        if (Date.now() - it.at > 7 * 24 * 3600 * 1000) { saveOutbox(box.slice(1)); continue; }   // 일주일 넘게 못 보낸 것은 버림
        let d = null;
        try { d = await api('punch', Object.assign({ deviceId: deviceId, sent: Date.now() }, it)); } catch (e) { d = null; }
        if (!d) {                                           // 전파가 안 됨: 그대로 두고 조금 뒤 다시
          if (it.cid === lastCid) show(it.type + ' 완료!\n' + it.place + ' · ' + dsp(it.at) + '\n(전파가 약해 조금 뒤 저장돼요)', 'ok');
          break;
        }
        saveOutbox(outbox().filter((x) => x.cid !== it.cid));
        if (d.ok && d.auth && d.auth !== 'ok') { show(''); handleAuth(d); continue; }
        if (!d.ok || d.needPlace) {                         // 서버가 받아 주지 않음: 바로 알림
          show('기록되지 않았어요\n다시 눌러 주세요', 'warn');
          speak('기록되지 않았습니다. 다시 눌러 주세요');
          vibrate([300, 120, 300]);
          lastMs = 0;
          continue;
        }
        if (it.cid === lastCid && !d.duplicate && (d.type !== it.type || d.place !== it.place || (d.also && d.also.length))) {
          // 서버가 정한 내용이 화면에 보여 준 것과 다르면 서버 것으로 고쳐 보여 줌
          let text = d.type + ' 완료!\n' + (d.place ? d.place + ' · ' : '') + d.time;
          if (d.also && d.also.length) { text += '\n' + d.also.join(', ') + '님도 ' + d.type; speak(d.also.join(', ') + '님도 함께 ' + d.type + ' 처리되었습니다'); }
          show(text, 'ok');
          applyStatus({ state: d.type === '출근' ? 'working' : 'off', type: d.type, time: d.time, place: d.place, mates: [] });
        }
      }
    } finally {
      flushing = false;
      clearTimeout(flushTimer);
      if (outbox().length) flushTimer = setTimeout(flushOutbox, 20000);
      else if (pendingShown) { pendingShown = false; setTimeout(loadStatus, 800); }   // 다 보냈으면 서버 상태로 새로 고침
    }
  }

  async function punch() {
    const btn = $('punch');
    btn.disabled = true;
    try {
      const type = myState === 'working' ? '퇴근' : '출근';
      if ((Date.now() - lastMs) < 60 * 1000) { show('방금 처리되었어요', 'ok'); return; }   // 연달아 누름
      if (!places.length) { await punchOnline(); return; }      // 장소 목록을 아직 못 받았으면 예전 방식
      const alsoNos = picked.slice();
      show('위치 확인 중…');
      const fresh = lastPos && (Date.now() - lastPosAt) < 5 * 60 * 1000;   // 화면 열 때 미리 잡아 둔 위치를 5분까지 그대로 씀
      // 위치는 길어도 2.5초만 기다림 (못 잡으면 장소를 직접 고름)
      const c = fresh ? lastPos : await Promise.race([getPosition(), new Promise((r) => setTimeout(() => r(null), 2500))]);
      let place = localPlace(c);
      if (!place) {
        show('');
        const ch = places.map((p) => p.n);
        if (ch.indexOf('외부') < 0) ch.push('외부');
        place = await choosePlace(type, ch);
        if (!place) { show('취소했어요\n다시 누르시면 됩니다', ''); return; }
      }
      const at = Date.now();
      const item = { cid: at.toString(36) + Math.random().toString(36).slice(2, 8), at: at, type: type, place: place,
                     lat: c ? c.latitude : '', lng: c ? c.longitude : '', acc: c ? Math.round(c.accuracy) : '',
                     posErr: c ? '' : (lastPosErr || '시간 초과'), alsoNos: alsoNos };
      saveOutbox(outbox().concat([item]));
      if (!outbox().some((x) => x.cid === item.cid)) { await punchOnline(); return; }   // 휴대폰에 저장이 안 되면 예전 방식(서버 답을 기다림)
      lastCid = item.cid; lastMs = at; picked = []; pendingShown = true;
      show(type + ' 완료!\n' + place + ' · ' + hhmm(), 'ok');
      speak(name + '님, ' + type + ' 처리되었습니다');
      vibrate(200);
      applyStatus({ state: type === '출근' ? 'working' : 'off', type: type, time: dsp(at), place: place, mates: [] });
      flushOutbox();
    } catch (e) {
      show('기록되지 않았어요\n다시 눌러 주세요', 'warn');
      speak('기록되지 않았습니다. 다시 눌러 주세요');
      vibrate([300, 120, 300]);
    } finally {
      setTimeout(() => { btn.disabled = false; }, 3000);
    }
  }

  // 예전 방식(서버 답을 기다림): 장소 목록을 아직 못 받았거나 휴대폰에 저장이 안 될 때만 씀
  async function punchOnline() {
    const btn = $('punch');
    btn.disabled = true;
    const alsoNos = picked.slice();
    show('위치 확인 중…');

    const fresh = lastPos && (Date.now() - lastPosAt) < 5 * 60 * 1000;   // 화면 열 때 미리 잡아 둔 위치를 5분까지 그대로 씀
    const c = fresh ? lastPos : await getPosition();
    // 장소가 폰에서 바로 판정되면 서버 답을 기다리지 않고 먼저 '완료'를 보여 줌
    const guessType = myState === 'working' ? '퇴근' : '출근';
    const guessPlace = (Date.now() - lastMs) > 60 * 1000 ? localPlace(c) : '';
    let early = false;
    if (guessPlace) {
      early = true;
      show(guessType + ' 완료!\n' + guessPlace + ' · ' + hhmm(), 'ok');
      speak(name + '님, ' + guessType + ' 처리되었습니다');
      vibrate(200);
    } else {
      show('기록 중…');
    }

    try {
      const payload = {
        deviceId: deviceId,
        lat: c ? c.latitude : '',
        lng: c ? c.longitude : '',
        acc: c ? Math.round(c.accuracy) : '',
        posErr: c ? '' : lastPosErr,
        alsoNos: alsoNos
      };
      // 등록 장소 밖이거나 위치를 못 잡았으면 서버에 묻지 않고 바로 장소 고르기 (서버를 한 번만 다녀오도록)
      if (!early && !localPlace(c) && places.length) {
        show('');
        const ch = places.map((p) => p.n);
        if (ch.indexOf('외부') < 0) ch.push('외부');
        const chosen0 = await choosePlace(guessType, ch);
        if (!chosen0) { show('취소했어요\n다시 누르시면 됩니다', ''); return; }
        show('기록 중…');
        payload.place = chosen0;
      }
      let d = await api('punch', payload);
      if (d.ok && d.needPlace) {
        early = false;
        show('');
        const chosen = await choosePlace(d.type, d.choices);
        if (!chosen) { show('취소했어요\n다시 누르시면 됩니다', ''); return; }
        show('기록 중…');
        payload.place = chosen;
        d = await api('punch', payload);
      }
      if (!d.ok) throw new Error(d.error || 'fail');
      if (d.auth && d.auth !== 'ok') { show(''); handleAuth(d); return; }

      let text;
      const same = early && !d.duplicate && d.type === guessType && d.place === guessPlace;
      if (d.duplicate) {
        text = '이미 ' + d.type + ' 처리되었어요\n(' + d.time + ')';
        speak('이미 ' + d.type + ' 처리되었습니다');
      } else {
        text = d.type + ' 완료!\n' + (d.place ? d.place + ' · ' : '') + d.time;
        let say = same ? '' : name + '님, ' + d.type + ' 처리되었습니다';
        if (d.also && d.also.length) {
          text += '\n' + d.also.join(', ') + '님도 ' + d.type;
          say += (say ? '. ' : '') + d.also.join(', ') + '님도 함께 ' + d.type + ' 처리되었습니다';
        }
        if (say) speak(say);
      }
      show(text, 'ok');
      picked = [];
      if (!d.duplicate) lastMs = Date.now();
      applyStatus({ state: d.type === '출근' ? 'working' : 'off', type: d.type, time: d.time, place: d.place, mates: [] });
      if (!same) vibrate(200);
      setTimeout(loadStatus, 1500);   // 함께 출근 중인 사람 목록 새로 받기
    } catch (e) {
      show('기록되지 않았어요\n다시 눌러 주세요', 'warn');
      speak('기록되지 않았습니다. 다시 눌러 주세요');
      vibrate([300, 120, 300]);
    } finally {
      setTimeout(() => { btn.disabled = false; }, 3000);
    }
  }

  // 2) 바탕화면 추가 안내 (이미 아이콘으로 열었으면 안 보임)
  let deferredPrompt = null;
  function showInstall(text, withButton) {
    if (isStandalone || isKakao || store.get('installDismissed')) return;
    $('installText').textContent = text;
    $('installBtn').classList.toggle('hidden', !withButton);
    $('install').classList.remove('hidden');
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    if (isSamsung) return;  // 삼성 인터넷 자체 설치는 쓰지 않음
    deferredPrompt = e;
    showInstall('바탕화면에 KRF출퇴근 아이콘을\n만들어 두면 편해요', true);
  });
  $('installBtn').addEventListener('click', async () => {
    if (isSamsung) { location.href = chromeIntent; return; }
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) {}
    deferredPrompt = null;
    $('install').classList.add('hidden');
  });
  window.addEventListener('appinstalled', () => { $('install').classList.add('hidden'); });
  $('installClose').addEventListener('click', () => {
    $('install').classList.add('hidden');
    store.set('installDismissed', '1');
  });
  // 설치 버튼을 쓸 수 없는 경우(아이폰, 일부 브라우저)에는 방법을 글로 안내
  setTimeout(() => {
    if (deferredPrompt) return;
    if (isSamsung && isAndroid && noChrome) {
      showInstall('아래 메뉴(≡) → [현재 페이지 추가]\n→ [홈 화면]을 누르면 아이콘이 생겨요', false);
      return;
    }
    if (isSamsung && isAndroid) {
      $('installBtn').textContent = '크롬으로 열기';
      showInstall('삼성 인터넷에서는 설치가 막혀요.\n크롬으로 열어서 추가해 주세요', true);
      return;
    }
    if (isIOS) showInstall('아래 [공유] 버튼 → [홈 화면에 추가]를\n누르면 아이콘이 생겨요', false);
    else showInstall('오른쪽 위 메뉴(⋮) → [홈 화면에 추가]를\n누르면 아이콘이 생겨요', false);
  }, 3000);

  $('waitRe').addEventListener('click', () => { $('waitBig').textContent = '확인 중…'; $('waitSub').textContent = ''; loadStatus(); });
  $('waitOther').addEventListener('click', showPick);
  $('superLink').addEventListener('click', () => $('superForm').classList.toggle('hidden'));
  $('superBtn').addEventListener('click', async () => {
    const code = $('superCode').value.trim(), nm = $('superName').value.trim();
    if (!nm || !code) { alert('이름과 관리자 코드를 넣어 주세요'); return; }
    $('superBtn').disabled = true;
    let r;
    try { r = await api('superJoin', { deviceId: deviceId, code: code, name: nm }); } catch (e) { r = null; }
    $('superBtn').disabled = false;
    if (!r || !r.ok) { alert((r && r.error) || '등록하지 못했어요'); return; }
    loadStatus();
  });
  // 승인 대기 중에는 20초마다 저절로 다시 확인
  setInterval(() => { if (view === 'wait' && document.visibilityState === 'visible') loadStatus(); }, 20000);

  $('punch').addEventListener('click', punch);
  $('withBtn').addEventListener('click', openMates);

  // 내 근무기록: 근무일 기준 달별로, 날짜마다 출근 → 퇴근 (근무시간)
  let histYM = null;
  const ymStr = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  function hm(ms) {
    const m = Math.round(ms / 60000), h = Math.floor(m / 60), r = m % 60;
    return (h ? h + '시간 ' : '') + (r ? r + '분' : (h ? '' : '0분'));
  }
  // 하루치 기록을 출근→퇴근 짝으로 묶기
  function pairsOf(day) {
    const out = []; let open = null;
    day.items.forEach((it) => {
      if (it.type === '출근') { if (open) out.push({ in: open }); open = it; }
      else if (open) { out.push({ in: open, out: it }); open = null; }
      else out.push({ out: it });
    });
    if (open) out.push({ in: open });
    return out;
  }
  const todayStr = () => { const t = new Date(); return ymStr(t) + '-' + String(t.getDate()).padStart(2, '0'); };
  // 관리자가 보정으로 넣은 시각에는 * 표시
  const tmS = (it) => it.time + (it.fix ? '*' : '');
  let histDays = {};
  // 시각 뒤에 출퇴근 장소를 작게 붙임
  function tmP(it) {
    const p = String(it.place || '').replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
    return tmS(it) + (p ? ' <span class="pl">' + p + '</span>' : '');
  }
  // 펼치거나 새로 연 칸이 화면 밖에 있으면 보이도록 '조금만' 움직임 (공통)
  // 위쪽이 가려지면(고정된 머리 줄 포함) 내리고, 아래가 넘치면 모자란 만큼만 올림 — 단, 그 칸의 맨 윗줄은 항상 보이게
  function reveal(box, el) {
    if (!box || !el || !box.contains(el)) return;
    const head = box.querySelector('.edHead'), br = box.getBoundingClientRect(), r = el.getBoundingClientRect();
    const top = br.top + (head && head !== el && !head.contains(el) ? head.getBoundingClientRect().height + 4 : 0) + 6;
    const up = r.top - top, over = Math.min(r.bottom + 8 - br.bottom, up);
    if (up < 0) box.scrollTop += up; else if (over > 0) box.scrollTop += over;
  }
  // 내용이 그려진 뒤에도 한 번 더 맞춤 (글꼴·높이가 늦게 정해지는 경우)
  function revealSoon(box, el) { reveal(box, el); requestAnimationFrame(() => reveal(box, el)); setTimeout(() => reveal(box, el), 350); }
  function showDay(date, byTap) {
    document.querySelectorAll('.cday.sel').forEach((e) => e.classList.remove('sel'));
    const cell = document.querySelector('.cday[data-d="' + date + '"]');
    if (cell) cell.classList.add('sel');
    const dt = new Date(date + 'T00:00:00');
    let html = '<div class="hdate">' + (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 (' + WEEK[dt.getDay()] + ')</div>';
    const day = histDays[date];
    // 전날 출근해서 이 날 퇴근한 근무
    let carried = 0;
    Object.keys(histDays).forEach((k) => {
      if (k === date) return;
      pairsOf(histDays[k]).forEach((p) => {
        if (!p.out || p.out.day !== date) return;
        carried++;
        if (p.in) html += '<div class="hrow"><span class="in">출근</span> 전날 ' + tmP(p.in) + ' → <span class="out">퇴근</span> ' + tmP(p.out) +
          ' <span class="dur">(' + hm(p.out.at - p.in.at) + ')</span></div>';
        else html += '<div class="hrow"><span class="out">퇴근</span> ' + tmP(p.out) + '</div>';
      });
    });
    if (!day) { if (!carried) html += '<div class="hrow" style="color:#888">기록 없음</div>'; }
    else pairsOf(day).forEach((p) => {
      const next = (it) => (it.day !== date ? '다음날 ' : '');
      if (p.in && p.out) html += '<div class="hrow"><span class="in">출근</span> ' + tmP(p.in) + ' → <span class="out">퇴근</span> ' + next(p.out) + tmP(p.out) +
        ' <span class="dur">(' + hm(p.out.at - p.in.at) + ')</span></div>';
      else if (p.in) html += '<div class="hrow"><span class="in">출근</span> ' + tmP(p.in) + (date === todayStr() ? ' → 근무 중' : ' → 퇴근 기록 없음') + '</div>';
      else html += '<div class="hrow"><span class="out">퇴근</span> ' + next(p.out) + tmP(p.out) + '</div>';
    });
    // 출근만 있거나 퇴근만 있으면 빠진 쪽을 바로 넣는 버튼 (관리자만). 전날 근무의 퇴근만 있는 경우는 그 근무일로 넣음
    const adds = [];
    if (histNo !== null) {
      Object.keys(histDays).forEach((k) => {
        if (k === date) return;
        pairsOf(histDays[k]).forEach((p) => { if (!p.in && p.out && p.out.day === date) adds.push(missPre(k, p.out, '출근')); });
      });
      if (day) pairsOf(day).forEach((p) => {
        if (p.in && !p.out) { if (date !== todayStr() && Date.now() - p.in.at > 16 * 3600 * 1000) adds.push(missPre(date, p.in, '퇴근')); }
        else if (!p.in && p.out) adds.push(missPre(date, p.out, '출근'));
      });
      adds.forEach((a, i) => {
        const wdt = new Date(a.wd + 'T00:00:00');
        html += '<button class="abtn go histAdd" data-i="' + i + '" style="margin-top:12px;width:100%">➕ 빠진 ' + a.type + ' 넣기' +
          (a.wd !== date ? ' (' + (wdt.getMonth() + 1) + '/' + wdt.getDate() + ' 근무)' : '') + '</button>';
      });
    }
    const emptyDay = !day && !carried;
    if (histNo !== null) html += '<button class="abtn" id="histFix" style="margin-top:12px;width:100%">' + (emptyDay ? '➕ 이 날 기록 넣기' : '✏️ 이 날 기록 고치기') + '</button>';
    $('histDetail').innerHTML = html;
    if ($('histFix')) $('histFix').addEventListener('click', () => histFixGo(date, emptyDay ? { wd: date, type: '출근', time: '09:00', nd: false } : null));
    document.querySelectorAll('.histAdd').forEach((b) => b.addEventListener('click', () => histFixGo(date, adds[Number(b.dataset.i)])));
    if (byTap) revealSoon($('histList'), $('histDetail'));   // 날짜를 눌렀으면 아래 내용이 보이게
  }
  // 한 번 본 달은 기억해 두었다가 바로 보여 주고, 옆 달은 미리 받아 둠
  const histCache = {};
  function histKey(mm) { return (histNo === null ? 'me' : histNo) + '|' + mm; }
  function histFetch(mm) {
    const k = histKey(mm), c = histCache[k] = histCache[k] || {};
    if (c.p) return c.p;
    c.p = api('history', Object.assign({ deviceId: deviceId, month: mm }, histNo !== null ? { no: histNo } : {}))
      .then((d) => { c.p = null; if (d && d.ok) { c.d = d; c.t = Date.now(); } return d; })
      .catch(() => { c.p = null; return null; });
    return c.p;
  }
  // 보고 있는 달의 다음 달과 앞의 다섯 달을 뒤에서 차례로 미리 받아 둠
  let histWarmRun = 0;
  async function histWarm() {
    const run = ++histWarmRun, no = histNo;
    const [y, m] = histYM.split('-').map(Number), nowYM = ymStr(new Date());
    const list = [ymStr(new Date(y, m, 1))];
    for (let k = 1; k <= 5; k++) list.push(ymStr(new Date(y, m - 1 - k, 1)));
    for (const mm of list) {
      if (run !== histWarmRun || no !== histNo || $('hist').classList.contains('hidden')) return;
      if (mm <= nowYM && !(histCache[histKey(mm)] || {}).d) await histFetch(mm);
    }
  }
  // 관리자가 직원 달력을 볼 때 그 달의 '기록 고치기' 내용도 미리 받아 둠 (고치러 갈 때 바로 뜨게)
  const recWarmAt = {};
  function recWarm(no, ym) {
    const key = 'recCache:' + no + ':' + ym;

        edCall({ op: 'add', no: edNo, wd: wd, type: type, time: t, nextDay: nd, place: pl });
        return;
      }
      if (k === 'editform') {
        const edt = new Date(rec.dataset.wd + 'T00:00:00');
        rec.querySelector('.edSlot').innerHTML = '<div class="eform"><div style="font-weight:800;margin-bottom:6px">✏️ ' + (edt.getMonth() + 1) + '/' + edt.getDate() + ' (' + WEEK[edt.getDay()] + ') ' +
          esc(eb.dataset.type) + ' ' + (eb.dataset.nd === '1' ? '다음날 ' : '') + esc(eb.dataset.time) + ' 고치기</div><div class="arow"><label>새 시각</label>' + timePick('class="edT"', eb.dataset.time) + ' ' +
          '<label><input type="checkbox" class="edN"' + (eb.dataset.nd === '1' ? ' checked' : '') + '> 다음날</label></div>' +
          '<div class="arow edTy"><label>구분</label>' + ['출근', '퇴근'].map((v) => '<button class="abtn' + (v === eb.dataset.type ? ' sel' : '') + '" data-ed="ty" data-t="' + v + '">' + v + '</button>').join('') + '</div>' +
          placeChips(eb.dataset.place) +
          '<div class="arow"><button class="abtn go" data-ed="editsave">저장</button></div></div>';
        // 고치는 칸까지 보이게 내려감: 기록 줄부터 보이게 하되, 화면보다 길면 [저장]까지 있는 고치는 칸을 우선
        const ef = rec.querySelector('.eform'), fitEd = () => { reveal($('adminBody'), rec); reveal($('adminBody'), ef); };
        fitEd(); requestAnimationFrame(fitEd); setTimeout(fitEd, 350);
        return;
      }
      if (k === 'editsave') {
        const t = rec.querySelector('.edT').value, nd = rec.querySelector('.edN').checked, pl = pickedPlace(rec);
        const tyb = rec.querySelector('.edTy .abtn.sel'), ty = tyb ? tyb.dataset.t : '';
        if (!t) return;
        if (!confirm(edName + '님 기록을 ' + (ty ? ty + ' ' : '') + (nd ? '다음날 ' : '') + t + (pl ? ' · ' + pl : '') + '(으)로 고칠까요?\n(원래 내용은 수정이력에 남아요)')) return;
        edCall({ op: 'edit', row: rec.dataset.row, expectAt: rec.dataset.at, time: t, nextDay: nd, place: pl, type: ty });
        return;
      }
      if (k === 'restore') {
        if (!confirm(edName + '님 ' + eb.dataset.desc + ' 기록을 되살릴까요?')) return;
        edCall({ op: 'restore', log: eb.dataset.log });
        return;
      }
      if (k === 'delete') {
        if (!confirm(edName + '님 ' + eb.dataset.desc + ' 기록을 지울까요?\n(지운 기록은 수정이력에 남아요)')) return;
        edCall({ op: 'delete', row: rec.dataset.row, expectAt: rec.dataset.at });
        return;
      }
      return;
    }
    const b = ev.target.closest('button[data-op]');
    if (!b) return;
    const op = b.dataset.op, no = b.dataset.no, nm = b.dataset.name || '', v = b.dataset.v || '';
    if (op === 'pcopen') { location.href = 'pc.html'; return; }
    if (op === 'pcpair') {   // PC 화면에 뜬 숫자를 넣어 그 PC를 관리 화면으로 연결
      const code = (prompt('PC 화면에 보이는 숫자 여섯 자리를 넣어 주세요') || '').replace(/\D/g, '');
      if (!code) return;
      let pr = null; try { pr = await api('pcApprove', { deviceId: deviceId, code: code }); } catch (e) { pr = null; }
      alert(pr && pr.ok ? 'PC가 연결됐어요. PC 화면이 곧 바뀝니다.' : ((pr && pr.error) || '연결하지 못했어요. 인터넷을 확인해 주세요'));
      return;
    }
    if (op === 'missing') { misYM = ''; openMissing(); return; }
    if (op === 'records') { edYM = ''; edBackCal = null; edBackMis = false; edAddPre = null; edFocus = ''; openRecords(no, nm); return; }
    if (op === 'cal') { openHist(no, nm); return; }
    if (op === 'status' && b.classList.contains('sel')) return;
    const ask = op === 'reject' ? nm + '님 등록 신청을 거절할까요?' : op === 'reset' ? nm + '님 휴대폰 등록을 지울까요?\n(새 휴대폰에서 다시 이름을 고르면 됩니다)' :
      op === 'status' && v !== '재직' ? nm + '님을 ' + v + '(으)로 바꿀까요?' :
      op === 'admin' ? nm + '님을 관리자' + (v === '1' ? '로 지정할까요?' : '에서 해제할까요?') :
      op === 'mate' ? nm + '님 앱에 "같이 찍을 사람 고르기" 버튼을 ' + (v === '1' ? '보이게 할까요?' : '숨길까요?') : '';
    if (ask && !confirm(ask)) return;
    b.disabled = true;
    let r;
    try { r = await api('adminDo', { deviceId: deviceId, op: op, no: no, value: v }); } catch (e) { r = null; }
    if (!r || !r.ok) { alert((r && r.error) || '처리하지 못했어요'); b.disabled = false; return; }
    loadAdmin();
  });
  $('adminBtn').addEventListener('click', () => { $('admin').classList.remove('hidden'); loadAdmin(); });
  // 아래 큰 버튼: 기록 고치기·빠진 기록 화면에서는 '한 단계 뒤로'(위쪽 ← 버튼과 같음), 직원 목록에서만 닫기
  function admBack() {
    if (admView === 'list') return false;
    const b = $('adminBody').querySelector(admView === 'mis' ? '[data-mis="back"]' : '[data-ed="back"]');
    if (!b) return false;
    b.click();
    return true;
  }
  $('adminClose').addEventListener('click', () => { if (admBack()) return; $('admin').classList.add('hidden'); loadStatus(); });
  // 버튼 글자를 지금 화면에 맞춤 + 휴대폰 '뒤로' 버튼을 누르면 앱이 꺼지지 않고 한 단계씩 돌아가게
  const isOpen = (id) => !$(id).classList.contains('hidden');
  function syncNav() {
    const setTxt = (id, t) => { if ($(id).textContent !== t) $(id).textContent = t; };   // 같으면 건드리지 않음 (무한 반복 방지)
    setTxt('adminClose', admView === 'rec' ? (edBackMis ? '← 빠진 기록으로' : edBackCal ? '← 달력으로' : '← 직원 목록으로')
      : admView === 'mis' ? '← 직원 목록으로' : '닫기');
    setTxt('histClose', histNo !== null && isOpen('admin') ? '← 관리자 화면으로' : '닫기');
    if ((isOpen('admin') || isOpen('hist')) && !(history.state && history.state.krfLayer)) {
      try { history.pushState({ krfLayer: 1 }, ''); } catch (e) {}
    }
  }
  new MutationObserver(() => syncNav()).observe($('admin'), { attributes: true, attributeFilter: ['class'], childList: true, subtree: true });
  new MutationObserver(() => syncNav()).observe($('hist'), { attributes: true, attributeFilter: ['class'] });
  window.addEventListener('popstate', () => {
    if (isOpen('hist')) $('histClose').click();
    else if (isOpen('admin')) $('adminClose').click();
    else return;
    setTimeout(syncNav, 0);   // 아직 열린 화면이 있으면 다음 '뒤로'도 앱 안에서 처리
  });
  // 슈퍼관리자 로그아웃: 서버에서 이 폰을 빼고, 폰에 저장된 이름·관리자 내용도 지움
  $('logoutBtn').addEventListener('click', async () => {
    if (!confirm('이 휴대폰에서 슈퍼관리자 로그아웃할까요?\n(다시 쓰려면 관리자 코드로 등록해야 해요)')) return;
    let r;
    try { r = await api('superLeave', { deviceId: deviceId }); } catch (e) { r = null; }
    if (!r || !r.ok) { alert((r && r.error) || '로그아웃하지 못했어요. 다시 눌러 주세요'); return; }
    try {
      if (pushOk) { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); }
    } catch (e) {}
    ['name', 'lastStatus', 'admCache', 'pushEp'].forEach((k) => store.del(k));
    try { Object.keys(localStorage).filter((k) => k.indexOf('recCache:') === 0).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
    location.reload();
  });
  $('pendNote').addEventListener('click', () => { $('admin').classList.remove('hidden'); loadAdmin(); });
  $('pushBtn').addEventListener('click', async () => {
    try {
      const p = await Notification.requestPermission();
      if (p !== 'granted') { show('알림이 꺼져 있어요\n휴대폰 설정에서 알림을 허용해 주세요', 'warn'); return; }
      await pushSubscribe();
      $('pushBtn').classList.add('hidden');
      show('이제 등록 신청이 들어오면\n이 휴대폰으로 알려 드려요', 'ok');
    } catch (e) { show('알림 설정을 하지 못했어요\n잠시 뒤 다시 눌러 주세요', 'warn'); }
  });
  if (pushOk) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data === 'openAdmin') { wantAdmin = true; loadStatus(); } });
  // 관리자 폰은 화면을 켜 두면 1분마다 새 신청 확인
  setInterval(() => {
    if (view === 'main' && document.visibilityState === 'visible' && !$('adminBtn').classList.contains('hidden') && $('admin').classList.contains('hidden')) loadStatus();
  }, 60000);

  if (!isKakao) {
    render('main');                       // 등록된 폰이면 바로 출퇴근 화면 (서버 확인 후 필요하면 이름 고르기로)
    // 지난번 상태를 먼저 보여 주고 (기다리지 않게) 서버 답이 오면 바로 바꿈
    try { const ls = JSON.parse(store.get('lastStatus') || 'null'); if (ls && name) applyStatus(ls); } catch (e) {}
    // 슈퍼관리자 폰: 서버 확인을 기다리지 않고 지난번 관리자 화면을 바로 띄움 (확인은 뒤에서)
    if (store.get('isSuper') === '1') {
      superCached = true; superOpened = true;
      $('status').classList.add('hidden'); $('punch').classList.add('hidden'); $('histBtn').classList.add('hidden');
      $('admin').classList.remove('hidden'); loadAdmin();
    }
    try { const p0 = JSON.parse(store.get('places') || '[]'); if (Array.isArray(p0) && p0.length) places = p0; } catch (e) {}
    loadStatus();
    flushOutbox();   // 지난번에 서버로 못 보낸 출퇴근이 있으면 지금 보냄
    warmPosition();
    // 다른 앱에 갔다가 돌아왔을 때도 다시 확인
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { loadStatus(); warmPosition(); }
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    // 새 화면이 올라왔다고 알려 오면, 아무것도 안 하고 있을 때 조용히 새로고침
    // 바쁠 때(버튼 누르는 중, 관리자·달력 화면을 보는 중)는 미뤄 두었다가 화면을 닫거나 앱으로 돌아올 때 새로고침
    const busy = () => $('punch').disabled || !$('admin').classList.contains('hidden') || !$('hist').classList.contains('hidden') ||
      !$('mates').classList.contains('hidden') || !$('pickAsk').classList.contains('hidden');
    let pendingReload = false;
    const tryReload = () => { if (pendingReload && !busy()) location.reload(); };
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data !== 'updated') return;
      pendingReload = true;
      tryReload();
    });
    ['adminClose', 'histClose'].forEach((id) => $(id).addEventListener('click', () => setTimeout(tryReload, 50)));
    // 앱을 켜 둔 채 다른 앱에 갔다 오면 새 화면이 있는지 다시 확인
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      tryReload();
      fetch('index.html').catch(() => {});
    });
  }
</script>
</body>
</html>
