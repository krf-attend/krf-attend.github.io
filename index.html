<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KRF출퇴근</title>
<meta name="theme-color" content="#1e6fd9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KRF출퇴근">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#fffaf0; --fg:#222; --btn:#1e6fd9; --ok:#1a8f3c; --warn:#c0392b; --muted:#888; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; padding:20px 20px 120px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--fg); text-align:center;
  }
  h1 { font-size:30px; margin:0 0 20px; }
  .name { font-size:30px; font-weight:700; margin-bottom:28px; }
  #punch {
    width:78vw; max-width:340px; aspect-ratio:1; border-radius:50%; border:none;
    background:var(--btn); color:#fff; font-size:46px; font-weight:800; line-height:1.3;
    box-shadow:0 10px 24px rgba(0,0,0,.25);
  }
  #punch:active { transform:scale(.96); }
  #punch.off { background:#e67e22; }
  #punch:disabled { background:#9aa5b1; }
  #status {
    font-size:26px; font-weight:700; line-height:1.4; white-space:pre-line;
    margin:-8px 0 24px; padding:14px 22px; border-radius:16px; min-height:40px;
    background:#eef2f6; color:#444;
  }
  #status.working { background:#e3f4e8; color:#1a8f3c; }
  #status.off { background:#fdf0e3; color:#b35a00; }
  #msg { font-size:32px; font-weight:800; margin-top:30px; min-height:100px; line-height:1.4; white-space:pre-line; }
  #msg.ok { color:var(--ok); }
  #msg.warn { color:var(--warn); }
  input {
    font-size:30px; padding:16px; width:85vw; max-width:360px;
    border:3px solid #999; border-radius:14px; text-align:center;
  }
  .save { margin-top:22px; font-size:30px; font-weight:700; padding:18px 48px; border:none; border-radius:14px; background:var(--btn); color:#fff; }
  .guide { font-size:20px; color:#555; margin-top:16px; line-height:1.5; }
  .small { position:fixed; bottom:12px; right:14px; font-size:14px; color:var(--muted); background:none; border:none; }
  .brand { font-size:18px; font-weight:800; color:#1e6fd9; letter-spacing:1px; margin-bottom:12px; }

  #picker, #kakao {
    position:fixed; inset:0; z-index:10; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;
  }
  .ptitle { font-size:30px; font-weight:800; margin-bottom:24px; line-height:1.4; }
  #pbtns { display:flex; flex-direction:column; gap:14px; width:85vw; max-width:360px; }
  .pbtn { font-size:34px; font-weight:800; padding:20px; border:none; border-radius:18px; background:var(--btn); color:#fff; }
  .pbtn.pout { background:#7f8c8d; }
  .pcancel { margin-top:24px; font-size:22px; padding:12px 30px; border:2px solid #999; border-radius:12px; background:#fff; color:#555; }

  /* 같이 찍을 사람 (출퇴근 버튼 누르기 전에 미리 고름, 안 고르면 나만) */
  #withBtn {
    margin-top:22px; font-size:22px; font-weight:700; padding:12px 22px;
    border:2px solid var(--btn); border-radius:14px; background:#fff; color:var(--btn);
  }
  #withBtn.on { background:#fff3e0; border-color:#e67e22; color:#b35a00; white-space:pre-line; line-height:1.4; }

  /* 내 근무기록 */
  #histBtn { margin-top:14px; font-size:22px; font-weight:700; padding:12px 22px; border:2px solid #7f8c8d; border-radius:14px; background:#fff; color:#555; }
  #hist { position:fixed; inset:0; z-index:10; background:var(--bg); display:flex; flex-direction:column; align-items:center; padding:16px 14px; }
  #histHead { display:flex; align-items:center; justify-content:space-between; width:100%; max-width:420px; }
  #histHead button { font-size:30px; font-weight:800; width:64px; height:56px; border:none; border-radius:14px; background:#eef2f6; color:#333; }
  #histHead button:disabled { opacity:.3; }
  #histMonth { font-size:28px; font-weight:800; }
  #histSum { font-size:20px; color:#555; margin:8px 0; }
  #histList { width:100%; max-width:420px; overflow-y:auto; flex:1; text-align:left; }
  .hday { background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .hdate { font-size:22px; font-weight:800; margin-bottom:4px; }
  .hrow { font-size:22px; line-height:1.6; }
  .hrow .in { color:var(--ok); font-weight:800; }
  .hrow .out { color:#b35a00; font-weight:800; }
  .hrow .dur { color:#555; font-size:18px; }
  .hempty { font-size:22px; color:#888; text-align:center; margin-top:40px; }
  .cal { display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; margin-bottom:10px; }
  .cw { text-align:center; font-size:16px; font-weight:800; color:#555; padding:2px 0; }
  .cw.sun, .cnum.sun { color:#c0392b; } .cw.sat, .cnum.sat { color:#1e6fd9; }
  .cday { background:#fff; border-radius:8px; min-height:64px; padding:3px 1px; text-align:center; border:2px solid transparent; }
  .cday.has { background:#f4faf5; }
  .cday.today { border-color:#9aa5b1; }
  .cday.sel { border-color:var(--btn); }
  .cnum { font-size:16px; font-weight:800; }
  .cin { font-size:13px; font-weight:700; color:var(--ok); letter-spacing:-.5px; }
  .cout { font-size:13px; font-weight:700; color:#b35a00; letter-spacing:-.5px; }
  .cmiss { font-size:12px; color:#c0392b; }
  #histClose { margin-top:10px; width:85vw; max-width:360px; font-size:26px; font-weight:800; padding:14px; border:none; border-radius:16px; background:var(--btn); color:#fff; }
  #mates {
    position:fixed; inset:0; z-index:10; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; padding:24px 20px;
  }
  .mtitle { font-size:26px; font-weight:800; margin:4px 0 16px; line-height:1.4; }
  #mateList { display:flex; flex-direction:column; gap:10px; width:85vw; max-width:360px; overflow-y:auto; max-height:58vh; }
  .mate { font-size:28px; font-weight:700; padding:14px; border:3px solid var(--btn); border-radius:16px; background:#fff; color:var(--btn); }
  .mate.on { background:var(--btn); color:#fff; }
  #mateDone { margin-top:16px; width:85vw; max-width:360px; font-size:28px; font-weight:800; padding:16px; border:none; border-radius:16px; background:var(--btn); color:#fff; }
  #mateClear { margin-top:12px; font-size:20px; padding:10px 24px; border:2px solid #999; border-radius:12px; background:#fff; color:#555; }

  /* 바탕화면 추가 안내 */
  #install {
    position:fixed; left:12px; right:12px; bottom:44px; z-index:5;
    background:#fff; border:3px solid var(--btn); border-radius:18px; padding:14px 16px;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
  }
  #install .itext { font-size:20px; font-weight:700; line-height:1.5; white-space:pre-line; }
  #installBtn { margin-top:10px; width:100%; font-size:26px; font-weight:800; padding:16px; border:none; border-radius:14px; background:var(--btn); color:#fff; }
  #installClose { margin-top:8px; font-size:16px; color:var(--muted); background:none; border:none; }

  /* 처음 등록: 직원 목록에서 내 이름 고르기, 승인 대기 */
  #pick h1 { font-size:28px; margin:0 0 14px; line-height:1.4; }
  #pickList { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:88vw; max-width:380px; margin:0 auto; }
  .pk { font-size:26px; font-weight:800; padding:14px 4px; border:3px solid var(--btn); border-radius:16px; background:#fff; color:var(--btn); line-height:1.2; }
  .pk small { display:block; font-size:15px; font-weight:600; color:#777; }
  #pickAsk { position:fixed; inset:0; z-index:12; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  #pickAsk .box { background:#fff; border-radius:20px; padding:26px 20px; width:86vw; max-width:360px; }
  #pickAskText { font-size:30px; font-weight:800; line-height:1.4; margin-bottom:20px; }
  #pickYes { width:100%; font-size:30px; font-weight:800; padding:16px; border:none; border-radius:16px; background:var(--btn); color:#fff; }
  #pickNo { margin-top:12px; font-size:22px; padding:10px 30px; border:2px solid #999; border-radius:12px; background:#fff; color:#555; }
  #wait .wbig { font-size:30px; font-weight:800; line-height:1.5; margin:10px 0 18px; white-space:pre-line; }
  #wait .wsub { font-size:21px; color:#555; line-height:1.5; white-space:pre-line; }
  #waitRe { margin-top:26px; font-size:26px; font-weight:800; padding:14px 34px; border:none; border-radius:14px; background:var(--btn); color:#fff; }
  #waitOther { margin-top:14px; font-size:18px; color:#777; background:none; border:none; text-decoration:underline; }

  /* 관리자 */
  #pendNote { display:block; margin:0 auto 12px; width:90vw; max-width:400px; font-size:22px; font-weight:800; padding:14px 10px; border:none; border-radius:14px; background:#c0392b; color:#fff; line-height:1.35; animation:pendBlink 1.6s ease-in-out infinite; }
  #pendNote.hidden { display:none; }
  @keyframes pendBlink { 50% { opacity:.75; } }
  #pushBtn { display:block; margin:12px auto 0; font-size:20px; font-weight:800; padding:12px 18px; border:2px solid #c0392b; border-radius:14px; background:#fff; color:#c0392b; }
  #pushBtn.hidden { display:none; }
  #adminBtn { margin-top:14px; margin-left:6px; font-size:22px; font-weight:700; padding:12px 18px; border:2px solid #8e44ad; border-radius:14px; background:#fff; color:#8e44ad; }
  #admin { position:fixed; inset:0; z-index:10; background:var(--bg); display:flex; flex-direction:column; align-items:center; padding:14px 12px; }
  #adminBody { width:100%; max-width:440px; overflow-y:auto; flex:1; text-align:left; }
  .asec { font-size:22px; font-weight:800; margin:14px 4px 8px; color:#8e44ad; }
  .acard { background:#fff; border-radius:14px; padding:12px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .aname { font-size:22px; font-weight:800; }
  .asub { font-size:16px; color:#777; margin-left:4px; font-weight:600; }
  .arow { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
  .abtn { font-size:18px; font-weight:800; padding:8px 14px; border-radius:10px; border:2px solid #9aa5b1; background:#fff; color:#444; }
  .abtn.go { background:var(--ok); border-color:var(--ok); color:#fff; }
  .abtn.no { border-color:var(--warn); color:var(--warn); }
  .abtn.sel { background:var(--btn); border-color:var(--btn); color:#fff; }
  .atag { font-size:15px; font-weight:700; padding:3px 8px; border-radius:8px; background:#eef2f6; color:#555; }
  .atag.wait { background:#fff3e0; color:#b35a00; }
  .aempty { font-size:18px; color:#888; margin:4px 6px; }
  .afil { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 4px 6px; }
  .afil b { font-size:16px; color:#777; width:36px; }
  .afil .abtn { font-size:16px; padding:5px 11px; }
  .eform { background:#f7f3fa; border-radius:12px; padding:10px; margin-top:8px; }
  .eform input { font-size:20px; padding:6px 8px; width:auto; border:2px solid #9aa5b1; border-radius:8px; }
  .eform label { font-size:17px; margin-right:6px; }
  .tp { display:inline-flex; align-items:center; gap:6px; }
  .tpc { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .eform .tpc input { width:70px; font-size:32px; font-weight:800; text-align:center; padding:4px; }
  .tpc button { touch-action:manipulation; user-select:none; -webkit-user-select:none; font-size:20px; font-weight:800; width:70px; padding:4px 0; border:2px solid #9aa5b1; border-radius:10px; background:#fff; color:#444; }
  .tp > b { font-size:32px; }
  .erec { font-size:20px; line-height:1.5; padding:8px 4px; border-bottom:1px solid #eee; }
  .erec small { color:#777; font-size:14px; display:block; }
  .abtn:disabled { opacity:.3; }
  #adminClose { margin-top:10px; width:85vw; max-width:360px; font-size:26px; font-weight:800; padding:14px; border:none; border-radius:16px; background:var(--btn); color:#fff; }

  .hidden { display:none !important; }
</style>
</head>
<body>
  <div class="brand">KRF출퇴근</div>

  <section id="pick" class="hidden">
    <h1>처음 한 번만<br>내 이름을 눌러 주세요</h1>
    <div id="pickList"><div class="guide">불러오는 중…</div></div>
    <button id="superLink" style="margin-top:28px;font-size:16px;color:#999;background:none;border:none;text-decoration:underline">관리자 등록</button>
    <div id="superForm" class="hidden" style="margin-top:12px">
      <input id="superName" placeholder="이름" style="font-size:22px;padding:10px;width:70vw;max-width:300px"><br>
      <input id="superCode" placeholder="관리자 코드" inputmode="numeric" style="font-size:22px;padding:10px;width:70vw;max-width:300px;margin-top:8px"><br>
      <button class="save" id="superBtn" style="font-size:24px;padding:12px 34px">등록</button>
    </div>
  </section>

  <div id="pickAsk" class="hidden">
    <div class="box">
      <div id="pickAskText"></div>
      <button id="pickYes">네, 맞아요</button><br>
      <button id="pickNo">아니요</button>
    </div>
  </div>

  <section id="wait" class="hidden">
    <div class="wbig" id="waitBig"></div>
    <div class="wsub" id="waitSub"></div>
    <button id="waitRe">다시 확인</button><br>
    <button id="waitOther" class="hidden">다른 이름 고르기</button>
  </section>

  <section id="main" class="hidden">
    <div class="name" id="nameLabel"></div>
    <button id="pendNote" class="hidden"></button>
    <div id="status">확인 중…</div>
    <button id="punch">출퇴근<br>누르기</button>
    <br>
    <button id="withBtn" class="hidden">같이 찍을 사람 고르기</button>
    <br>
    <button id="histBtn">📅 내 근무기록</button><button id="adminBtn" class="hidden">⚙ 관리자</button>
    <button id="pushBtn" class="hidden">🔔 등록 신청 알림 받기</button>
    <div id="msg"></div>
  </section>

  <section id="picker" class="hidden">
    <div class="ptitle" id="ptitle"></div>
    <div id="pbtns"></div>
    <button class="pcancel" id="pcancel">취소</button>
  </section>

  <section id="mates" class="hidden">
    <div class="mtitle" id="mateTitle"></div>
    <div id="mateList"></div>
    <button id="mateDone">다 골랐어요</button>
    <button id="mateClear">아무도 안 고름</button>
  </section>

  <section id="hist" class="hidden">
    <div id="histHead">
      <button id="histPrev">◀</button>
      <div id="histMonth"></div>
      <button id="histNext">▶</button>
    </div>
    <div id="histSum"></div>
    <div id="histList"></div>
    <button id="histClose">닫기</button>
  </section>

  <section id="admin" class="hidden">
    <div class="ptitle" style="margin-bottom:4px">⚙ 관리자</div>
    <div id="adminBody"></div>
    <button id="adminClose">닫기</button>
  </section>

  <section id="kakao" class="hidden">
    <div class="ptitle">크롬으로 여는 중입니다…</div>
    <p class="guide">화면이 바뀌지 않으면<br>아래 버튼을 눌러 주세요.</p>
    <button class="save" id="kakaoBtn">다른 브라우저로 열기</button>
  </section>

  <div id="install" class="hidden">
    <div class="itext" id="installText"></div>
    <button id="installBtn" class="hidden">바탕화면에 추가하기</button>
    <button id="installClose">나중에 하기</button>
  </div>


<script>
  // ▼ 기록 서버(Google Apps Script 웹 앱) 주소
  const API_URL = 'https://script.google.com/macros/s/AKfycbz2JDvgmLBp1pYNwQiugaEPmIAR8C9f4fESfAICl5dmrbfS3RxNDce04pqRSEsf8q09/exec';

  const $ = (id) => document.getElementById(id);
  const ua = navigator.userAgent || '';
  const isKakao = /KAKAOTALK/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isSamsung = /SamsungBrowser/i.test(ua);
  // 안드로이드에서 이 페이지를 크롬으로 여는 주소 (삼성 인터넷 설치는 Play 프로텍트에 막힘)
  const chromeIntent = 'intent://' + location.host + location.pathname + location.search +
    '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
    encodeURIComponent(location.origin + location.pathname + '?nochrome=1') + ';end';
  // 크롬이 없어서 되돌아온 경우
  const noChrome = /[?&]nochrome=1/.test(location.search);
  const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

  // 1) 카톡 안에서 열렸으면 크롬(아이폰은 사파리)으로 넘기기
  if (isKakao) {
    const target = isAndroid
      ? chromeIntent
      : 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    $('kakao').classList.remove('hidden');
    $('kakaoBtn').addEventListener('click', () => { location.href = target; });
    location.href = target;
  }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  let name = store.get('name');
  let deviceId = store.get('deviceId');
  if (!deviceId) {
    deviceId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
    store.set('deviceId', deviceId);
  }

  async function api(action, payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      // text/plain 이어야 브라우저 사전요청 없이 Apps Script로 전달됨
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, payload))
    });
    return res.json();
  }

  // 화면 전환: 'main'(출퇴근) / 'pick'(처음 이름 고르기) / 'wait'(승인 대기)
  let view = '';
  function render(v) {
    view = v;
    ['main', 'pick', 'wait'].forEach((k) => $(k).classList.toggle('hidden', k !== v));
    if (v === 'main') $('nameLabel').textContent = name ? name + ' 님' : '';
  }

  // 직원 목록에서 내 이름 고르기 (사번으로 등록 요청 → 관리자 승인)
  async function showPick() {
    render('pick');
    const box = $('pickList');
    let d;
    try { d = await api('staff', {}); } catch (e) { d = null; }
    if (!d || !d.ok) { box.innerHTML = '<div class="guide">목록을 불러오지 못했어요.<br>다시 열어 주세요</div>'; return; }
    box.innerHTML = '';
    d.staff.forEach((e) => {
      const b = document.createElement('button');
      b.className = 'pk';
      b.innerHTML = e.name + '<small>' + (e.dept || '') + (e.dup ? ' · ' + e.no + '번' : '') + '</small>';
      b.addEventListener('click', () => askPick(e));
      box.appendChild(b);
    });
  }
  function askPick(e) {
    $('pickAskText').textContent = e.name + '님이\n맞으세요?';
    $('pickAskText').style.whiteSpace = 'pre-line';
    $('pickAsk').classList.remove('hidden');
    speak(e.name + '님이 맞으세요?');
    $('pickNo').onclick = () => $('pickAsk').classList.add('hidden');
    $('pickYes').onclick = async () => {
      $('pickAsk').classList.add('hidden');
      let r;
      try { r = await api('register', { deviceId: deviceId, no: e.no }); } catch (err) { r = null; }
      if (!r || !r.ok) { alertWait('등록하지 못했어요', '잠시 후 다시 해 주세요', true); return; }
      handleAuth(r);
    };
  }
  function alertWait(big, sub, other) {
    render('wait');
    $('waitBig').textContent = big;
    $('waitSub').textContent = sub;
    $('waitOther').classList.toggle('hidden', !other);
  }
  // 서버가 알려 준 등록 상태에 맞는 화면으로
  function handleAuth(s) {
    if (s.auth === 'none') { showPick(); return false; }
    if (s.auth === 'pending') {
      alertWait(s.name + '님\n등록 신청했어요', '관리자가 확인하면\n바로 쓸 수 있어요', true);
      return false;
    }
    if (s.auth === 'taken') {
      alertWait(s.name + '님은\n다른 휴대폰에 등록돼 있어요', '휴대폰을 바꾸셨으면\n관리자에게 말씀해 주세요', true);
      return false;
    }
    if (s.auth === 'retired') {
      alertWait('사용할 수 없어요', '관리자에게 문의해 주세요', false);
      return false;
    }
    if (s.name && s.name !== name) { name = s.name; store.set('name', name); }
    if (typeof s.admin === 'boolean') $('adminBtn').classList.toggle('hidden', !s.admin);
    // 관리자: 등록 신청이 있으면 화면 맨 위에 빨간 알림 + 관리자 버튼에 숫자
    const pc = s.admin ? Number(s.pend) || 0 : 0;
    $('adminBtn').textContent = '⚙ 관리자' + (pc ? ' (신청 ' + pc + ')' : '');
    $('pendNote').textContent = '🔔 등록 신청 ' + pc + '명이 기다려요\n눌러서 승인하기';
    $('pendNote').style.whiteSpace = 'pre-line';
    $('pendNote').classList.toggle('hidden', !pc);
    if (s.admin && s.vapid) setupPush(s.vapid); else $('pushBtn').classList.add('hidden');
    if (s.admin && wantAdmin) { wantAdmin = false; setTimeout(() => { $('admin').classList.remove('hidden'); loadAdmin(); }, 0); }
    // 슈퍼관리자 휴대폰: 출퇴근 버튼 없이 관리자 화면만
    const sup = !!s.super;
    if (sup) { $('status').classList.add('hidden'); $('punch').classList.add('hidden'); $('histBtn').classList.add('hidden'); }
    else { $('status').classList.remove('hidden'); $('punch').classList.remove('hidden'); $('histBtn').classList.remove('hidden'); }
    if (sup && !superOpened) { superOpened = true; setTimeout(() => { $('admin').classList.remove('hidden'); loadAdmin(); }, 0); }
    if (view !== 'main') { render('main'); warmPosition(); }
    else $('nameLabel').textContent = name ? name + ' 님' : '';
    return true;
  }

  // 관리자 푸시 알림: 알림 허용 → 이 폰 주소를 서버에 저장 (주소가 바뀌면 다시 보냄)
  let wantAdmin = /[?&]admin=1/.test(location.search), vapidKey = '';
  if (wantAdmin) history.replaceState(null, '', location.pathname);
  const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const b64bin = (s) => { const b = atob((s + '==='.slice((s.length + 3) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); };
  async function pushSubscribe() {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64bin(vapidKey) });
    if (store.get('pushEp') !== sub.endpoint) {
      const r = await api('pushSub', { deviceId: deviceId, endpoint: sub.endpoint });
      if (r && r.ok) store.set('pushEp', sub.endpoint); else throw new Error((r && r.error) || 'fail');
    }
  }
  function setupPush(key) {
    vapidKey = key;
    const btn = $('pushBtn');
    if (!pushOk || Notification.permission === 'denied') { btn.classList.add('hidden'); return; }
    if (Notification.permission === 'granted') { btn.classList.add('hidden'); pushSubscribe().catch(() => {}); return; }
    btn.classList.remove('hidden');
  }
  let myState = '', mates = [], picked = [], superOpened = false, places = [], lastMs = 0;
  // 서버와 같은 방식으로 폰에서 장소 판정 (못 맞히면 서버 답을 기다림)
  function localPlace(c) {
    if (!c || !places.length) return '';
    const R = 6371000, rad = Math.PI / 180;
    let best = '', bd = Infinity;
    places.forEach((p) => {
      const dLat = (p.lat - c.latitude) * rad, dLng = (p.lng - c.longitude) * rad;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(c.latitude * rad) * Math.cos(p.lat * rad) * Math.sin(dLng / 2) ** 2;
      const d = 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      if (d <= p.r && d < bd) { best = p.n; bd = d; }
    });
    return best;
  }
  const hhmm = () => { const d = new Date(); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  // 다음에 누를 동작 (출근 또는 퇴근)
  const nextType = () => (myState === 'working' ? '퇴근' : '출근');

  // '같이 찍을 사람' 버튼: 고를 사람이 있을 때만 보이고, 고른 사람이 있으면 이름을 보여 줌
  function renderWith() {
    const nos = mates.map((m) => String(m.no));
    picked = picked.filter((n) => nos.indexOf(String(n)) >= 0);
    const b = $('withBtn');
    b.classList.toggle('hidden', !mates.length);
    if (picked.length) {
      const names = mates.filter((m) => picked.map(String).indexOf(String(m.no)) >= 0).map((m) => m.name);
      b.textContent = '✓ ' + names.join(', ') + '\n같이 ' + nextType() + ' (바꾸기)';
      b.classList.add('on');
    } else {
      b.textContent = '같이 ' + nextType() + '할 사람 고르기';
      b.classList.remove('on');
    }
  }

  // 현재 상태를 화면 위쪽과 버튼 글자에 표시
  function applyStatus(s) {
    if (s && s.state) { try { store.set('lastStatus', JSON.stringify({ state: s.state, type: s.type, time: s.time, place: s.place })); } catch (e) {} }
    const prev = myState;
    myState = s.state || '';
    if (prev && prev !== myState) picked = [];          // 출근↔퇴근이 바뀌면 고른 사람 초기화
    if (Array.isArray(s.mates)) mates = s.mates;
    if (Array.isArray(s.places)) places = s.places;
    if (s.lastMs) lastMs = s.lastMs;
    const st = $('status');
    const btn = $('punch');
    const where = s.place ? ' · ' + s.place : '';
    if (s.state === 'working') {
      st.textContent = '지금 출근 중입니다\n(' + s.time + ' 출근' + where + ')';
      st.className = 'working';
      btn.innerHTML = '퇴근<br>누르기';
      btn.classList.add('off');
    } else if (s.state === 'off' && s.type === '퇴근') {
      st.textContent = '퇴근했습니다\n(' + s.time + ' 퇴근' + where + ')';
      st.className = 'off';
      btn.innerHTML = '출근<br>누르기';
      btn.classList.remove('off');
    } else {
      st.textContent = s.state === 'off' ? '출근 전입니다' : '아직 기록이 없어요';
      st.className = '';
      btn.innerHTML = '출근<br>누르기';
      btn.classList.remove('off');
    }
    renderWith();
  }

  async function loadStatus() {
    try {
      const s = await api('status', { deviceId: deviceId });
      if (s && s.ok && handleAuth(s) && !s.super) applyStatus(s);
    } catch (e) {
      $('status').textContent = '';
    }
  }

  function show(text, cls) {
    const m = $('msg');
    m.textContent = text;
    m.className = cls || '';
  }

  function speak(text) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  // 위치를 못 받아도 기록 자체는 남기도록 null을 반환
  let lastPos = null, lastPosAt = 0;
  function getPosition() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (p) => { lastPos = p.coords; lastPosAt = Date.now(); resolve(p.coords); },
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 7000, maximumAge: 30000 }
      );
    });
  }
  // 화면을 열자마자 미리 위치를 잡아 두기 (버튼 누를 때 기다리지 않도록)
  function warmPosition() {
    if (!name || !navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (p) => { lastPos = p.coords; lastPosAt = Date.now(); },
      () => {},
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  }

  // 등록 장소 밖일 때: 큰 버튼으로 장소 고르기 (취소하면 '')
  function choosePlace(type, choices) {
    return new Promise((resolve) => {
      const pk = $('picker');
      const box = $('pbtns');
      const title = (type || '') + ' 장소를 골라 주세요';
      $('ptitle').textContent = title;
      box.innerHTML = '';
      choices.forEach((n) => {
        const b = document.createElement('button');
        b.className = 'pbtn' + (n === '외부' ? ' pout' : '');
        b.textContent = n;
        b.addEventListener('click', () => { pk.classList.add('hidden'); resolve(n); });
        box.appendChild(b);
      });
      $('pcancel').onclick = () => { pk.classList.add('hidden'); resolve(''); };
      pk.classList.remove('hidden');
      speak(title);
    });
  }

  // 같이 찍을 사람 미리 고르기 (여러 명). 출퇴근 버튼은 그대로 한 번 누르면 끝
  function openMates() {
    const box = $('mateList');
    const sel = new Set(picked);
    $('mateTitle').innerHTML = '같이 ' + nextType() + '할 사람을<br>눌러서 고르세요';
    box.innerHTML = '';
    mates.forEach((m) => {
      const n = m.no;
      const b = document.createElement('button');
      const paint = () => { b.className = 'mate' + (sel.has(n) ? ' on' : ''); b.textContent = (sel.has(n) ? '✓ ' : '') + m.name; };
      b.addEventListener('click', () => { sel.has(n) ? sel.delete(n) : sel.add(n); paint(); });
      paint();
      box.appendChild(b);
    });
    const close = (list) => { picked = list; $('mates').classList.add('hidden'); renderWith(); };
    $('mateDone').onclick = () => close(mates.filter((m) => sel.has(m.no)).map((m) => m.no));
    $('mateClear').onclick = () => close([]);
    $('mates').classList.remove('hidden');
  }

  async function punch() {
    const btn = $('punch');
    btn.disabled = true;
    const alsoNos = picked.slice();
    show('위치 확인 중…');

    const fresh = lastPos && (Date.now() - lastPosAt) < 5 * 60 * 1000;   // 화면 열 때 미리 잡아 둔 위치를 5분까지 그대로 씀
    const c = fresh ? lastPos : await getPosition();
    // 장소가 폰에서 바로 판정되면 서버 답을 기다리지 않고 먼저 '완료'를 보여 줌
    const guessType = myState === 'working' ? '퇴근' : '출근';
    const guessPlace = (Date.now() - lastMs) > 60 * 1000 ? localPlace(c) : '';
    let early = false;
    if (guessPlace) {
      early = true;
      show(guessType + ' 완료!\n' + guessPlace + ' · ' + hhmm(), 'ok');
      speak(name + '님, ' + guessType + ' 처리되었습니다');
      vibrate(200);
    } else {
      show('기록 중…');
    }

    try {
      const payload = {
        deviceId: deviceId,
        lat: c ? c.latitude : '',
        lng: c ? c.longitude : '',
        acc: c ? Math.round(c.accuracy) : '',
        alsoNos: alsoNos
      };
      let d = await api('punch', payload);
      if (d.ok && d.needPlace) {
        early = false;
        show('');
        const chosen = await choosePlace(d.type, d.choices);
        if (!chosen) { show('취소했어요\n다시 누르시면 됩니다', ''); return; }
        show('기록 중…');
        payload.place = chosen;
        d = await api('punch', payload);
      }
      if (!d.ok) throw new Error(d.error || 'fail');
      if (d.auth && d.auth !== 'ok') { show(''); handleAuth(d); return; }

      let text;
      const same = early && !d.duplicate && d.type === guessType && d.place === guessPlace;
      if (d.duplicate) {
        text = '이미 ' + d.type + ' 처리되었어요\n(' + d.time + ')';
        speak('이미 ' + d.type + ' 처리되었습니다');
      } else {
        text = d.type + ' 완료!\n' + (d.place ? d.place + ' · ' : '') + d.time;
        let say = same ? '' : name + '님, ' + d.type + ' 처리되었습니다';
        if (d.also && d.also.length) {
          text += '\n' + d.also.join(', ') + '님도 ' + d.type;
          say += (say ? '. ' : '') + d.also.join(', ') + '님도 함께 ' + d.type + ' 처리되었습니다';
        }
        if (say) speak(say);
      }
      show(text, 'ok');
      picked = [];
      if (!d.duplicate) lastMs = Date.now();
      applyStatus({ state: d.type === '출근' ? 'working' : 'off', type: d.type, time: d.time, place: d.place, mates: [] });
      if (!same) vibrate(200);
      setTimeout(loadStatus, 1500);   // 함께 출근 중인 사람 목록 새로 받기
    } catch (e) {
      show('기록되지 않았어요\n다시 눌러 주세요', 'warn');
      speak('기록되지 않았습니다. 다시 눌러 주세요');
      vibrate([300, 120, 300]);
    } finally {
      setTimeout(() => { btn.disabled = false; }, 3000);
    }
  }

  // 2) 바탕화면 추가 안내 (이미 아이콘으로 열었으면 안 보임)
  let deferredPrompt = null;
  function showInstall(text, withButton) {
    if (isStandalone || isKakao || store.get('installDismissed')) return;
    $('installText').textContent = text;
    $('installBtn').classList.toggle('hidden', !withButton);
    $('install').classList.remove('hidden');
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    if (isSamsung) return;  // 삼성 인터넷 자체 설치는 쓰지 않음
    deferredPrompt = e;
    showInstall('바탕화면에 KRF출퇴근 아이콘을\n만들어 두면 편해요', true);
  });
  $('installBtn').addEventListener('click', async () => {
    if (isSamsung) { location.href = chromeIntent; return; }
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) {}
    deferredPrompt = null;
    $('install').classList.add('hidden');
  });
  window.addEventListener('appinstalled', () => { $('install').classList.add('hidden'); });
  $('installClose').addEventListener('click', () => {
    $('install').classList.add('hidden');
    store.set('installDismissed', '1');
  });
  // 설치 버튼을 쓸 수 없는 경우(아이폰, 일부 브라우저)에는 방법을 글로 안내
  setTimeout(() => {
    if (deferredPrompt) return;
    if (isSamsung && isAndroid && noChrome) {
      showInstall('아래 메뉴(≡) → [현재 페이지 추가]\n→ [홈 화면]을 누르면 아이콘이 생겨요', false);
      return;
    }
    if (isSamsung && isAndroid) {
      $('installBtn').textContent = '크롬으로 열기';
      showInstall('삼성 인터넷에서는 설치가 막혀요.\n크롬으로 열어서 추가해 주세요', true);
      return;
    }
    if (isIOS) showInstall('아래 [공유] 버튼 → [홈 화면에 추가]를\n누르면 아이콘이 생겨요', false);
    else showInstall('오른쪽 위 메뉴(⋮) → [홈 화면에 추가]를\n누르면 아이콘이 생겨요', false);
  }, 3000);

  $('waitRe').addEventListener('click', () => { $('waitBig').textContent = '확인 중…'; $('waitSub').textContent = ''; loadStatus(); });
  $('waitOther').addEventListener('click', showPick);
  $('superLink').addEventListener('click', () => $('superForm').classList.toggle('hidden'));
  $('superBtn').addEventListener('click', async () => {
    const code = $('superCode').value.trim(), nm = $('superName').value.trim();
    if (!nm || !code) { alert('이름과 관리자 코드를 넣어 주세요'); return; }
    $('superBtn').disabled = true;
    let r;
    try { r = await api('superJoin', { deviceId: deviceId, code: code, name: nm }); } catch (e) { r = null; }
    $('superBtn').disabled = false;
    if (!r || !r.ok) { alert((r && r.error) || '등록하지 못했어요'); return; }
    loadStatus();
  });
  // 승인 대기 중에는 20초마다 저절로 다시 확인
  setInterval(() => { if (view === 'wait' && document.visibilityState === 'visible') loadStatus(); }, 20000);

  $('punch').addEventListener('click', punch);
  $('withBtn').addEventListener('click', openMates);

  // 내 근무기록: 근무일 기준 달별로, 날짜마다 출근 → 퇴근 (근무시간)
  let histYM = null;
  const ymStr = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  function hm(ms) {
    const m = Math.round(ms / 60000), h = Math.floor(m / 60), r = m % 60;
    return (h ? h + '시간 ' : '') + (r ? r + '분' : (h ? '' : '0분'));
  }
  // 하루치 기록을 출근→퇴근 짝으로 묶기
  function pairsOf(day) {
    const out = []; let open = null;
    day.items.forEach((it) => {
      if (it.type === '출근') { if (open) out.push({ in: open }); open = it; }
      else if (open) { out.push({ in: open, out: it }); open = null; }
      else out.push({ out: it });
    });
    if (open) out.push({ in: open });
    return out;
  }
  const todayStr = () => { const t = new Date(); return ymStr(t) + '-' + String(t.getDate()).padStart(2, '0'); };
  let histDays = {};
  function showDay(date) {
    document.querySelectorAll('.cday.sel').forEach((e) => e.classList.remove('sel'));
    const cell = document.querySelector('.cday[data-d="' + date + '"]');
    if (cell) cell.classList.add('sel');
    const dt = new Date(date + 'T00:00:00');
    let html = '<div class="hdate">' + (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 (' + WEEK[dt.getDay()] + ')</div>';
    const day = histDays[date];
    if (!day) html += '<div class="hrow" style="color:#888">기록 없음</div>';
    else pairsOf(day).forEach((p) => {
      const next = (it) => (it.day !== date ? '다음날 ' : '');
      if (p.in && p.out) html += '<div class="hrow"><span class="in">출근</span> ' + p.in.time + ' → <span class="out">퇴근</span> ' + next(p.out) + p.out.time +
        ' <span class="dur">(' + hm(p.out.at - p.in.at) + ')</span></div>';
      else if (p.in) html += '<div class="hrow"><span class="in">출근</span> ' + p.in.time + (date === todayStr() ? ' → 근무 중' : ' → 퇴근 기록 없음') + '</div>';
      else html += '<div class="hrow"><span class="out">퇴근</span> ' + next(p.out) + p.out.time + '</div>';
    });
    $('histDetail').innerHTML = html;
  }
  async function loadHist() {
    const [y, m] = histYM.split('-').map(Number);
    $('histMonth').textContent = y + '년 ' + m + '월';
    $('histNext').disabled = histYM >= ymStr(new Date());
    $('histSum').textContent = '불러오는 중…';
    $('histList').innerHTML = '';
    let d;
    try { d = await api('history', { deviceId: deviceId, month: histYM }); } catch (e) { d = null; }
    if (!d || !d.ok) { $('histSum').textContent = '불러오지 못했어요. 다시 열어 주세요'; return; }
    histDays = {};
    let total = 0;
    d.days.forEach((day) => {
      histDays[day.date] = day;
      pairsOf(day).forEach((p) => { if (p.in && p.out) total += p.out.at - p.in.at; });
    });
    // 달력: 일~토 7칸, 칸마다 첫 출근(초록)과 마지막 퇴근(주황)
    let html = '<div class="cal">' + WEEK.map((w, k) => '<div class="cw' + (k === 0 ? ' sun' : k === 6 ? ' sat' : '') + '">' + w + '</div>').join('');
    const first = new Date(y, m - 1, 1).getDay(), last = new Date(y, m, 0).getDate();
    for (let k = 0; k < first; k++) html += '<div></div>';
    for (let dd = 1; dd <= last; dd++) {
      const date = histYM + '-' + String(dd).padStart(2, '0');
      const day = histDays[date], wd = (first + dd - 1) % 7;
      let inner = '<div class="cnum' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + '">' + dd + '</div>';
      if (day) {
        const ins = day.items.filter((it) => it.type === '출근'), outs = day.items.filter((it) => it.type === '퇴근');

      html += '<div class="cday' + (day ? ' has' : '') + (date === todayStr() ? ' today' : '') + '" data-d="' + date + '">' + inner + '</div>';

    html += '</div><div class="hday" id="histDetail"></div>';
    $('histList').innerHTML = html;
    document.querySelectorAll('.cday').forEach((c) => c.addEventListener('click', () => showDay(c.dataset.d)));
    $('histSum').textContent = '출근 ' + d.days.length + '일 · 총 ' + hm(total);
    const pick = histDays[todayStr()] ? todayStr() : (d.days.length ? d.days[0].date : (histYM === ymStr(new Date()) ? todayStr() : histYM + '-01'));
    showDay(pick);
  }
  $('histBtn').addEventListener('click', () => {
    histYM = ymStr(new Date());
    $('hist').classList.remove('hidden');

  });
  $('histPrev').addEventListener('click', () => {
    const [y, m] = histYM.split('-').map(Number);

  });
  $('histNext').addEventListener('click', () => {

  $('histClose').addEventListener('click', () => { $('hist').classList.add('hidden'); });

  // 관리자: 등록 신청 승인/거절, 지금 출근 중, 직원 재직상태·기기 초기화
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function loadAdmin() {
    const body = $('adminBody');

        '<button class="abtn no" data-op="reject" data-no="' + esc(e.no) + '" data-name="' + esc(e.name) + '">거절</button></div></div>';

    else h += '<div class="acard">' + d.working.map((w) => '<div style="font-size:20px;line-height:1.7"><b>' + esc(w.name) + '</b> <span class="asub">' + esc(w.time) + ' 출근 · ' + esc(w.place) + '</span></div>').join('') + '</div>';
    aStaff = d.staff; aSuper = d.super;
    h += '<div id="aStaff"></div>';
    body.innerHTML = h;

  // 직원 목록 거르기 (상태·부서·기기) — 고른 조건은 이 폰에 기억
  let aStaff = [], aSuper = false, fil = { st: '재직', dp: '전체', dv: '전체' };
  try { fil = Object.assign(fil, JSON.parse(store.get('adminFil') || '{}')); } catch (e) {}
  function renderStaff() {
    const box = $('aStaff');

    const d = { super: aSuper };
    const devOf = (e) => e.registered ? (e.ok ? '등록됨' : '승인 대기') : '미등록';
    const cnt = (k, v) => aStaff.filter((e) => v === '전체' || (k === 'st' ? e.status === v : k === 'dp' ? e.dept === v : devOf(e) === v)).length;

    const list = aStaff.filter((e) => (fil.st === '전체' || e.status === fil.st) && (fil.dp === '전체' || e.dept === fil.dp) && (fil.dv === '전체' || devOf(e) === fil.dv));
    let h = '<div class="asec">직원 (' + list.length + (list.length !== aStaff.length ? ' / ' + aStaff.length : '') + ')</div>' +
      row('st', '상태', ['재직', '휴직', '퇴사', '전체']) + row('dp', '부서', ['전체', '순국', '기억', '주간']) + row('dv', '기기', ['전체', '등록됨', '승인 대기', '미등록']);
    if (!list.length) h += '<div class="aempty">조건에 맞는 직원이 없어요</div>';
    list.forEach((e) => {
      const tag = (e.registered ? (e.ok ? '<span class="atag">등록됨</span>' : '<span class="atag wait">승인 대기</span>') : '<span class="atag">미등록</span>') +
        (e.admin ? ' <span class="atag" style="background:#f4e6f9;color:#8e44ad">관리자</span>' : '');
      h += '<div class="acard"><span class="aname">' + esc(e.name) + '</span><span class="asub">' + esc(e.dept) + ' · ' + esc(e.no) + '번' + (e.me ? ' · 나' : '') + '</span> ' + tag +
        '<div class="arow">' + ['재직', '휴직', '퇴사'].map((v) => '<button class="abtn' + (e.status === v ? ' sel' : '') + '" data-op="status" data-v="' + v + '" data-no="' + esc(e.no) + '" data-name="' + esc(e.name) + '">' + v + '</button>').join('') +
        (e.registered && !e.me ? '<button class="abtn no" data-op="reset" data-no="' + esc(e.no) + '" data-name="' + esc(e.name) + '">기기 초기화</button>' : '') +
        '<button class="abtn" data-op="records" data-no="' + esc(e.no) + '" data-name="' + esc(e.name) + '">기록 수정</button>' +
        (d.super ? '<button class="abtn" data-op="admin" data-v="' + (e.admin ? '0' : '1') + '" data-no="' + esc(e.no) + '" data-name="' + esc(e.name) + '">' + (e.admin ? '관리자 해제' : '관리자 지정') + '</button>' : '') +
        '</div></div>';
    });
    box.innerHTML = h;
  }

  // 관리자 기록 수정: 한 직원의 달별 기록 → 시각 고치기 / 지우기 / 빠진 기록 넣기 (원래 기록은 수정이력 탭에 남음)
  let edNo = null, edName = '', edYM = '', edPlaces = [];
  // 장소 고르기 버튼 묶음 (cur가 있으면 미리 선택)
  const placeChips = (cur) => '<div class="arow edPl"><label>장소</label>' +
    edPlaces.map((p) => '<button class="abtn' + (p === cur ? ' sel' : '') + '" data-ed="pl" data-p="' + esc(p) + '">' + esc(p) + '</button>').join('') + '</div>';
  // 시각 고르기: 시·분을 ▲▼로 한 칸씩 바꾸거나, 숫자를 눌러 바로 입력 (값은 숨은 칸에 HH:MM으로)
  const p2 = (n) => String(n).padStart(2, '0');
  const timePick = (attr, v) => {
    const [h, m] = String(v || '09:00').split(':');
    const col = (k, val) => '<div class="tpc"><button data-ed="tp" data-p="' + k + '" data-d="1">▲</button>' +
      '<input class="tp' + k + '" inputmode="numeric" maxlength="2" value="' + p2(Number(val) || 0) + '" onfocus="this.select()">' +
      '<button data-ed="tp" data-p="' + k + '" data-d="-1">▼</button></div>';
    return '<span class="tp"><input type="hidden" ' + attr + ' value="' + p2(Number(h) || 0) + ':' + p2(Number(m) || 0) + '">' + col('H', h) + '<b>:</b>' + col('M', m) + '</span>';
  };
  function tpSync(tp) {
    const H = tp.querySelector('.tpH'), M = tp.querySelector('.tpM');
    const h = Math.min(23, Math.max(0, parseInt(H.value, 10) || 0)), m = Math.min(59, Math.max(0, parseInt(M.value, 10) || 0));
    tp.querySelector('input[type=hidden]').value = p2(h) + ':' + p2(m);
    return [h, m];
  }
  $('adminBody').addEventListener('input', (ev) => {
    const tp = ev.target.closest('.tp'); if (!tp) return;
    tpSync(tp);
    // 시를 두 자리 넣으면 분 칸으로 자동 이동
    if (ev.target.classList.contains('tpH') && ev.target.value.length >= 2) { const M = tp.querySelector('.tpM'); M.focus(); M.select(); }
  });
  // ▲▼: 한 번 누르면 1칸, 꾹 누르고 있으면 점점 빠르게 계속 바뀜
  function tpStep(b) {
    const tp = b.closest('.tp'), H = tp.querySelector('.tpH'), M = tp.querySelector('.tpM');
    let [h, m] = tpSync(tp);
    const d = Number(b.dataset.d);
    if (b.dataset.p === 'H') h = (h + d + 24) % 24; else m = (m + d + 60) % 60;
    H.value = p2(h); M.value = p2(m); tpSync(tp);
  }
  let tpTimer = null;
  const tpStop = () => { clearTimeout(tpTimer); tpTimer = null; };
  $('adminBody').addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('button[data-ed="tp"]'); if (!b) return;
    ev.preventDefault(); tpStop(); tpStep(b);
    let n = 0;
    const rep = () => { tpStep(b); n++; tpTimer = setTimeout(rep, n < 6 ? 150 : n < 20 ? 80 : 40); };
    tpTimer = setTimeout(rep, 450);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((e) => $('adminBody').addEventListener(e, tpStop));
  $('adminBody').addEventListener('contextmenu', (ev) => { if (ev.target.closest('.tp')) ev.preventDefault(); });
  $('adminBody').addEventListener('focusout', (ev) => {
    const tp = ev.target.closest('.tp'); if (!tp) return;
    const [h, m] = tpSync(tp); tp.querySelector('.tpH').value = p2(h); tp.querySelector('.tpM').value = p2(m);
  });
  const pickedPlace = (box) => { const b = box.querySelector('.edPl .abtn.sel'); return b ? b.dataset.p : ''; };
  async function openRecords(no, nm) {
    edNo = no; edName = nm; edYM = edYM || ymStr(new Date());
    const body = $('adminBody');
    const [y, m] = edYM.split('-').map(Number);
    body.innerHTML = '<div class="arow" style="justify-content:space-between"><button class="abtn" data-ed="back">← 목록</button>' +
      '<span class="aname">' + esc(nm) + '</span><span></span></div>' +
      '<div class="arow" style="justify-content:center"><button class="abtn" data-ed="prev">◀</button><span class="aname" style="margin:0 10px">' + y + '년 ' + m + '월</span>' +
      '<button class="abtn" data-ed="next"' + (edYM >= ymStr(new Date()) ? ' disabled' : '') + '>▶</button></div>' +
      '<div class="acard"><button class="abtn go" data-ed="addform">+ 빠진 기록 넣기</button><div id="edAdd"></div></div>' +
      '<div class="acard" id="edList"><div class="aempty">불러오는 중…</div></div>';
    let d;
    try { d = await api('adminRecords', { deviceId: deviceId, no: no, month: edYM }); } catch (e) { d = null; }
    const list = $('edList');
    if (!list) return;
    if (!d || !d.ok) { list.innerHTML = '<div class="aempty">불러오지 못했어요</div>'; return; }
    edPlaces = d.places || [];
    if (!d.records.length) { list.innerHTML = '<div class="aempty">이 달 기록이 없어요</div>'; return; }
    list.innerHTML = d.records.map((r) => {
      const dt = new Date(r.wd + 'T00:00:00');
      const nd = r.day !== r.wd;
      return '<div class="erec" data-row="' + r.row + '" data-at="' + r.at + '"><b>' + (dt.getMonth() + 1) + '/' + dt.getDate() + ' (' + WEEK[dt.getDay()] + ')</b> ' +
        '<span class="' + (r.type === '출근' ? 'in' : 'out') + '" style="font-weight:800;color:' + (r.type === '출근' ? 'var(--ok)' : '#b35a00') + '">' + esc(r.type) + '</span> ' +
        (nd ? '다음날 ' : '') + esc(r.time) + ' <span class="asub">' + esc(r.place) + '</span>' +

        '<button class="abtn no" data-ed="delete" data-desc="' + (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + esc(r.type) + ' ' + esc(r.time) + '">지우기</button></div><div class="edSlot"></div></div>';
    }).join('');
  }
  async function edCall(payload) {
    let r;
    try { r = await api('adminEdit', Object.assign({ deviceId: deviceId }, payload)); } catch (e) { r = null; }
    if (!r || !r.ok) { alert((r && r.error) || '처리하지 못했어요'); return false; }
    openRecords(edNo, edName);
    return true;
  }
  $('adminBody').addEventListener('click', async (ev) => {
    const fb = ev.target.closest('button[data-f]');
    if (fb) { fil[fb.dataset.f] = fb.dataset.v; try { store.set('adminFil', JSON.stringify(fil)); } catch (e) {} renderStaff(); return; }
    const eb = ev.target.closest('button[data-ed]');
    if (eb) {
      const k = eb.dataset.ed, rec = eb.closest('.erec');
      if (k === 'back') { edYM = ''; loadAdmin(); return; }
      if (k === 'prev' || k === 'next') {
        const [y, m] = edYM.split('-').map(Number);
        edYM = ymStr(new Date(y, m - 1 + (k === 'prev' ? -1 : 1), 1)); openRecords(edNo, edName); return;
      }
      if (k === 'addform') {
        const today = todayStr();
        $('edAdd').innerHTML = '<div class="eform"><div class="arow"><label>근무일</label><input type="date" id="edWd" value="' + today + '" max="' + today + '"></div>' +
          '<div class="arow"><button class="abtn sel" data-ed="tin">출근</button><button class="abtn" data-ed="tout">퇴근</button></div>' +
          '<div class="arow"><label>시각</label>' + timePick('id="edTime"', '09:00') + ' <label><input type="checkbox" id="edNd"> 다음날</label></div>' +
          placeChips('') +
          '<div class="arow"><button class="abtn go" data-ed="addsave">저장</button></div></div>';
        return;
      }
      if (k === 'tp') return;   // ▲▼는 pointerdown에서 처리 (꾹 누르기 지원)
      if (k === 'pl') {
        eb.parentNode.querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x === eb)); return;
      }
      if (k === 'tin' || k === 'tout') {
        eb.parentNode.querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x === eb)); return;
      }
      if (k === 'addsave') {
        const type = $('edAdd').querySelector('button[data-ed="tout"]').classList.contains('sel') ? '퇴근' : '출근';
        const wd = $('edWd').value, t = $('edTime').value, nd = $('edNd').checked, pl = pickedPlace($('edAdd'));
        if (!wd || !t) { alert('근무일과 시각을 넣어 주세요'); return; }
        if (!pl) { alert('장소를 골라 주세요'); return; }
        if (!confirm(edName + '님 ' + wd + ' ' + type + ' ' + (nd ? '다음날 ' : '') + t + ' · ' + pl + ' 기록을 넣을까요?')) return;
        edCall({ op: 'add', no: edNo, wd: wd, type: type, time: t, nextDay: nd, place: pl });
        return;
      }
      if (k === 'editform') {
        rec.querySelector('.edSlot').innerHTML = '<div class="eform"><div class="arow"><label>새 시각</label>' + timePick('class="edT"', eb.dataset.time) + ' ' +
          '<label><input type="checkbox" class="edN"' + (eb.dataset.nd === '1' ? ' checked' : '') + '> 다음날</label></div>' +
          placeChips(eb.dataset.place) +
          '<div class="arow"><button class="abtn go" data-ed="editsave">저장</button></div></div>';
        return;
      }
      if (k === 'editsave') {
        const t = rec.querySelector('.edT').value, nd = rec.querySelector('.edN').checked, pl = pickedPlace(rec);
        if (!t) return;
        if (!confirm(edName + '님 기록을 ' + (nd ? '다음날 ' : '') + t + (pl ? ' · ' + pl : '') + '(으)로 고칠까요?\n(원래 내용은 수정이력에 남아요)')) return;
        edCall({ op: 'edit', row: rec.dataset.row, expectAt: rec.dataset.at, time: t, nextDay: nd, place: pl });
        return;
      }
      if (k === 'delete') {
        if (!confirm(edName + '님 ' + eb.dataset.desc + ' 기록을 지울까요?\n(지운 기록은 수정이력에 남아요)')) return;
        edCall({ op: 'delete', row: rec.dataset.row, expectAt: rec.dataset.at });
        return;
      }
      return;
    }
    const b = ev.target.closest('button[data-op]');
    if (!b) return;
    const op = b.dataset.op, no = b.dataset.no, nm = b.dataset.name || '', v = b.dataset.v || '';
    if (op === 'records') { edYM = ''; openRecords(no, nm); return; }
    if (op === 'status' && b.classList.contains('sel')) return;
    const ask = op === 'reject' ? nm + '님 등록 신청을 거절할까요?' : op === 'reset' ? nm + '님 휴대폰 등록을 지울까요?\n(새 휴대폰에서 다시 이름을 고르면 됩니다)' :
      op === 'status' && v !== '재직' ? nm + '님을 ' + v + '(으)로 바꿀까요?' :
      op === 'admin' ? nm + '님을 관리자' + (v === '1' ? '로 지정할까요?' : '에서 해제할까요?') : '';
    if (ask && !confirm(ask)) return;
    b.disabled = true;
    let r;
    try { r = await api('adminDo', { deviceId: deviceId, op: op, no: no, value: v }); } catch (e) { r = null; }
    if (!r || !r.ok) { alert((r && r.error) || '처리하지 못했어요'); b.disabled = false; return; }
    loadAdmin();
  });
  $('adminBtn').addEventListener('click', () => { $('admin').classList.remove('hidden'); loadAdmin(); });
  $('adminClose').addEventListener('click', () => { $('admin').classList.add('hidden'); loadStatus(); });
  $('pendNote').addEventListener('click', () => { $('admin').classList.remove('hidden'); loadAdmin(); });
  $('pushBtn').addEventListener('click', async () => {
    try {
      const p = await Notification.requestPermission();
      if (p !== 'granted') { show('알림이 꺼져 있어요\n휴대폰 설정에서 알림을 허용해 주세요', 'warn'); return; }
      await pushSubscribe();
      $('pushBtn').classList.add('hidden');
      show('이제 등록 신청이 들어오면\n이 휴대폰으로 알려 드려요', 'ok');
    } catch (e) { show('알림 설정을 하지 못했어요\n잠시 뒤 다시 눌러 주세요', 'warn'); }
  });
  if (pushOk) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data === 'openAdmin') { wantAdmin = true; loadStatus(); } });
  // 관리자 폰은 화면을 켜 두면 1분마다 새 신청 확인
  setInterval(() => {
    if (view === 'main' && document.visibilityState === 'visible' && !$('adminBtn').classList.contains('hidden') && $('admin').classList.contains('hidden')) loadStatus();
  }, 60000);

  if (!isKakao) {
    render('main');                       // 등록된 폰이면 바로 출퇴근 화면 (서버 확인 후 필요하면 이름 고르기로)
    // 지난번 상태를 먼저 보여 주고 (기다리지 않게) 서버 답이 오면 바로 바꿈
    try { const ls = JSON.parse(store.get('lastStatus') || 'null'); if (ls && name) applyStatus(ls); } catch (e) {}
    loadStatus();
    warmPosition();
    // 다른 앱에 갔다가 돌아왔을 때도 다시 확인
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { loadStatus(); warmPosition(); }
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
